          <section class="box"><h3>Defense</h3><div class="legend"><span><i style="background:var(--s-away)"></i>${esc(g.away)}</span><span><i style="background:var(--s-home)"></i>${esc(g.home)}</span></div>${pctBars(g, "def")}<p class="note">Higher is a better defense.</p></section>
        </div></details>
      <details class="acc" open><summary><h3>How the line has moved</h3><span class="note">${moved}</span>${chev}</summary>
        <div class="acc-body">${moveChart(g)}<p class="note">The ${esc(favTeam)} spread at Pinnacle, the sharpest book, since it opened. When a line keeps moving toward the number we locked, that is ${term("clv", "line value")}.</p></div></details>
      <details class="acc"><summary><h3>Matchup</h3><span class="note">pass and run defense, quarterbacks</span>${chev}</summary>
        <div class="acc-body"><div class="two">${defPanel(g.away, g.defense.away, g.roles.away)}${defPanel(g.home, g.defense.home, g.roles.home)}</div>
          <section class="box"><h3>Quarterbacks</h3><div class="scroll"><table class="t"><thead><tr><th>Starter</th><th class="num">Rating</th><th class="num">Adjustment</th></tr></thead><tbody>${qb("away")}${qb("home")}</tbody></table></div>
            <p class="note">Rating is the QB's opponent-adjusted EPA per dropback against an average starter. Adjustment is what the model changes because this starter differs from whoever played in the games the team ratings come from; zero means the same QB.</p></section></div></details>
      <details class="acc"><summary><h3>Injuries</h3><span class="note">${nInj ? nInj + " listed" : "none listed yet"}</span>${chev}</summary>
        <div class="acc-body"><div class="two">${inj(g.away, g.injuries.away)}${inj(g.home, g.injuries.home)}</div></div></details>
      <details class="acc"><summary><h3>Prices and the numbers behind the calls</h3><span class="note">model, fair line and each book</span>${chev}</summary>
        <div class="acc-body">${numberTable(g)}
          <div class="scroll"><table class="t"><thead><tr><th>Book</th><th class="num">Spread</th><th class="num">${esc(g.away)} / ${esc(g.home)}</th><th class="num">Total</th><th class="num">Over / Under</th><th class="num">ML ${esc(g.away)} / ${esc(g.home)}</th></tr></thead><tbody>${books || '<tr><td colspan="6" class="note">No prices yet.</td></tr>'}</tbody></table></div>
          <p class="note">Highlighted rows are where this game's picks are priced. Pinnacle is the sharp reference, not a book we bet.</p></div></details>
      <p class="fine">Model output, not betting advice.</p>`;
  }

  // ---------- my picks (db: data/users/<you>/mypicks/picks/<game>__<market>)
  let MY = new Map(), DB = null, MYCOL = null, dbState = "connecting";
  const pending = new Set();
  async function initDb() {
    if (!window.claude || typeof window.claude.use !== "function") { dbState = "unavailable"; rerenderMine(); return; }
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { dbState = "unavailable"; rerenderMine(); return; }
      const uid = await user.id();
      if (!uid) { dbState = "signedout"; rerenderMine(); return; }
      DB = db;
      MYCOL = db.doc("data/users/" + uid + "/mypicks").collection("picks");
      if (D.props) initPropsDb(db, uid);
      MYCOL.onSnapshot((snap) => { MY = new Map(snap.docs.map((d) => [d.id, d.data()])); dbState = "ready"; rerenderAll(); },
        () => { dbState = "error"; rerenderMine(); });
    } catch (e) { dbState = "error"; rerenderMine(); }
  }
  function rerenderMine() { if (current === "mine") renderMine(); else if (current === "props-mine") renderPropsMine(); }
  function rerenderAll() { if (current === "mine") renderMine(); else if (current === "week") { const y = window.scrollY; renderWeek(); window.scrollTo(0, y); } }
  async function choose(gid, market, side) {
    const key = gid + "__" + market;
    if (!MYCOL || pending.has(key)) return;
    const g = D.mypicks.games.find((x) => x.id === gid);
    if (!g || Date.parse(g.kickoff.iso) <= Date.now()) return;
    const team = side === "home" ? g.home : side === "away" ? g.away : null;
    let line = null, price = -110, lbl;
    if (market === "spread") { line = side === "home" ? -g.spread : g.spread; lbl = `${team} ${line === 0 ? "PK" : (line > 0 ? "+" : "-") + half(line)}`; }
    else if (market === "total") { line = g.total; lbl = `${side === "over" ? "Over" : "Under"} ${half(g.total)}`; }
    else { price = side === "home" ? g.ml_home : g.ml_away; lbl = `${team} ML`; }
    const prev = MY.get(key);
    pending.add(key);
    try {
      if (prev && prev.side === side) await MYCOL.doc(key).delete();
      else await MYCOL.doc(key).set({ game_id: gid, week: g.week, market, side, line, price, label: lbl, kickoff: g.kickoff.iso, made_at: new Date().toISOString() });
    } catch (e) { dbState = "error"; }
    pending.delete(key);
    rerenderMine();
  }
  function myRecord() {
    const rows = [];
    for (const [key, p] of MY) {
      const r = D.mypicks.results[p.game_id];
      if (!r) continue;
      const res = grade(p.market, p.side, p.line, r.hs, r.as);
      const mp = (D.mypicks.model[p.game_id] || {})[p.market];
      const mres = mp ? grade(p.market, mp.side, mp.line, r.hs, r.as) : null;
      rows.push({ key, p, res, u: unitsFor(res, p.price), mp, mres, mu: mp ? unitsFor(mres, mp.american) : null });
    }
    return rows;
  }
  function tallyRows(rows, getRes, getU) {
    const t = { w: 0, l: 0, p: 0, n: 0, units: 0 };
    for (const r of rows) { const x = getRes(r); if (!x) continue; t.n++; t[{ W: "w", L: "l", P: "p" }[x]]++; t.units += getU(r); }
    return t;
  }
  function renderMine() {
    const rows = myRecord();
    const mkts = [["spread", "ATS"], ["total", "Over/under"], ["ml", "Moneyline"]];
    const tiles = (who) => mkts.map(([m, k]) => { const rr = rows.filter((r) => r.p.market === m && (who === "you" || r.mp));
      const t = who === "you" ? tallyRows(rr, (r) => r.res, (r) => r.u) : tallyRows(rr, (r) => r.mres, (r) => r.mu);
      return tile(k, t); }).join("");
    const dis = rows.filter((r) => r.mp && r.mp.side !== r.p.side);
    const h2h = tallyRows(dis, (r) => r.res, (r) => r.u), h2m = tallyRows(dis, (r) => r.mres, (r) => r.mu);
    const msg = { connecting: "Connecting to your saved picks…", unavailable: "Picks save to your Claude account. Open this board on claude.ai while signed in to make picks.",
      signedout: "Sign in to Claude to save picks.", error: "Your picks could not be saved or loaded just now. Reload the page to try again.", ready: "" }[dbState];
    const now = Date.now();
    const btn = (g, market, side, text) => {
      const key = g.id + "__" + market, mine = MY.get(key), mp = (D.mypicks.model[g.id] || {})[market];
      const locked = Date.parse(g.kickoff.iso) <= now || dbState !== "ready";
      return `<button class="pb" id="pb-${esc(g.id)}-${market}-${side}" data-g="${esc(g.id)}" data-m="${market}" data-s="${side}" aria-pressed="${mine && mine.side === side ? "true" : "false"}" ${locked ? "disabled" : ""}>${mp && mp.side === side ? '<span class="mt">Model</span>' : ""}${text}</button>`;
    };
    const games = D.mypicks.games.map((g) => {
      const sp = g.spread, aw = sp == null ? null : sp, hm = sp == null ? null : -sp;
      const lineTxt = (x) => (x == null ? "–" : x === 0 ? "PK" : (x > 0 ? "+" : MINUS) + half(x));
      const started = Date.parse(g.kickoff.iso) <= now;
      return `<div class="mp"><div class="mp-head">${badge(g.away)} at ${badge(g.home)} <small>${esc(g.kickoff.short)}${started ? " · locked" : ""}</small></div>
        <div class="mp-groups">
          <div class="grp"><span>Spread</span><div class="pair">${sp == null ? '<span class="note">No line</span>' : btn(g, "spread", "away", `${esc(g.away)} ${lineTxt(aw)}`) + btn(g, "spread", "home", `${esc(g.home)} ${lineTxt(hm)}`)}</div></div>
          <div class="grp"><span>Total</span><div class="pair">${g.total == null ? '<span class="note">No line</span>' : btn(g, "total", "over", `Over ${half(g.total)}`) + btn(g, "total", "under", `Under ${half(g.total)}`)}</div></div>
          <div class="grp"><span>Moneyline</span><div class="pair">${g.ml_home == null ? '<span class="note">No line</span>' : btn(g, "ml", "away", `${esc(g.away)} ${am(g.ml_away)}`) + btn(g, "ml", "home", `${esc(g.home)} ${am(g.ml_home)}`)}</div></div>
        </div></div>`;
    }).join("");
    const hist = rows.slice().sort((a, b) => (D.mypicks.results[b.p.game_id].week - D.mypicks.results[a.p.game_id].week)).map((r) => {
      const res = D.mypicks.results[r.p.game_id];
      return `<tr><td>${res.week}</td><td>${badge(res.away, 1)} at ${badge(res.home, 1)}</td><td><b>${label(r.p.label)}</b></td><td>${resChip(r.res)}</td><td class="num ${cls(r.u)}">${units(r.u)}</td><td>${r.mp ? label(r.mp.label) + " " + resChip(r.mres) : '<span class="note">–</span>'}</td></tr>`;
    }).join("");
    app.innerHTML = `
      <section class="hello"><h1>My picks</h1><p class="lede">Make your own picks for week ${D.meta.week} and see how you do against the model. Tap a side to pick it, tap again to clear it. Picks lock at kickoff and are graded at the line shown when you picked.</p></section>
      ${msg ? `<p class="banner">${msg}</p>` : ""}
      <section class="sec"><header><h2>You</h2></header><div class="strip three">${tiles("you")}</div></section>
      <section class="sec"><header><h2>The model <em>on the same picks</em></h2></header><div class="strip three">${tiles("model")}</div>
        <p class="note">When you and the model disagreed: you ${h2h.n ? `${h2h.w}-${h2h.l}${h2h.p ? "-" + h2h.p : ""} (${units(h2h.units)})` : "–"}, model ${h2m.n ? `${h2m.w}-${h2m.l}${h2m.p ? "-" + h2m.p : ""} (${units(h2m.units)})` : "–"}. Spreads and totals count at −110, moneylines at the price shown.</p></section>
      <section class="sec"><header><h2>Week ${D.meta.week} games</h2></header>${games}</section>
      <section class="sec"><header><h2>Graded picks</h2></header>${hist ? `<div class="scroll"><table class="t"><thead><tr><th>Wk</th><th>Game</th><th>Your pick</th><th>Result</th><th class="num">Units</th><th>Model</th></tr></thead><tbody>${hist}</tbody></table></div>` : '<p class="note">Your graded picks show up here after games finish.</p>'}</section>`;
    app.querySelectorAll(".pb").forEach((b) => b.addEventListener("click", () => choose(b.dataset.g, b.dataset.m, b.dataset.s)));
  }

  // ---------- defenses
  const DEF_CATS = {
    overall: ["Overall", [["pts_pg", "Pts/G", 1], ["yds_pg", "Yds/G", 1], ["epa", "EPA/play", "e"], ["sr", "Success", "%"], ["third_pct", "3rd down", "%"], ["rz_pct", "Red zone TD", "%"], ["takeaways", "Takeaways", 0], ["td_allowed", "TDs allowed", 0]]],
    rush: ["Pass rush", [["sacks", "Sacks", 0], ["sack_rate", "Sack rate", "%"], ["pressures", "Pressures", 0], ["pressure_rate", "Pressure rate", "%"], ["qb_hits_pg", "QB hits/G", 1], ["blitz_rate", "Blitz rate", "%"]]],
    pass: ["Pass defense", [["pass_yds_pg", "Pass yds/G", 1], ["ypa", "Yds/att", 1], ["cmp_pct", "Comp %", "%"], ["pass_td_pg", "Pass TD/G", 2], ["ints", "INT", 0], ["expl_pass_rate", "20+ yd passes", "%"], ["pass_epa", "EPA/dropback", "e"]]],
    run: ["Run defense", [["rush_yds_pg", "Rush yds/G", 1], ["ypc", "Yds/carry", 1], ["rush_td_pg", "Rush TD/G", 2], ["stuff_rate", "Stuffed runs", "%"], ["expl_rush_rate", "10+ yd runs", "%"], ["rush_epa", "EPA/run", "e"]]],
    fantasy: ["vs position", [["fpts_QB", "QB pts/G", 1], ["fpts_RB", "RB pts/G", 1], ["fpts_WR", "WR pts/G", 1], ["fpts_TE", "TE pts/G", 1], ["pass_yds_QB", "QB pass yds/G", 1], ["rush_yds_RB", "RB rush yds/G", 1], ["rec_yds_WR", "WR rec yds/G", 1], ["rec_yds_TE", "TE rec yds/G", 1], ["rec_yds_RB", "RB rec yds/G", 1]]],
    roles: ["vs WR1 / WR2 / TE", null],
  };
  let defCat = "overall", defSort = null;
  function fmtDef(v, f) { if (v == null) return "–"; if (f === "%") return pct(v, 1); if (f === "e") return signed(v, 3); return Number(v).toFixed(f); }
  function rkChip(rk) { if (rk == null) return ""; return `<span class="rk ${rk <= 8 ? "top" : rk >= 25 ? "bot" : ""}">${rk}</span>`; }
  function renderDefense() {
    let cols, rows;
    if (defCat === "roles") {
      const R = D.defense.roles;
      cols = ["WR1", "WR2", "WR3", "TE1", "RB1"].map((r) => [r, r + " yds/G", 1]);
      rows = D.defense.rows.map((x) => { const o = { team: x.team }; for (const r of R[x.team] || []) { o[r.role] = r.ypg; o[r.role + "_rk"] = r.rk; } return o; });
    } else { cols = DEF_CATS[defCat][1]; rows = D.defense.rows; }
    const sort = defSort && cols.some((c) => c[0] === defSort.col) ? defSort : { col: cols[0][0], dir: 1 };
    rows = rows.slice().sort((a, b) => ((a[sort.col + "_rk"] ?? 99) - (b[sort.col + "_rk"] ?? 99)) * sort.dir);
    const head = cols.map(([k, l]) => `<th class="num sort" data-col="${k}" ${sort.col === k ? `aria-sort="${sort.dir > 0 ? "ascending" : "descending"}"` : ""}>${esc(l)}${sort.col === k ? (sort.dir > 0 ? " ↑" : " ↓") : ""}</th>`).join("");
    const body = rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td><span class="tcell">${badge(r.team, 1)}${nick(r.team)}</span></td>${cols.map(([k, , f]) => `<td class="num">${fmtDef(r[k], f)}${rkChip(r[k + "_rk"])}</td>`).join("")}</tr>`).join("");
    app.innerHTML = `
      <section class="hello"><h1>Defenses</h1><p class="lede">Every defense this season through ${esc(D.meta.data_through)}. Small numbers are ranks: 1 is the best defense in that column, 32 the worst. Click a column to sort.</p></section>
      <div class="pills" role="group" aria-label="Category">${Object.entries(DEF_CATS).map(([k, [l]]) => `<button class="pill" id="pill-${k}" data-cat="${k}" aria-pressed="${k === defCat}">${esc(l)}</button>`).join("")}</div>
      <section class="sec"><div class="scroll"><table class="t"><thead><tr><th class="num">#</th><th>Team</th>${head}</tr></thead><tbody>${body}</tbody></table></div>
        <p class="note">${defCat === "fantasy" ? "Fantasy points allowed per game, PPR: 1 per catch, 0.1 per yard, 6 per TD; QBs 0.04 per passing yard, 4 per passing TD, −2 per interception." : defCat === "roles" ? "Receiving yards per game allowed to opponents' WR1, WR2, WR3, TE1 and RB1, with roles set by each opponent's target share. A record, not a forecast." : defCat === "rush" ? "Pressures come from Pro Football Reference. Blitz rate comes from FTN Data via nflverse; blitzing more is a style, so its rank only sorts the column." : "Pass yards are net of sacks, as official team defense stats count them."}
        Rank chips: green is top 8, red is bottom 8.</p></section>`;
    app.querySelectorAll(".pill").forEach((b) => b.addEventListener("click", () => { defCat = b.dataset.cat; defSort = null; renderDefense(); }));
    app.querySelectorAll("th.sort").forEach((th) => th.addEventListener("click", () => { const c = th.dataset.col; defSort = { col: c, dir: sort.col === c ? -sort.dir : 1 }; renderDefense(); }));
  }

  // ---------- record
  function weekTable(R) {
    if (!R.weeks.length) return '<p class="note">Nothing graded yet.</p>';
    return `<div class="scroll"><table class="t"><thead><tr><th>Week</th><th class="num">ATS</th><th class="num">O/U</th><th class="num">Picks of the week</th><th class="num">All picks</th><th class="num">Units</th><th class="num">Line value</th></tr></thead><tbody>
      ${R.weeks.map((w) => `<tr><td>${w.week}</td><td class="num">${rec(w.ats)}</td><td class="num">${rec(w.ou)}</td><td class="num">${rec(w.potw)}</td><td class="num">${rec(w.all)}</td><td class="num ${cls(w.all.units)}">${units(w.all.units)}</td><td class="num">${w.all.clv == null ? "–" : signed(w.all.clv, 2)}</td></tr>`).join("")}
    </tbody></table></div>`;
  }
  function calTable(R) {
    if (!R.calibration.length) return '<p class="note">Builds up as picks are graded.</p>';
    return `<div class="scroll"><table class="t"><thead><tr><th>Model said</th><th class="num">Picks</th><th class="num">Average stated</th><th class="num">Actually won</th></tr></thead><tbody>
      ${R.calibration.map((c) => `<tr><td>${pct(c.lo)}–${pct(c.hi)}</td><td class="num">${c.n}</td><td class="num">${pct(c.said, 1)}</td><td class="num">${pct(c.won, 1)}</td></tr>`).join("")}
    </tbody></table></div>`;
  }
  // Week browser: every week's picks, grouped by bet type, each group with its own subtotal.
  const CATS = [["spread", "Spread"], ["total", "Over/under"], ["ml", "Moneyline"], ["parlay", "Parlays"]];
  let recWeek = null;
  function recWeeks() {
    const out = [];
    const add = (rows, sim) => { for (const w of [...new Set(rows.map((r) => r.week))].sort((a, b) => a - b)) out.push({ key: (sim ? "s" : "l") + w, week: w, sim, rows: rows.filter((r) => r.week === w) }); };
    add(D.record.pre_rows || [], true);
    add(D.record.live_rows || [], false);
    return out;
  }
  function subtotal(rows) {   // every pick at 1u, leans included (the record is the model's full record)
    const g = rows.filter((r) => r.result), nl = rows.filter((r) => r.risk === 0).length;
    const t = { w: 0, l: 0, p: 0, units: 0 };
    for (const r of g) { t[{ W: "w", L: "l", P: "p" }[r.result]]++; t.units += r.units; }
    const pend = rows.length - g.length;
    return [g.length ? `${t.w}-${t.l}${t.p ? "-" + t.p : ""} · <span class="${cls(t.units)}">${units(t.units)}</span>` : "",
      nl ? `${nl} lean${nl > 1 ? "s" : ""} included` : "", pend ? `${pend} pending` : ""].filter(Boolean).join(" · ");
  }
  function catTable(rows, isParlay) {
    return `<div class="scroll"><table class="t"><thead><tr><th>Pick</th><th>${isParlay ? "Legs" : "Game"}</th><th class="num">Price</th><th class="num">Win chance</th>${isParlay ? "" : `<th class="num">${term("kelly", "Quarter Kelly")}</th>`}<th>Result</th><th class="num">Units</th>${isParlay ? "" : '<th class="num">Line value</th>'}</tr></thead><tbody>
      ${rows.map((h) => `<tr><td><b>${label(h.label)}</b>${h.potw ? ' <span class="tag">POTW</span>' : ""}${h.risk === 0 ? ' <span class="tag lean">Lean</span>' : ""}${h.verdict ? " " + vdTag(h.verdict, h.failed) : ""}</td>
        <td>${isParlay ? h.legs.map((l) => label(l)).join(" · ") : esc(h.game)}</td>
        <td class="num">${am(h.american)}${h.book ? " " + esc(h.book) : ""}</td><td class="num">${pct(h.p_win)}</td>
        ${isParlay ? "" : `<td class="num">${h.kelly_u ? stakeU(h.kelly_u) : "–"}</td>`}
        <td>${h.result ? resChip(h.result) : '<span class="res P">PENDING</span>'}</td>
        <td class="num ${cls(h.units)}">${h.units == null ? "–" : units(h.units)}</td>
        ${isParlay ? "" : `<td class="num">${h.clv == null ? "–" : signed(h.clv, 1)}</td>`}</tr>`).join("")}
    </tbody></table></div>`;
  }
  function weekBrowser() {
    const weeks = recWeeks();
    if (!weeks.length) return '<p class="note">No picks yet.</p>';
    if (!weeks.some((w) => w.key === recWeek)) recWeek = weeks[weeks.length - 1].key;
    const W = weeks.find((w) => w.key === recWeek);
    const sections = CATS.map(([k, name]) => {
      const rows = W.rows.filter((r) => (k === "parlay" ? r.market === "golden" || r.market === "lottery" : r.market === k))
        .sort((a, b) => (b.potw - a.potw) || ((a.risk === 0) - (b.risk === 0)) || ((b.p_win || 0) - (a.p_win || 0)));
      if (!rows.length) return "";
      return `<div class="box"><h3>${name} <span class="note">${subtotal(rows)}</span></h3>${catTable(rows, k === "parlay")}</div>`;
    }).join("");
    return `<div class="pills" role="tablist" aria-label="Week">${weeks.map((w) => `<button class="pill" id="wk-${w.key}" data-wk="${w.key}" aria-pressed="${w.key === recWeek}">Week ${w.week}</button>`).join("")}</div>
      <p class="note">Week ${W.week}${W.sim ? " (replayed before launch)" : ""}: ${subtotal(W.rows) || "no picks"}.</p>
      ${sections}`;
  }
  function renderRecord() {
    const A = D.record.all;
    app.innerHTML = `
      <section class="hello"><h1>Record</h1><p class="lede">Every pick, graded at the line it was locked at. Line value is how many points better our number was than the closing line; beating the close is the best early sign of a real edge, long before win-loss records settle.</p></section>
      <section class="sec"><header><h2>Season to date</h2></header>${strip(A)}
        <p class="note">Weeks 1–${D.meta.live_start - 1} were replayed before launch at Tuesday lines with only Tuesday information; picks are live from week ${D.meta.live_start}. Every pick counts at 1u here, ${term("lean", "leans")} included, so this is the model's full record; the board gives leans no stake because their price is against them. The Quarter Kelly section below is the +EV picks only.</p>
        ${leansNote(A)}</section>
      <section class="sec"><header><h2>Units over time</h2></header><div class="box">${unitsChart(A) || '<p class="note">Builds up as picks are graded.</p>'}</div></section>
      ${verdictSection(D.record.verdicts, "pick")}
      ${kellySection(A.kelly, D.meta.live_start, "picks", `<div class="strip three">${kTile(term("ats", "ATS"), A.kelly.ats)}${kTile("Over/under", A.kelly.ou)}${kTile("Moneyline", A.kelly.ml)}</div>`)}
      <section class="sec"><header><h2>Picks by week</h2></header>${weekBrowser()}</section>
      <section class="sec"><header><h2>Week by week</h2></header>${weekTable(A)}</section>
      <section class="sec"><header><h2>Calibration</h2></header><p class="note">When the model gives a pick a 55% chance, it should win about 55% of the time.</p>${calTable(A)}</section>`;
    app.querySelectorAll("[data-wk]").forEach((b) => b.addEventListener("click", () => { recWeek = b.dataset.wk; const y = window.scrollY; renderRecord(); window.scrollTo(0, y); }));
  }

  // ---------- how it works
  function renderModel() {
    const M = D.model, b = M.backtest, c = M.clv, pz = M.parlay, tr = M.trends;
    const atsPct = b ? b.ats.w / (b.ats.w + b.ats.l) : null;
    app.innerHTML = `
      <section class="hello"><h1>How it works</h1><p class="lede">What the model does, what the testing says, and the rules the picks follow.</p></section>
      <div class="prose">
        <h3>What the model does</h3>
        <ul><li>Rates every offense and defense from play-by-play data (expected points added and success rate on each snap), adjusted for the opponents each team has faced. Recent games count more.</li>
          <li>Rates quarterbacks separately, so a backup or a rookie starting changes the projection.</li>
          <li>Turns the ratings into projected points for each team, adding pace, special teams, home field, rest and the weather forecast.</li>
          <li>Turns projections into win chances that respect the key numbers (3 and 7 above all).</li></ul>
        ${b ? `<h3>How good is it?</h3><p>On ${b.games} games from ${esc(b.seasons)}, the closing line missed the final margin by <b>${num(b.margin_close, 2)}</b> points on average and the model missed by <b>${num(b.margin_model, 2)}</b>. Totals: <b>${num(b.total_close, 2)}</b> vs <b>${num(b.total_model, 2)}</b>. Taking the model's side against the closing spread went ${b.ats.w}-${b.ats.l} (${pct(atsPct, 1)}), short of the 52.4% needed at −110. <b>The model does not beat closing lines.</b></p>` : ""}
        ${c && c.spread ? `<h3>Where an edge can come from</h3><p>Lines move between Tuesday, when picks are posted, and kickoff. This season, when the Pinnacle spread moved after our Tuesday number, it moved toward the model in <b>${c.spread.toward} of ${c.spread.moved}</b> games, by ${signed(c.spread.clv, 2)} points on average. Totals moved toward the model in ${c.total.toward} of ${c.total.moved} (${signed(c.total.clv, 2)} points), which is no edge. That is why picks lock on Tuesday and are graded at Tuesday's line, and why line value is on the record page.</p>` : ""}
        <h3>How win chances are set</h3><p>The model's number is never taken at face value. Each pick starts from the market line and moves it part of the way toward the model: <b>${pct(c.k_spread)}</b> for spreads and <b>${pct(c.k_total)}</b> for totals, the share lines have actually moved this season (re-measured every week). Win chances use the spread of real NFL outcomes (±${M.sigma_margin} points) with extra weight on key numbers. Expected value then uses the best price across ${D.meta.books.length} books. Edges come out small, on purpose.</p>
        <h3>Picks of the week, the Golden Parlay and the +EV Lottery</h3><p>Picks of the week are the five strongest picks, one per game, positive expected value only; a week can have fewer. Strongest means the biggest edge relative to the payout, so a sliver of value on a +400 long shot does not outrank a real edge on a spread.</p>
        <p>Both parlays are built from the week's positive-EV picks, two or three legs from different games. The <b>Golden Parlay</b> is the best expected value priced +150 to +300, a ticket that should cash roughly a quarter to a third of the time; it stretches to +500 only when nothing fits, and some weeks have none. The <b>+EV Lottery</b> is the best expected value among 3 to 5 leg combinations priced over +500, with no cap: it misses most weeks and exists for the occasional big payout. It counts in the units total, so one hit can move the record a lot. ${pz ? `In testing on 2022–25, ${pz.profitable_holdout} of ${pz.rules} parlay rules made money, about what luck produces, and the rule that looked best on earlier seasons (${esc(pz.best_rule)}, ${pct(pz.best_tune_roi, 0)} ROI) went ${pz.best_hold_record} afterward.` : ""} A parlay only pays off long term when every leg beats its own price, so treat both as entertainment until the record says otherwise.</p>
        <h3>Things that did not hold up in testing</h3>
        <ul>${tr ? `<li>Hot streaks. Teams that had gone over in 75%+ of their games went over next time ${pct(tr.hot_over_next, 1)} of the time (${tr.hot_over_n} games). Teams covering 75%+ covered next ${pct(tr.hot_ats_next, 1)} (${tr.hot_ats_n}). The market already prices the streak, sometimes too much.</li>` : ""}
          <li>Letting each unit (pass, run, defense) update at its own speed. It fit the past better and predicted the future worse.</li>
          <li>Same-game combinations like favorite and over. They happen about as often as chance predicts.</li></ul>
        <h3>What the model does not know</h3>
        <ul><li>Injuries beyond the quarterback. A missing star receiver or left tackle is not in the numbers, so a large gap between the model and the market often means the market knows something.</li>
          <li>News after Tuesday. Lines that move on Friday injury news are not the model being right.</li>
          <li>Coaching changes, motivation and late-season resting.</li></ul>
        <h3>Rules</h3>
        <ul><li>Positive-EV straight picks risk 1 unit at the listed price; the Golden Parlay and the +EV Lottery each risk 0.5 units.</li>
          <li>From week 6, a negative-EV side is a ${term("lean", "lean")}: the board shows it with no stake, because a bet at that price is expected to lose. The record still counts every pick at 1 unit, leans included, so it stays the model's full record.</li>
          <li>Every positive-EV pick is also checked, because +EV is not the same as a good pick: Pinnacle must not have moved against it since it locked (when it moved toward the model's side, that side's later price still beat the close; when it moved against, it lost to the close), and no quarterback on either team can be Questionable or Doubtful. Pass both and it is a <b>good pick</b>; otherwise it is <b>+EV only</b>, with the reasons on the pick. Tested and left out: the size of the edge (game-line picks under 2% did as well at the close as bigger ones), reading Pinnacle's Tuesday juice into the price (it made picks worse), and the gap between the model and the market (it predicted nothing in 2022–25).</li>
          <li>${term("kelly", "Quarter Kelly")} sizes every positive-EV pick by its edge for the price (¼, ½, 1 or 2 units) and keeps its own record from week 1, apart from the flat one. In the 2022–26 backtest at closing prices it lost more per unit staked than flat 1u, because the model overrates its biggest edges; 2026's first five weeks went its way. It replaces flat units only if it keeps up from week 6 on.</li>
          <li>Picks lock when the week is published and are never changed. Each is graded at the line and price it was locked at.</li>
          <li>Results are graded Tuesday morning, after Monday night's game.</li></ul>
        <p class="fine">Data: nflverse play-by-play, schedules, rosters and injuries; FTN Data via nflverse (charting); Pro Football Reference (pressures); lines from OddsPapi; weather from Open-Meteo. Model output, not betting advice.</p>
      </div>`;
  }

  // ===================================================================== player props
  const PR = D.props || null;
  const PMK = { pass_yds: "Pass yds", rush_yds: "Rush yds", rec_yds: "Rec yds", receptions: "Receptions" };
  const PMK_ORDER = ["pass_yds", "rush_yds", "rec_yds", "receptions"];
  const BOOKN = { draftkings: "DraftKings", fanduel: "FanDuel", pinnacle: "Pinnacle" };
  const PLAYERS = PR ? Object.fromEntries(PR.players.map((p) => [p.id, p])) : {};
  const ROLE_ORDER = { QB1: 0, RB1: 1, RB2: 2, WR1: 3, WR2: 4, TE1: 5 };
  const noProps = () => { app.innerHTML = '<section class="hello"><h1>Player props</h1><p class="lede">No props data in this build.</p></section>'; };
  // A call that goes against the model's own median is a line-shopping play: one book's number is off the market's.
  const shopTag = (side, line, median) => (median != null && line != null && ((side === "over" && median < line) || (side === "under" && median > line))
    ? ' <span class="tag shop" title="The model alone leans the other way. This call comes from DraftKings or FanDuel hanging a number off the Pinnacle line, the edge source that held up in testing.">Line shop</span>' : "");
  const roleTag = (p) => `<span class="role">${esc(p.role)}</span>${p.promoted ? ' <span class="tag promo" title="Moved up because a teammate who ranked above him last game is not playing">Promoted</span>' : ""}`;
  function propPickChip(p) {
    return `<span class="chip${p.potw ? " potw" : ""}${p.promoted ? " promo" : ""}" data-tip="${esc(`EV ${signed(100 * p.ev, 1)}%. Stake 1u. Quarter Kelly, its own record: ${stakeU(p.kelly_u)}.` + checksTip(p.checks))}"><span class="m">${p.potw ? "Pick of the week" : PMK[p.market]}</span>
      <b>${esc(p.side === "over" ? "Over" : "Under")} ${num(p.line, 1).replace(/\.0$/, "")}</b><span class="pr">${am(p.american)} ${esc(p.book_name)}</span>${shopTag(p.side, p.line, p.model_median)}${stakePill(p)}${p.checks ? vdTag(p.checks.verdict, failedOf(p.checks)) : ""}${resChip(p.result)}</span>`;
  }
  // When this game's props lock: the last board update before it (Thursday or Saturday, 10am ET).
  const lockAt = (gid) => {
    const t = PR && PR.locks && PR.locks[gid];
    return t ? new Date(t).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET" : PR.meta.lock_note;
  };
  // Past a game's lock (or its kickoff) a player without a pick has no lean worth showing.
  const closed = (gid) => {
    const g = GAMES[gid], t = PR && PR.locks && PR.locks[gid];
    return !!((g && g.status !== "upcoming") || (t && Date.parse(t) <= Date.now()));
  };
  const NO_PICK = '<span class="chip pass" title="Props for this game have locked; this player has no pick."><span class="m">Props</span><b>No pick</b></span>';
  function bestLean(pl) {
    if (closed(pl.game_id)) return null;
    let best = null;
    for (const m of pl.markets) if (m.lean && (!best || m.lean.ev > best.lean.ev)) best = m;
    return best;
  }
  function leanChip(m, locked, p) {
    if (!m && p && closed(p.game_id)) return NO_PICK;
    if (!m) return '<span class="chip pass"><span class="m">Props</span><b>No line yet</b></span>';
    const L = m.lean;
    if (L.ev <= 0 || locked) return `<span class="chip pass" title="Best price available has no value against the market's number.">
      <span class="m">${PMK[m.market]}</span><b>No play</b><span class="pr">model ${num(m.median, 1)} · fair ${num(m.fair, 1)}</span></span>`;
    return `<span class="chip lean" title="Not locked yet: props lock ${esc(p ? lockAt(p.game_id) : PR.meta.lock_note)}."><span class="m">Lean · ${PMK[m.market]}</span>
      <b>${L.side === "over" ? "Over" : "Under"} ${num(L.line, 1).replace(/\.0$/, "")}</b><span class="pr">${am(L.american)} ${esc(L.book)} · EV ${signed(100 * L.ev, 1)}%</span>${shopTag(L.side, L.line, m.median)}</span>`;
  }
  function pStrip(R, sim) {
    if (!R) return "";
    const a = R.all;
    return `<div class="strip${sim ? " sim" : ""}">
      ${tile("Passing yds", R.pass_yds)}${tile("Rushing yds", R.rush_yds)}${tile("Receiving yds", R.rec_yds)}${tile("Receptions", R.receptions)}
      ${tile("Picks of the week", R.potw, "", true)}${tile("Golden parlay", R.parlay, "", true)}${tile("+EV lottery", R.lottery)}
      <div class="tile"><span class="k">Units</span><span class="v ${cls(a.units)}">${a.n ? units(a.units) : "–"}</span>
        <span class="s">${a.n ? "ROI " + pct(a.roi, 1) + " · " + (a.beat == null ? "no line moves yet" : pct(a.beat) + " of moved lines went our way") : "1u straight, 0.5u per parlay"}</span></div>
    </div>`;
  }
  function weekPicks() { return PR.players.filter((p) => p.pick).map((p) => p.pick); }
  function propsBest() {
    const picks = weekPicks();
    const potw = picks.filter((p) => p.potw).sort((a, b) => b.ev - a.ev);
    let rows, title, note;
    if (potw.length) {
      rows = potw; title = "Picks of the week";
      note = "The five strongest locked props by edge relative to the payout, one per game, positive expected value only.";
    } else {
      const leans = PR.players.map((p) => ({ p, m: bestLean(p) })).filter((x) => x.m && x.m.lean.ev > 0)
        .sort((a, b) => b.m.lean.ev - a.m.lean.ev).slice(0, 5);
      rows = leans.map(({ p, m }) => ({ label: `${p.name} ${m.lean.side === "over" ? "Over" : "Under"} ${m.lean.line} ${PMK[m.market].toLowerCase()}`,
        game_id: p.game_id, american: m.lean.american, book_name: m.lean.book, p_win: m.lean.p, ev: m.lean.ev, lean: true }));
      title = "Leans so far"; note = `Not locked. Props lock ${esc(PR.meta.lock_note)}, after the final injury reports; lines and leans move until then.`;
    }
    const list = rows.map((p, i) => { const g = GAMES[p.game_id];
      return `<div class="pick-row"><span class="n">${i + 1}</span><span class="lbl">${label(p.label)}</span>${resChip(p.result) || `<span class="mono">${am(p.american)}</span>`}
        <div class="sub">${g ? `<span>${badge(g.away, 1)} at ${badge(g.home, 1)} · ${esc(g.kickoff.short)}</span>` : ""}<span>${esc(p.book_name)} ${am(p.american)}</span><span>Win ${pct(p.p_win)}</span><span>EV ${signed(100 * p.ev, 1)}%</span>${p.checks ? `<span>${vdTag(p.checks.verdict, failedOf(p.checks))}</span>` : ""}</div></div>`; }).join("");
    const ticket = (P, empty) => {
      if (!P) return `<p class="note">${empty}</p>`;
      return `<div class="odds-big">${am(P.american)} ${resChip(P.result)}</div>
        <ul class="legs">${P.leg_picks.map((l) => `<li><span><b>${label(l.label)}</b></span><span class="mono">${am(l.american)} ${esc(l.book_name)}</span></li>`).join("")}</ul>
        <div class="kv"><div><span>Hits</span><b>${pct(P.p)}</b></div><div><span>0.5u pays</span><b>+${(0.5 * (P.dec - 1)).toFixed(2)}u</b></div><div><span>EV</span><b class="${cls(P.ev)}">${signed(100 * P.ev, 1)}%</b></div></div>`;
    };
    const G = PR.parlays.golden, Lt = PR.parlays.lottery;
    return `<div class="featured">
      <section class="panel gold"><h3>${title} <span class="tag">Top ${rows.length}</span></h3>${list || '<p class="note">Nothing with value yet. Zero is a valid week.</p>'}<p class="note">${note}</p></section>
      <div class="stack">
        <section class="panel gold"><h3>Golden parlay <span class="tag">+150 to +300</span></h3>${ticket(G, "Built when the weekend props lock (Saturday morning) from that week's positive-EV props, two or three legs from different games.")}</section>
        <section class="panel lotto"><h3>+EV lottery <span class="tag">Over +500</span></h3>${ticket(Lt, "The long shot: 3 to 5 positive-EV props from different games, priced over +500. Built with the Golden Parlay.")}</section>
      </div></div>`;
  }
  // ---------- this week's games, one dropdown each
  let pFilter = "all";
  const pOpen = new Set((() => { try { return JSON.parse(localStorage.getItem("kn-props-open") || "[]"); } catch (e) { return []; } })());
  let pOpenSeeded = pOpen.size > 0;
  function saveOpen() { try { localStorage.setItem("kn-props-open", JSON.stringify([...pOpen])); } catch (e) { /* blocked storage: it still works for this visit */ } }
  const hasCall = (p) => !!(p.pick || ((bestLean(p) || {}).lean || {}).ev > 0);
  const keepP = (p) => pFilter === "all" || (pFilter === "calls" && hasCall(p)) || (pFilter === "promoted" && p.promoted);
  const byRole = (a, b) => ROLE_ORDER[PLAYERS[a].role] - ROLE_ORDER[PLAYERS[b].role];
  const sideWord = (s) => (s === "over" ? "Over" : "Under");
  function prow(p) {
    return `<div class="prow"><a class="pn" href="#p-${esc(p.id)}">${esc(p.name)}</a> ${roleTag(p)}<span class="pc">${p.pick ? propPickChip(p.pick) : leanChip(bestLean(p), false, p)}</span></div>`;
  }
  function gameCalls(gid) {
    return (PR.games[gid] || []).map((id) => PLAYERS[id]).filter(hasCall).map((p) => {
      if (p.pick) return { p, ev: p.pick.ev, txt: `${sideWord(p.pick.side)} ${p.pick.line} ${PMK[p.pick.market].toLowerCase()}` };
      const m = bestLean(p);
      return { p, ev: m.lean.ev, txt: `${sideWord(m.lean.side)} ${m.lean.line} ${PMK[m.market].toLowerCase()}` };
    }).sort((a, b) => b.ev - a.ev);
  }
  function gacc(gid) {
    const g = GAMES[gid];
    const ids = (PR.games[gid] || []).filter((id) => keepP(PLAYERS[id]));
    const calls = gameCalls(gid), best = calls[0];
    const team = (t) => { const rows = ids.filter((id) => PLAYERS[id].team === t).sort(byRole).map((id) => prow(PLAYERS[id])).join("");
      return rows ? `<div class="tg"><div class="tg-h">${badge(t, 1)} ${nick(t)}</div>${rows}</div>` : ""; };
    const when = g.status === "final" ? "Final" : g.status === "live" ? "In progress" : esc(g.kickoff.short);
    return `<details class="acc gacc" data-g="${esc(gid)}"${pOpen.has(gid) ? " open" : ""}>
      <summary><span class="mu">${badge(g.away)}<span class="at">at</span>${badge(g.home)}</span>
        <span class="gm"><b>${nick(g.away)} at ${nick(g.home)}</b><span class="note">${when}</span></span>
        <span class="gs">${calls.length ? `<span class="cnt">${calls.length} call${calls.length > 1 ? "s" : ""}</span>` : '<span class="cnt none">No calls</span>'}${best ? `<span class="bestc">Best: ${esc(best.p.name)} ${esc(best.txt)}, ${term("ev", "EV")} ${signed(100 * best.ev, 1)}%</span>` : ""}</span>
        ${chev}</summary>
      <div class="acc-body">${team(g.away)}${team(g.home)}${ids.length ? "" : '<p class="note">No players in this game match the filter.</p>'}<a class="more" href="#pg-${esc(gid)}">Full breakdown with charts →</a></div></details>`;
  }
  function renderProps() {
    if (!PR) return noProps();
    const m = D.meta;
    const gids = D.games.filter((g) => PR.games[g.id]).map((g) => g.id);
    if (!pOpenSeeded) {   // first visit: open the next game to kick off
      const next = D.games.find((g) => PR.games[g.id] && g.status !== "final");
      if (next) pOpen.add(next.id);
      pOpenSeeded = true;
    }
    const days = [];
    for (const g of D.games) { if (!PR.games[g.id]) continue; const d = g.kickoff.day; if (!days.length || days[days.length - 1].day !== d) days.push({ day: d, ids: [] }); days[days.length - 1].ids.push(g.id); }
    const allOpen = gids.every((id) => pOpen.has(id));
    const pill = (k, l) => `<button class="pill" data-pf="${k}" aria-pressed="${pFilter === k}">${l}</button>`;
    app.innerHTML = `
      <section class="hello"><h1>Player props · Week ${m.week}</h1>
        <p class="lede">The main players in every game: QB1, RB1, WR1, WR2 and TE1 (RB2 in a real timeshare). Props lock at the last board update before each game: Thursday 10am ET for a Thursday game, Saturday 10am ET for Saturday, Sunday and Monday games (after Friday's injury reports, with Thursday night graded). Priced at DraftKings and FanDuel against Pinnacle's number.</p></section>
      <section class="sec"><header><h2>Record <em>season to date</em></h2><a class="more" href="#props-record">Full record →</a></header>
        ${pStrip(PR.record.all)}
        <p class="note">Weeks 1–${PR.meta.live_start - 1} were ${term("sim", "replayed before launch")} at Saturday-morning lines; picks are live from week ${PR.meta.live_start}.</p></section>
      <section class="sec"><header><h2>This week's best</h2></header>${propsBest()}</section>
      <section class="sec"><header><h2>Games</h2>
          <div class="ctl"><div class="pills" role="group" aria-label="Show">${pill("all", "All players")}${pill("calls", "Calls only")}${pill("promoted", "Promoted")}</div>
          <button class="btn" id="pexp">${allOpen ? "Collapse all" : "Expand all"}</button></div></header>
        <p class="note">Tap a game to open it. A call is a locked pick or a lean with value; ${term("promoted", "Promoted")} players moved up because a teammate is out.</p>
        ${days.map((d) => `<h3 class="day">${esc(d.day)}</h3><div class="gaccs">${d.ids.map(gacc).join("")}</div>`).join("")}</section>
      <p class="fine">Model output, not betting advice. Prices from DraftKings and FanDuel; Pinnacle is the market reference. Stats: nflverse.</p>`;
    app.querySelectorAll("details.gacc").forEach((d) => d.addEventListener("toggle", () => {
      if (d.open) pOpen.add(d.dataset.g); else pOpen.delete(d.dataset.g);
      saveOpen();
      const b = document.getElementById("pexp");
      if (b) b.textContent = gids.every((id) => pOpen.has(id)) ? "Collapse all" : "Expand all";
    }));
    app.querySelectorAll("[data-pf]").forEach((b) => b.addEventListener("click", () => { pFilter = b.dataset.pf; const y = window.scrollY; renderProps(); window.scrollTo(0, y); }));
    document.getElementById("pexp").addEventListener("click", () => {
      if (gids.every((id) => pOpen.has(id))) pOpen.clear(); else gids.forEach((id) => pOpen.add(id));
      saveOpen();
      const y = window.scrollY; renderProps(); window.scrollTo(0, y);
    });
  }

  // ---------- one card per player: each market as a range bar the eye can read
  const isShop = (side, line, median) => median != null && line != null && ((side === "over" && median < line) || (side === "under" && median > line));
  function callOf(p, m) {   // the locked pick on this market, else a lean with value
    if (p.pick && p.pick.market === m.market) return { side: p.pick.side, line: p.pick.line, book: p.pick.book_name, american: p.pick.american,
      p: p.pick.p_win / Math.max(1 - (p.pick.p_push || 0), 1e-9), ev: p.pick.ev, locked: true, potw: p.pick.potw, result: p.pick.result };
    if (m.lean && m.lean.ev > 0 && !closed(p.game_id)) return { side: m.lean.side, line: m.lean.line, book: m.lean.book, american: m.lean.american, p: m.lean.p, ev: m.lean.ev, locked: false };
    return null;
  }
  function marketSay(m, c) {
    const unit = m.market === "receptions" ? "catches" : "yards";
    const mid = `The model's ${term("median", "middle outcome")} is <b>${num(m.median, 1)}</b> ${unit} (${term("range80", "80% range")} ${num(m.q[0], 0)}–${num(m.q[4], 0)}); the market's number is <b>${m.fair == null ? "–" : num(m.fair, 1)}</b>.`;
    if (!c) {
      const L = m.lean;
      return mid + (L ? ` No play: the best price, ${esc(L.book)} ${sideWord(L.side)} ${L.line} at ${am(L.american)}, does not beat that number after the vig.` : " No lines posted yet.");
    }
    if (isShop(c.side, c.line, m.median) && m.fair != null) {
      return `${mid} ${esc(c.book)} hangs ${c.line}, ${num(Math.abs(m.fair - c.line), 1)} ${unit} ${c.line < m.fair ? "below" : "above"} the market, so the ${c.side} wins more often than its price implies even though the model alone leans the other way.`;
    }
    return `${mid} The model is ${num(Math.abs(m.median - c.line), 1)} ${unit} ${m.median > c.line ? "above" : "below"} ${esc(c.book)}'s ${c.line}, and the market's number agrees enough to leave value on the ${c.side}.`;
  }
  function rangeStrip(m, c) {

        <p>Mixing in the model's view helps by a rounding error in 2025 and not at all in 2026, and the extra weight its disagreement earns is zero within its error. The model is worse than the market on its own. That is why ${term("k", "k")} stays near zero and the model only supplies the shape of each player's range.</p>

        <p>Positive at every point in time in both seasons, while every other under returned ${pct(ou[2025], 1)} (2025) and ${pct(ou[2026], 1)} (2026) across all books. But every range includes zero, and the rule was found by looking at these same seasons. <b>Not a pick rule yet</b>: worth tracking off the record before any money goes on it.</p>
        ${SG.lock_2025 ? `<p><b>4. The model knows a little before the close, not much.</b> Pinnacle's line at the board's lock time, rebuilt for every 2025 prop from every line Pinnacle hung (right 99% of the time when checked against this season's full timelines): of ${SG.lock_2025.moved} lines that moved between the lock and kickoff, ${pct(SG.lock_2025.toward / SG.lock_2025.moved)} moved toward the model, and ${pct(SG.lock_2025.big_gap_toward / Math.max(1, SG.lock_2025.big_gap_moved))} when it disagreed most. ${term("k", "k")} = ${num(SG.lock_2025.k, 3)} (95% range ${num(SG.lock_2025.k_lo, 3)} to ${num(SG.lock_2025.k_hi, 3)}): real, but about a hundredth of the gap, the same as this season's measurement. Enough to break ties between prices, not to bet on its own.</p>` : ""}

    const mv = (st.moves || []).map((r) => `<tr><td>${{ open: "Opening line", tue: "5 days out", thu: "3 days out", sat: "Saturday morning", t3h: "3 hours out" }[r.when] || esc(r.when)}</td><td class="num">${r.moved}</td><td class="num">${pct(r.toward / Math.max(r.moved, 1), 1)}</td><td class="num">${pct(r.big_gap_toward / Math.max(r.big_gap_moved, 1), 1)}</td><td class="num">${num(r.k, 3)}</td></tr>`).join("");
    app.innerHTML = `
      <section class="hello"><h1>How the props model works</h1><p class="lede">What it does, what testing says, and the rules the props follow.</p></section>
      <div class="prose">
        <h3>What the model does</h3>
        <ul><li><b>Team volume.</b> Expected plays and pass rate from each team's pace and tendencies, the opponent's, and the game's spread and total (favorites run more, shootouts throw more).</li>
          <li><b>The player's share.</b> His share of targets and designed runs in the games he played, recent games weighted more, pulled toward a typical share while the sample is small. A teammate ruled out hands his share to the players left, which is how a WR3 becomes a tracked WR2 (tagged Promoted).</li>

        <h3>Paper trading and the gate</h3><p>Every flag is auto-accepted for the model's paper record at the price it was flagged: it used one of the game's three slots, so it always counts. The engine also checks whether that price was still there 30 seconds later (about how long a bet takes), to show how often the price could really be had. Your Accepts are your record. Real money waits for the gate: four weekends of paper trading and at least 40 graded plays with positive line value.</p>
        <h3>Requests</h3><p>ESPN is free and polled every 7 seconds. PropLine (free plan, ${LV.budget.budget} of 1,000 a day used at most, reset at midnight UTC) is polled for a game only after a new snap, at most every 20 seconds, with a 2-minute heartbeat (5 at halftime): about ${LV.budget.calls_per_game} requests a game. The engine stops before the cap and slows down below 20% left. Used today: ${LV.budget.used_today}.</p>
        <h3>What it cannot see</h3><ul><li>Routes and snap counts in real time; in-game injuries only as missing stats.</li><li>Prices at books PropLine does not carry. Books see official data seconds before ESPN does.</li></ul>
        <p class="fine">Model output, not betting advice. The engine never places a bet; you place every bet by hand after confirming the price.</p>
      </div>`;
  }

  const VIEWS = { week: renderWeek, mine: renderMine, defense: renderDefense, record: renderRecord, model: renderModel,
                  props: renderProps, "props-players": renderPropsPlayers, "props-mine": renderPropsMine, "props-defense": renderDefense,
                  "props-record": renderPropsRecord, "props-model": renderPropsModel, live: renderLive, "live-model": renderLiveModel };
  // The board updates three times a week (the scheduled build, 10:05am Eastern): say which one is next.
  function nextUpdate(now) {
    const f = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" })
      .formatToParts(now).map((x) => [x.type, x.value]));
    const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(f.weekday), mins = Number(f.hour) * 60 + Number(f.minute);
    for (let d = 0; d < 8; d++) {
      const w = (dow + d) % 7;
      if ((w === 2 || w === 4 || w === 6) && (d > 0 || mins < 10 * 60 + 5)) return { 2: "Tuesday", 4: "Thursday", 6: "Saturday" }[w];
    }
    return "Tuesday";
  }
  const UPDATES = "The board updates three times a week. Tuesday 10am ET: last week graded, then the week's game-line picks lock (Tuesday prices are where the model's spread edge shows up). Thursday 10am ET: the Thursday game's props lock. Saturday 10am ET: Thursday night graded; Saturday-to-Monday props and the props Picks of the Week, Golden Parlay and Lottery lock.";
  document.getElementById("brand-sub").innerHTML = `NFL model · ${D.meta.season} week ${D.meta.week} · <span data-tip="${UPDATES}" tabindex="0">next update ${nextUpdate(new Date())} 10am ET</span>`;
  route();
  initDb();
})();
</script>
