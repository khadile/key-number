<title>Key Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky program header with tabs over one centered column; game cards sit two-up on wide
   screens and stack on phones; a game's breakdown replaces the list.
   Look: one deliberate light world, a cream betting ticket. Cream paper, ivory cards, navy ink,
   gold for the parlays, brick red for losses, navy for wins. It stays cream in dark mode too. */
:root {
  color-scheme: light;
  --bg: #f4ecdc;
  --surface: #fffaf0;
  --surface-2: #f8f0df;
  --ink: #1d2433;
  --ink-2: #464c5b;
  --muted: #6e6858;
  --line: #e6dcc8;
  --line-2: #d6c9ae;
  --accent: #1f3a6b;
  --accent-ink: #fffaf0;
  --accent-soft: #e4e6ee;
  --band: #c6cce0;
  --gold: #85590a;
  --gold-line: #c99a3c;
  --gold-soft: #f6e6c2;
  --good: #1f3a6b;
  --good-soft: #e3e7f1;
  --bad: #a83a2c;
  --bad-soft: #f5dfd8;
  --you: #7d2a4a;
  --you-soft: #f3e0e7;
  --s-home: #2a78d6;
  --s-away: #e0612a;
  --shadow: 0 1px 2px rgba(60, 45, 20, 0.07);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  /* the live engine's status light and log (the one dark surface, like a scoreboard feed) */
  --on: #2f8a4e;
  --off: #8d877a;
  --term-bg: #1b2130;
  --term-ink: #ece4d2;
  --term-dim: #8e94a3;
  --t-play: #a9bde3;
  --t-odds: #8cc4ff;
  --t-flag: #f2c14e;
  --t-card: #c9a7e8;
  --t-fill: #8fd3c7;
  --t-warn: #f0a35e;
  --t-error: #ff7b6b;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding-inline: 16px; }
.brand { display: flex; align-items: baseline; gap: 12px; padding-block: 12px 4px; flex-wrap: wrap; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: 0.06em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { flex: none; padding: 10px 12px 9px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 72px; display: grid; gap: 28px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec h2 { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.sec h2 em { font-style: normal; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
.lede { font-size: 15px; color: var(--ink-2); max-width: 68ch; margin: 0; }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; margin: 0; }
.hello h1 { font-size: 34px; font-weight: 700; }
.hello { display: grid; gap: 6px; }

/* record strip */
/* Column counts the 8 tiles fill evenly (2, 4, then 8 across); My picks' 3 tiles go 3 across. */
.strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } .strip.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .strip { grid-template-columns: repeat(8, minmax(0, 1fr)); } .strip.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1.1; }
.tile .s { font-size: 12px; color: var(--ink-2); }
.tile.gold { border-color: var(--gold-line); background: var(--gold-soft); }
.strip.sim .tile { background: transparent; }
.strip.sim .tile .v { font-size: 22px; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* picks of the week + parlay */
.featured { display: grid; gap: 12px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 900px) { .featured { grid-template-columns: 1.5fr 1fr; } }
.stack { display: grid; gap: 12px; min-width: 0; }
.panel.lotto { border-style: dashed; }
.odds-big { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
.panel.gold { border-color: var(--gold-line); }
.panel h3 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tag { font-family: var(--f-body); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold-line); }
.pick-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.pick-row:first-of-type { border-top: 0; }
.pick-row .n { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 18px; }
.pick-row .lbl { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.pick-row .sub { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px 12px; flex-wrap: wrap; }
.legs { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.legs li { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.legs li b { font-family: var(--f-display); font-size: 19px; font-weight: 600; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.kv div { display: grid; }
.kv span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.kv b { font-family: var(--f-mono); font-size: 16px; font-weight: 500; }

/* result + pick chips */
.res { font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 4px; }
.res.W { background: var(--good-soft); color: var(--good); }
.res.L { background: var(--bad-soft); color: var(--bad); }
.res.P { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* game cards */
.day { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin-top: 6px; }
.cards { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; box-shadow: var(--shadow); }
.card-top { display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.card-top .live { color: var(--bad); font-weight: 600; }
.trow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.tname { font-weight: 600; font-size: 16px; }
.tname small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.score { font-family: var(--f-mono); font-size: 20px; font-weight: 500; }
.score.proj { color: var(--ink-2); }
.tb { display: inline-grid; place-items: center; min-width: 40px; height: 24px; padding-inline: 6px; border-radius: 5px; background: var(--tc); color: var(--ti); font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: 0.03em; box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.25); }
.tb.sm { min-width: 34px; height: 20px; font-size: 12px; }
.lines { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--line); }
.lines div { display: grid; }
.lines dt { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.lines dd { margin: 0; font-family: var(--f-mono); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 100%; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 13px; }
.chip .m { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chip b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.chip .pr { color: var(--ink-2); font-family: var(--f-mono); font-size: 12px; }
.chip.potw { border-color: var(--gold-line); background: var(--gold-soft); }
.chip.potw .m { color: var(--gold); }
.chip.you { border-color: var(--you); background: var(--you-soft); }
.chip.you .m { color: var(--you); }
.chip.pass { color: var(--muted); }
.more { justify-self: start; font-weight: 600; font-size: 14px; text-decoration: none; }
.more:hover { text-decoration: underline; }

/* breakdown */
.back { font-weight: 600; text-decoration: none; font-size: 14px; }
.gh { display: grid; gap: 4px; }
.gh h1 { font-size: 32px; font-weight: 700; }
.gh p { margin: 0; color: var(--muted); font-size: 14px; }
.board2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.board2 .side { display: grid; justify-items: center; gap: 6px; text-align: center; }
.board2 .big { font-family: var(--f-mono); font-size: 40px; font-weight: 500; line-height: 1; }
.board2 .at { color: var(--muted); font-family: var(--f-display); font-size: 18px; }
.two { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .two { grid-template-columns: 1fr 1fr; } }
.scroll { overflow-x: auto; min-width: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td.num, table.t th.num { text-align: right; }
table.t tr.hl td { background: var(--accent-soft); }
table.t tbody tr:hover td { background: var(--surface-2); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.box h3 { font-size: 18px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--ink-2); font-family: var(--f-body); font-size: 12px; }
svg.chart text.v { fill: var(--ink); font-family: var(--f-mono); }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.mx { display: grid; gap: 2px; }
.mx-row { display: grid; grid-template-columns: minmax(96px, 1.1fr) 1.4fr 56px 74px; gap: 8px; align-items: center; font-size: 13px; padding-block: 3px; }
.mx-row .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.mx-row .bar span { display: block; height: 100%; background: var(--s-home); border-radius: 0 4px 4px 0; }
.mx-row .val { font-family: var(--f-mono); text-align: right; }
.mx-row .rk { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.mx-row .l3 { grid-column: 3 / 5; color: var(--muted); font-size: 11px; text-align: right; margin-top: -4px; }
.inj { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.inj li { display: flex; gap: 8px; align-items: baseline; }
.st { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); min-width: 22px; text-align: center; }
.st.Out { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.st.Doubtful { background: var(--gold-soft); color: var(--gold); border-color: transparent; }

/* my picks */
.banner { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.mp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; }
.mp-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.mp-head small { color: var(--muted); font-weight: 400; }
.mp-groups { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .mp-groups { grid-template-columns: repeat(3, 1fr); } }
.grp { display: grid; gap: 4px; }
.grp > span { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pb { position: relative; font: 500 14px var(--f-mono); padding: 9px 6px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); cursor: pointer; }
.pb:hover:not(:disabled) { border-color: var(--you); }
.pb[aria-pressed="true"] { background: var(--you); color: #fff; border-color: var(--you); }
.pb:disabled { cursor: not-allowed; opacity: 0.55; }
.pb .mt { position: absolute; top: -8px; right: 6px; font: 700 10px var(--f-body); letter-spacing: 0.05em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 1px 5px; border-radius: 3px; }

/* defense */
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 600 13px var(--f-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--ink); }
th.sort[aria-sort] { color: var(--ink); }
.rk { display: inline-block; min-width: 26px; padding: 1px 5px; margin-left: 6px; border-radius: 4px; font: 600 11px var(--f-body); text-align: center; background: var(--surface-2); color: var(--muted); }
.rk.top { background: var(--good-soft); color: var(--good); }
.rk.bot { background: var(--bad-soft); color: var(--bad); }
.tcell { display: flex; align-items: center; gap: 8px; }

/* prose */
.prose { display: grid; gap: 14px; max-width: 72ch; }
.prose h3 { font-size: 20px; font-weight: 600; margin-top: 6px; }
.prose p, .prose li { margin: 0; color: var(--ink-2); }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.prose b { color: var(--ink); }
.fine { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .pb, .pill, .tabs a { transition: background-color .12s, color .12s, border-color .12s; } }

/* sections: game lines / player props / live */
.sections { display: inline-flex; gap: 4px; padding: 3px; margin: 2px 0 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.sections a { padding: 6px 14px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.sections a[aria-current="true"] { background: var(--ink); color: var(--bg); }
/* props */
.role { font: 700 11px var(--f-body); letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tag.shop { background: var(--accent-soft); color: var(--accent); border-color: transparent; margin-left: 4px; }
.tag.promo, .chip.promo .m { background: var(--you-soft); color: var(--you); border-color: transparent; }
.chip.promo { border-color: var(--you); }
.chip.lean { border-style: dashed; }
.chip.lean .m { color: var(--accent); }
/* stakes (model/staking.py): 1u on a positive-EV pick, nothing on a lean; quarter Kelly is its own record */
.stk { font: 600 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.stk.none { background: transparent; color: var(--muted); border: 1px dashed var(--line-2); }
.call.lean { border-style: dashed; background: var(--surface-2); box-shadow: none; }
.tag.lean { background: transparent; color: var(--muted); border: 1px dashed var(--line-2); }
tr.lean td { color: var(--muted); }
/* is a +EV pick also a good pick? (model/checks.py) */
.vd { font: 700 10px var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
.vd.good { background: var(--good-soft); color: var(--good); }
.vd.ev { background: transparent; color: var(--muted); border: 1px solid var(--line-2); }
.checkbox { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.checkbox .verdict { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; font-size: 13px; color: var(--ink-2); align-items: start; }
.checks .ck { font-weight: 700; text-align: center; }
.checks .ck.ok { color: var(--good); }
.checks .ck.no { color: var(--bad); }
.checks .ck.na { color: var(--muted); }
.nowline { font-size: 13px; color: var(--ink-2); margin: 0; }
.plist { display: grid; gap: 2px; }
.prow { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .pn { font-weight: 600; text-decoration: none; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.prow .pn small { font-weight: 400; color: var(--muted); }
.prow .pc { margin-left: auto; }
.prow .pair { margin-left: auto; display: inline-grid; grid-template-columns: 1fr 1fr; gap: 6px; min-width: 220px; }
.pb.sm { font-size: 13px; padding: 7px 6px; }
table.t tr.ph td { background: var(--surface-2); border-bottom: 1px solid var(--line-2); }
.search { width: 100%; max-width: 420px; font: 15px var(--f-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }
/* live */
.strip.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) { .strip.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.gate { display: block; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.gate span { display: block; height: 100%; background: var(--gold-line); }
ul.steps { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); }
code { font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* ---------- help: dotted terms and chart marks explain themselves on hover or tap */
.tip { position: fixed; left: 0; top: 0; z-index: 60; max-width: min(300px, calc(100vw - 16px)); padding: 8px 11px; border-radius: 8px; background: var(--ink); color: var(--surface); font: 13px/1.45 var(--f-body); box-shadow: 0 8px 24px rgba(29, 36, 51, .22); pointer-events: none; opacity: 0; transform: translateY(4px); }
.tip.on { opacity: 1; transform: none; }
.term { border-bottom: 1px dotted var(--muted); cursor: help; }
.term:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
svg [data-tip], .gauge-wrap, .mx-row { cursor: help; }

/* ---------- motion: views rise in, bars grow, lines draw; all of it off for reduced motion */
@keyframes rise { from { opacity: .85; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: no-preference) {
  .tip { transition: opacity .12s ease, transform .12s ease; }
  .enter > * { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(min(var(--i, 0), 8) * 50ms); }
  .gx, .gxr, .gy, .popin { transform-box: fill-box; }
  .gx { transform-origin: left center; animation: growx .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 50ms + 150ms); }
  .gxr { transform-origin: right center; animation: growx .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 50ms + 150ms); }
  .gy { transform-origin: center bottom; animation: growy .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 50ms + 150ms); }
  .draw { stroke-dasharray: 1; animation: draw 1.2s ease-out both .2s; }
  .popin { transform-origin: center; animation: pop .45s ease-out both; animation-delay: calc(var(--d, 0) * 60ms + 450ms); }
  details.acc[open] > .acc-body { animation: rise .3s ease-out both; }
  details.acc > summary .chev { transition: transform .2s ease; }
  .card, .call, .pcard { transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover, .call:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(60, 45, 20, .11); }
}

<script id="kn-data" type="application/json">__BOARD_DATA__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("kn-data").textContent);
  const T = D.teams;
  const app = document.getElementById("app");
  const GAMES = Object.fromEntries(D.games.map((g) => [g.id, g]));

  // ---------- formatting
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MINUS = "−";
  const num = (x, d) => (x == null || Number.isNaN(x) ? "–" : Number(x).toFixed(d));
  const half = (x) => { const r = Math.round(x * 2) / 2; return Number.isInteger(r) ? String(Math.abs(r)) : Math.abs(r).toFixed(1); };
  const signed = (x, d = 1) => (x == null ? "–" : (x > 0 ? "+" : x < 0 ? MINUS : "") + Math.abs(x).toFixed(d));
  const am = (n) => (n == null ? "–" : (n > 0 ? "+" : n < 0 ? MINUS : "") + Math.abs(n));
  const pct = (x, d = 0) => (x == null ? "–" : (100 * x).toFixed(d) + "%");
  const units = (u) => (u == null ? "–" : (u > 0 ? "+" : u < 0 ? MINUS : "") + Math.abs(u).toFixed(2) + "u");
  const cls = (x) => (x > 0 ? "pos" : x < 0 ? "neg" : "");
  const label = (s) => esc(String(s).replace(/-(?=\d)/g, MINUS));
  // a home-perspective spread ("home favored by s") as the favorite's line
  function fav(home, away, s, d) {
    if (s == null) return "–";
    if (Math.abs(s) < 0.05) return "Pick'em";
    const v = d == null ? half(s) : Math.abs(s).toFixed(d);
    return (s > 0 ? home : away) + " " + MINUS + v;
  }
  const badge = (t, sm) => { const m = T[t] || { color: "#777", ink: "#fff" }; return `<span class="tb${sm ? " sm" : ""}" style="--tc:${m.color};--ti:${m.ink}">${esc(t)}</span>`; };
  const nick = (t) => esc((T[t] && T[t].nick) || t);
  const rec = (r) => (!r || r.n === 0 ? "–" : `${r.w}-${r.l}${r.p ? "-" + r.p : ""}`);
  const resChip = (r) => (r ? `<span class="res ${r}">${{ W: "WIN", L: "LOSS", P: "PUSH" }[r]}</span>` : "");
  const decOf = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
  // stakes in units; quarter-Kelly tiers read as fractions (¼u, ½u)
  const stakeU = (u) => (u == null ? "–" : ({ 0.25: "¼", 0.5: "½" }[u] || String(Math.round(u * 100) / 100)) + "u");
  const stakePill = (p) => (p.risk === 0 ? '<span class="stk none">0u</span>' : `<span class="stk">${stakeU(p.risk == null ? 1 : p.risk)}</span>`);
  // ---------- is a +EV pick also a good pick? (model/checks.py) Each check passes, fails, or does not apply.
  const CHECK_NAME = { sharp: "Pinnacle's price", size: "Edge size", lean: "Over premium", market: "Market since lock", who: "Who plays" };
  const CHECK_IN_TEXT = { sharp: "Pinnacle's price", size: "edge size", lean: "over premium", market: "market since lock", who: "who plays" };
  const failedNames = (keys) => (keys || []).map((k) => CHECK_IN_TEXT[k] || k).join(", ");
  const vdTag = (v, failed) => (v === "good" ? '<span class="vd good" data-tip="+EV and passes every check">Good pick</span>'
    : v === "ev" ? `<span class="vd ev" data-tip="${esc(failed && failed.length ? "+EV, but fails: " + failedNames(failed) : "+EV, but fails a check")}">+EV only</span>` : "");
  const failedOf = (c) => c.checks.filter((k) => k.ok === false).map((k) => k.key);
  const checksTip = (c) => (!c ? "" : c.verdict === "good" ? " Good pick: passes every check."
    : " +EV only: " + c.checks.filter((k) => k.ok === false).map((k) => k.text).join(" "));
  function checksBlock(c) {
    if (!c) return "";
    const mark = (k) => (k.ok === true ? ["ok", "✓", "passes"] : k.ok === false ? ["no", "✗", "fails"] : ["na", "–", "does not apply"]);
    const li = c.checks.map((k) => { const [cl, sym, said] = mark(k);
      return `<li><span class="ck ${cl}" role="img" aria-label="${said}">${sym}</span><span><b>${CHECK_NAME[k.key] || k.key}.</b> ${esc(k.text)}</span></li>`; }).join("");
    const f = failedOf(c);
    const n = c.now;
    const now = n ? `<p class="nowline">Now, as of the last update: <b>${label(n.label)}</b> ${am(n.american)} at ${esc(n.book)}, ${term("ev", "EV")} <span class="${cls(n.ev)}">${signed(100 * n.ev, 1)}%</span>${n.ev <= 0 ? ": the value is gone at today's price" : ""}.</p>` : "";
    return `<div class="checkbox"><div class="verdict">${vdTag(c.verdict, f)}<span class="note">${c.verdict === "good" ? "+EV and passes every check" : `+EV, but ${failedNames(f)} ${f.length > 1 ? "fail" : "fails"}`}</span></div>
      <ul class="checks">${li}</ul>${now}</div>`;
  }
  function verdictSection(V, what) {
    if (!V || !V.all) return "";
    const S = V.since || {}, ns = ((S.good || {}).n || 0) + ((S.ev || {}).n || 0);
    const t = (k, r) => tile(k, r, r && r.n ? ` · ROI ${pct(r.roi, 1)}` : "");
    return `<section class="sec"><header><h2>Good picks vs +EV only <em>the checks on every +EV ${what}</em></h2></header>
      <div class="strip three">${t("Good picks", V.all.good)}${t("+EV only", V.all.ev)}
        <div class="tile"><span class="k">Week 6 on, the test</span><span class="v">${ns ? `${rec(S.good)} / ${rec(S.ev)}` : "–"}</span>
          <span class="s">${ns ? `good ${units(S.good.units)} · +EV only ${units(S.ev.units)}` : "No graded picks yet"}</span></div></div>
      <p class="note">Every +EV ${what} is checked against what has held up ${what === "prop" ? "for props: Pinnacle has the prop, the edge is 2% or more, an over on receiving, rushing or receptions clears the premium books put on overs, and nothing about who plays is in doubt" : "for game lines: Pinnacle has not moved against it since it locked, and no quarterback is in doubt"}. Pass them all and it is a good pick; otherwise it is +EV only. Flat 1u. Weeks 1–5 are rebuilt from what was known before each kickoff, but the checks were chosen with those weeks in view, so week 6 on is their real test.</p></section>`;
  }

  // ---------- plain-language help: hover or tap any dotted term or chart mark
  const GLOSSARY = {
    ats: "Against the spread. The favorite has to win by more than the spread; the underdog covers by losing by less (or winning).",
    ev: "Expected value: what a 1-unit bet returns on average if our win chance is right. +5% means +0.05 units a bet over the long run, not on any single bet.",
    win: "The chance this bet wins by our numbers: the market's line nudged toward the model. Pushes are left out.",
    need: "The win rate this price needs just to break even. At -110 that is 52.4%. A bet has value only when its win chance is higher.",
    fair: "Our fair number: the market's line moved part of the way toward the model, by the share lines have actually moved toward it this season.",
    novig: "No-vig: a book's two prices with its built-in margin taken out, which turns them into the market's true chances.",
    clv: "Line value: how much better our number was than the line at kickoff. Beating the closing line is the best early sign of a real edge, long before wins and losses settle.",
    units: "1 unit is one standard bet. The record counts every straight pick at 1 unit, leans included, and each parlay at 0.5, so units won shows the model's profit whatever your bet size.",
    lean: "A lean: the side the model prefers, at a price with negative expected value. The board gives it no stake because the price is against it, but the record still counts it at 1 unit, so the record is the model's full output.",
    kelly: "Quarter Kelly: a stake sized to the edge for the price, a quarter of what the Kelly formula says, rounded to ¼, ½, 1 or 2 units (1u = 1% of the bankroll). A solid favorite with an edge gets more, a long shot less. Kept as its own record beside the flat one, because sizing by the model's confidence amplifies its mistakes as much as its edge.",
    roi: "Return on investment: units won divided by units risked.",
    potw: "Picks of the week: the strongest picks by edge relative to the payout, one per game.",
    golden: "Golden Parlay: two or three positive-value picks from different games, priced +150 to +300. It should cash now and then.",
    lottery: "+EV Lottery: three to five positive-value picks priced over +500. It misses most weeks and is here for the occasional big payout.",
    k: "The share of the gap between the model and the market that lines have actually closed by kickoff this season. A small number means the market already knows most of what the model knows.",
    median: "The model's middle outcome: half of its 4,000 simulated games land above it and half below.",
    range80: "In 8 of 10 simulated games the stat lands inside this range.",
    shop: "Line shop: DraftKings or FanDuel hung a number away from the market's (Pinnacle's) line. The model alone may lean the other way; the value comes from the price.",
    promoted: "Promoted: he moved up because a teammate who ranked above him last game is not playing.",
    brier: "Brier score: how close stated chances were to what happened. 0 is perfect and 0.25 is a coin flip, so lower is better.",
    sim: "Replayed with the same rules on games already played. These were not live picks.",
    shadow: "The play that passed every check but came second in its game, so the one-a-game cap kept it off. Logged and graded at the price it was seen, never counted in the record: it tests whether a second play a game would pay.",
    paper: "Paper trading: the engine records every play it flags as if it were bet, with no money down, to test the idea first.",
    logloss: "Log loss: how surprised a forecast was by what happened, averaged over every prop. Lower is better; a coin flip scores 0.693. Differences in the third decimal are real over thousands of props.",
    plusunder: "A plus-money under: the book prices the under at even money or longer, which means it has made the over the favorite.",
  };
  const term = (key, text) => `<span class="term" tabindex="0" data-term="${key}">${text}</span>`;
  const tipEl = document.createElement("div");
  tipEl.className = "tip";
  tipEl.setAttribute("role", "tooltip");
  document.body.appendChild(tipEl);
  let tipFor = null;
  function showTip(el, x, y) {
    const text = el.dataset.term ? GLOSSARY[el.dataset.term] : el.dataset.tip;
    if (!text) return;
    tipFor = el;
    tipEl.textContent = text;
    tipEl.classList.add("on");
    const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    const ax = x != null ? x : r.left + r.width / 2, ay = y != null ? y : r.top;
    let top = ay - h - 12;
    if (top < 8) top = (y != null ? y : r.bottom) + 14;
    tipEl.style.left = Math.max(8, Math.min(ax - w / 2, window.innerWidth - w - 8)) + "px";
    tipEl.style.top = top + "px";
  }
  function hideTip() { tipFor = null; tipEl.classList.remove("on"); }
  const tipTarget = (t) => (t && t.closest ? t.closest("[data-tip],[data-term]") : null);
  document.addEventListener("pointerover", (e) => { if (e.pointerType === "touch") return; const el = tipTarget(e.target); if (el) showTip(el, e.clientX, e.clientY); });
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" || !tipFor) return;
    const el = tipTarget(e.target);
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("pointerout", (e) => { if (e.pointerType !== "touch" && tipFor && !(e.relatedTarget && tipFor.contains(e.relatedTarget))) hideTip(); });
  document.addEventListener("click", (e) => {   // taps show and hide help on phones
    const el = tipTarget(e.target);
    if (el && !e.target.closest("a, button, summary, input, label")) { if (tipFor === el && e.pointerType === "touch") hideTip(); else showTip(el); return; }
    hideTip();
  });
  document.addEventListener("focusin", (e) => { const el = tipTarget(e.target); if (el) showTip(el); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });

  // ---------- motion: views rise in, numbers count up; nothing moves for reduced-motion viewers
  const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  function animateIn() {
    if (REDUCED) return;
    app.classList.remove("enter");
    void app.offsetWidth;   // restart the entrance
    [...app.children].forEach((c, i) => c.style.setProperty("--i", i));
    app.classList.add("enter");
    countUp(app);
  }
  function countUp(root) {
    if (REDUCED) return;
    root.querySelectorAll("[data-count]").forEach((el) => {
      const end = Number(el.dataset.count), fmt = el.dataset.fmt || "n0", final = el.textContent;
      if (!Number.isFinite(end) || end === 0) return;
      const f = (v) => (fmt === "u" ? units(v) : fmt === "s2" ? signed(v, 2) : fmt === "s1" ? signed(v, 1) : num(v, Number(fmt.slice(1)) || 0));
      const t0 = performance.now(), dur = 750;
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        if (k < 1) { el.textContent = f(end * (1 - Math.pow(1 - k, 3))); requestAnimationFrame(step); } else el.textContent = final;
      };
      requestAnimationFrame(step);
      setTimeout(() => { el.textContent = final; }, dur + 150);   // land on the real value even if frames are throttled
    });
  }
  // Win chance against the break-even rate, drawn on a 30-80% scale where betting decisions live.
  function gauge(p, need) {
    if (p == null || need == null) return "";
    const lo = 0.3, hi = 0.8, pos = (x) => Math.max(0, Math.min(100, (100 * (x - lo)) / (hi - lo)));
    return `<div class="gauge-wrap" data-tip="Win chance ${pct(p, 1)} against the ${pct(need, 1)} this price needs to break even. The bar has to pass the line to have value.">
      <div class="gauge"><span class="fill gx${p > need ? "" : " low"}" style="width:${pos(p).toFixed(1)}%"></span><span class="need" style="left:${pos(need).toFixed(1)}%"></span></div>
      <div class="gauge-lbl"><span>${term("win", "Win chance")} <b>${pct(p, 1)}</b></span><span>${term("need", "Needs")} <b>${pct(need, 1)}</b></span></div></div>`;
  }
  // Cumulative units by week, one line for the whole record (weeks before launch included).
  function unitsChart(A, specs) {
    const cum = (weeks, get) => { let c = 0; return weeks.map((w) => { const r = get(w); c += r.units; return { wk: w.week, u: c, r }; }); };
    const series = (specs || (A && A.weeks.length ? [{ name: "Units", cls: "ser-live", weeks: A.weeks, get: (w) => w.all }] : []))
      .filter((s) => s.weeks && s.weeks.length).map((s) => ({ ...s, pts: cum(s.weeks, s.get) }));
    const all = series.flatMap((s) => s.pts);
    if (!all.length) return "";
    const wmin = Math.min(...all.map((p) => p.wk)) - 1, wmax = Math.max(...all.map((p) => p.wk));
    const lo = Math.min(0, ...all.map((p) => p.u)), hi = Math.max(0, ...all.map((p) => p.u)), pad = Math.max(1, (hi - lo) * 0.15);
    const W = chartW(false), H = 210, x0 = 46, x1 = W - 70, y0 = 14, y1 = H - 30;
    const X = (w) => x0 + ((w - wmin) / Math.max(1, wmax - wmin)) * (x1 - x0);
    const Y = (u) => y0 + ((hi + pad - u) / (hi - lo + 2 * pad)) * (y1 - y0);
    const step = Math.max(1, Math.ceil((hi - lo + 2 * pad) / 4 / 5) * 5);
    const ticks = [];
    for (let v = Math.ceil((lo - pad) / step) * step; v <= hi + pad; v += step) ticks.push(v);
    const body = series.map((s, si) => {
      const pts = [{ wk: s.pts[0].wk - 1, u: 0 }, ...s.pts];
      const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.wk).toFixed(1)} ${Y(p.u).toFixed(1)}`).join(" ");
      const last = s.pts[s.pts.length - 1];
      return `<path class="draw ${s.cls}" pathLength="1" d="${d}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${s.pts.map((p, i) => `<circle class="popin ${s.cls}" style="--d:${i + si * 3}" cx="${X(p.wk).toFixed(1)}" cy="${Y(p.u).toFixed(1)}" r="5" data-tip="${esc(s.name)}, week ${p.wk}: ${rec(p.r)} for ${units(p.r.units)}; ${units(p.u)} in total"/>`).join("")}
        <text class="v" x="${(X(last.wk) + 9).toFixed(1)}" y="${(Y(last.u) + 4).toFixed(1)}">${units(last.u)}</text>`;
    }).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Units won over time">
      ${ticks.map((v) => `<line class="grid" x1="${x0}" x2="${x1}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${x0 - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v > 0 ? "+" : v < 0 ? MINUS : ""}${Math.abs(v)}u</text>`).join("")}
      <line class="axis" x1="${x0}" x2="${x1}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>
      ${[...new Set(all.map((p) => p.wk))].map((w) => `<text x="${X(w).toFixed(1)}" y="${H - 8}" text-anchor="middle">W${w}</text>`).join("")}
      ${body}
    </svg><div class="legend">${series.map((s) => `<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  }

  // ---------- grading (mirrors board/ledger.py)
  function grade(market, side, line, hs, as) {
    const margin = hs - as;
    let d;
    if (market === "spread") d = (side === "home" ? margin : -margin) + line;
    else if (market === "total") d = side === "over" ? hs + as - line : line - (hs + as);
    else d = side === "home" ? margin : -margin;
    return d > 0 ? "W" : d === 0 ? "P" : "L";
  }
  const unitsFor = (r, price) => (r === "W" ? decOf(price) - 1 : r === "P" ? 0 : -1);

  // ---------- sections, tabs + routing
  const SECTIONS = {
    lines: [["week", "This week"], ["mine", "My picks"], ["defense", "Defenses"], ["record", "Record"], ["model", "How it works"]],
    props: [["props", "This week"], ["props-players", "Players"], ["props-mine", "My picks"], ["props-defense", "Defenses"], ["props-record", "Record"], ["props-model", "How it works"]],
    live: [["live", "Live"], ["live-model", "How it works"]],

  // The public website (board/site.py sets KN_PUBLIC) has no My Picks: it needs claude.ai's storage.
  const PUBLIC = !!window.KN_PUBLIC;
  if (PUBLIC) for (const k of Object.keys(SECTIONS)) SECTIONS[k] = SECTIONS[k].filter(([v]) => v !== "mine" && v !== "props-mine");
  const sectionOf = (h) => (h.startsWith("props") || h.startsWith("pg-") || h.startsWith("p-") ? "props" : h.startsWith("live") ? "live" : "lines");
  function setTab(name) {

    document.querySelectorAll(".sections a").forEach((a) => a.setAttribute("aria-current", a.dataset.sec === sec ? "true" : "false"));

  }
  let current = "week";
  function route(e) {
    const resized = e === "resize";
    const h = (location.hash || "#week").slice(1);
    if (PUBLIC && (h === "mine" || h === "props-mine")) { location.replace(h === "mine" ? "#week" : "#props"); return; }
    if (h.startsWith("g-") && GAMES[h.slice(2)]) { current = "game"; setTab("week"); renderGame(GAMES[h.slice(2)]); }
    else if (h.startsWith("pg-")) { current = "pgame"; setTab("props"); renderPropsGame(h.slice(3)); }
    else if (h.startsWith("p-")) { current = "player"; setTab("props-players"); renderPlayer(h.slice(2)); }
    else { current = VIEWS[h] ? h : "week"; setTab(current); VIEWS[current](); }

  }
  window.addEventListener("hashchange", route);
  let resizeTimer = null, lastW = window.innerWidth;

  });

  // ---------- record strip
  function tile(k, r, extra, gold) {
    const empty = !r || r.n === 0;
    return `<div class="tile${gold ? " gold" : ""}"><span class="k">${k}</span><span class="v">${empty ? "–" : rec(r)}</span>
      <span class="s">${empty ? "No graded picks" : `<span class="${cls(r.units)}" data-count="${r.units}" data-fmt="u">${units(r.units)}</span>${extra || ""}`}</span></div>`;
  }
  function strip(R, sim) {
    const a = R.all;
    const clv = R.all.clv;
    return `<div class="strip${sim ? " sim" : ""}">
      ${tile(term("ats", "ATS"), R.ats)}${tile("Over/under", R.ou)}${tile("Moneyline", R.ml)}
      ${tile(term("potw", "Picks of the week"), R.potw, "", true)}${tile(term("golden", "Golden parlay"), R.parlay, "", true)}${tile(term("lottery", "+EV lottery"), R.lottery)}
      <div class="tile"><span class="k">${term("units", "Units")}</span><span class="v ${cls(a.units)}"${a.n ? ` data-count="${a.units}" data-fmt="u"` : ""}>${a.n ? units(a.units) : "–"}</span>
        <span class="s">${a.n ? term("roi", "ROI") + " " + pct(a.roi, 1) + " on " + a.n + " picks" : "1u every pick, 0.5u per parlay"}</span></div>
      <div class="tile"><span class="k">${term("clv", "Line value")}</span><span class="v ${cls(clv)}"${clv == null ? "" : ` data-count="${clv}" data-fmt="s2"`}>${clv == null ? "–" : signed(clv, 2)}</span>

  // The full record (every pick at 1u) split by the price: the +EV picks, and the negative-EV sides.
  function leansNote(R) {

  // ---------- quarter Kelly: its own record from week 1, apart from the flat one (model/staking.py)

  // ---------- this week
  function pickWhy(p) {
    const g = GAMES[p.game_id];
    const win = p.p_win / Math.max(1 - (p.p_push || 0), 1e-9), need = 1 / p.dec;
    let s = "";
    if (g && g.model && p.market === "spread") s = `Model ${fav(g.home, g.away, g.model.spread, 1)}, market ${fav(g.home, g.away, p.market_spread)}. `;
    else if (p.market === "total") s = `Model total ${num(p.model_total, 1)}, market ${half(p.market_total)}. `;
    return `${s}Wins ${pct(win, 1)} by our numbers; ${am(p.american)} needs ${pct(need, 1)} to break even. EV ${signed(100 * p.ev, 1)}%. ${stakeWhy(p)}`;
  }

    return `<span class="chip${p.potw ? " potw" : ""}${lean ? " lean" : ""}" data-tip="${esc(pickWhy(p) + checksTip(p.checks))}"><span class="m">${p.potw ? "Pick of the week" : lean ? "Lean" : { spread: "Spread", total: "Total", ml: "Moneyline" }[p.market]}</span>

    const s = (side) => fin ? `<span class="score">${g.score[side]}</span>` : g.proj ? `<span class="score proj" title="Projected points">${num(g.proj[side], 1)}</span>` : "";

        <div><dt>Model</dt><dd>${g.model ? fav(g.home, g.away, g.model.spread, 1) + " · " + num(g.model.total, 1) : "–"}</dd></div>

  }
  function potwPanel() {
    const potw = D.games.flatMap((g) => Object.values(g.picks || {}).filter((p) => p.potw).map((p) => ({ p, g }))).sort((a, b) => b.p.ev - a.p.ev);
    const rows = potw.map(({ p, g }, i) => `<div class="pick-row"><span class="n">${i + 1}</span><span class="lbl">${label(p.label)}</span>${resChip(p.result) || `<span class="mono">${am(p.american)}</span>`}
      <div class="sub"><span>${badge(g.away, 1)} at ${badge(g.home, 1)} · ${esc(g.kickoff.short)}</span><span>${esc(p.book_name)} ${am(p.american)}</span><span>Win ${pct(p.p_win)}</span><span>EV ${signed(100 * p.ev, 1)}%</span><span>1u · ${term("kelly", "quarter Kelly")} ${stakeU(p.kelly_u)}</span>${p.checks ? `<span>${vdTag(p.checks.verdict, failedOf(p.checks))}</span>` : ""}</div></div>`).join("");
    const ticket = (P, empty) => {
      if (!P) return `<p class="note">${empty}</p>`;
      return `<div class="odds-big">${am(P.american)} ${resChip(P.result)}</div>
        <ul class="legs">${P.leg_picks.map((l) => { const g = GAMES[l.game_id]; return `<li><span><b>${label(l.label)}</b> <span class="note">${g ? esc(g.away) + " at " + esc(g.home) : ""}</span></span><span class="mono">${am(l.american)}</span></li>`; }).join("")}</ul>
        <div class="kv"><div><span>Hits</span><b>${pct(P.p)}</b></div><div><span>0.5u pays</span><b>+${(0.5 * (P.dec - 1)).toFixed(2)}u</b></div>
        <div><span>EV</span><b class="${cls(P.ev)}">${signed(100 * P.ev, 1)}%</b></div></div>`;
    };
