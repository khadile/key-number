<title>Key Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Key Number. The system is in board/DESIGN.md: Operate mode, a neutral frame, color on data and team identity,
   soft shapes, purposeful motion (Emil Kowalski's curves and durations), light by day and dark by night. */
:root {
  color-scheme: light;
  /* neutrals, tinted toward 255 */
  --bg: oklch(0.972 0.004 255);
  --surface: oklch(0.996 0.002 255);
  --surface-2: oklch(0.958 0.005 255);
  --active: oklch(0.93 0.007 255);
  --line: oklch(0.915 0.006 255);
  --rule: oklch(0.945 0.005 255);
  --line-2: oklch(0.86 0.008 255);
  --ink: oklch(0.21 0.012 262);
  --ink-2: oklch(0.43 0.012 262);
  --muted: oklch(0.52 0.012 262);
  --primary: oklch(0.21 0.012 262);
  --primary-ink: oklch(0.985 0.002 255);
  /* data roles */
  --accent: oklch(0.52 0.15 255);
  --accent-ink: oklch(0.985 0.002 255);
  --accent-soft: oklch(0.95 0.025 255);
  --band: oklch(0.89 0.04 255);
  --good: oklch(0.5 0.12 152);
  --good-fill: oklch(0.64 0.15 152);
  --good-soft: oklch(0.95 0.04 152);
  --bad: oklch(0.54 0.17 25);
  --bad-fill: oklch(0.63 0.18 25);
  --bad-soft: oklch(0.95 0.028 25);
  --gold: oklch(0.52 0.1 70);
  --gold-fill: oklch(0.79 0.14 80);
  --gold-line: oklch(0.79 0.12 80);
  --gold-soft: oklch(0.965 0.04 88);
  --you: oklch(0.5 0.14 350);
  --you-soft: oklch(0.95 0.03 350);
  --s-home: oklch(0.56 0.15 255);
  --s-away: oklch(0.66 0.16 48);
  --float: 0 14px 34px -14px oklch(0.2 0.02 260 / 0.28), 0 2px 6px oklch(0.2 0.02 260 / 0.07);
  --lift: 0 10px 24px -14px oklch(0.2 0.02 260 / 0.3);
  /* shape */
  --r: 20px; --r-in: 14px; --r-sm: 10px;
  /* type */
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  /* motion (Emil Kowalski) */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  /* the live engine's feed keeps its own dark surface, like a scoreboard */
  --on: oklch(0.62 0.15 152);
  --off: oklch(0.62 0.01 260);
  --term-bg: oklch(0.19 0.006 262);
  --term-ink: oklch(0.93 0.01 85);
  --term-dim: oklch(0.66 0.01 262);
  --t-play: oklch(0.8 0.07 260); --t-odds: oklch(0.8 0.1 240); --t-flag: oklch(0.84 0.14 85);
  --t-card: oklch(0.78 0.1 310); --t-fill: oklch(0.82 0.08 180); --t-warn: oklch(0.78 0.12 60); --t-error: oklch(0.72 0.16 25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: oklch(0.155 0.003 262); --surface: oklch(0.2 0.004 262); --surface-2: oklch(0.24 0.005 262); --active: oklch(0.29 0.006 262);
    --line: oklch(0.28 0.006 262); --rule: oklch(0.245 0.005 262); --line-2: oklch(0.38 0.008 262);
    --ink: oklch(0.965 0.003 262); --ink-2: oklch(0.8 0.006 262); --muted: oklch(0.68 0.008 262);
    --primary: oklch(0.965 0.003 262); --primary-ink: oklch(0.17 0.004 262);
    --accent: oklch(0.74 0.12 250); --accent-ink: oklch(0.17 0.004 262); --accent-soft: oklch(0.29 0.04 255); --band: oklch(0.38 0.06 255);
    --good: oklch(0.78 0.15 152); --good-fill: oklch(0.7 0.16 152); --good-soft: oklch(0.29 0.055 152);
    --bad: oklch(0.74 0.15 25); --bad-fill: oklch(0.66 0.17 25); --bad-soft: oklch(0.3 0.06 25);
    --gold: oklch(0.84 0.12 85); --gold-fill: oklch(0.8 0.14 82); --gold-line: oklch(0.62 0.1 80); --gold-soft: oklch(0.3 0.05 85);
    --you: oklch(0.78 0.12 350); --you-soft: oklch(0.31 0.06 350);
    --s-home: oklch(0.7 0.13 250); --s-away: oklch(0.74 0.15 50);
    --float: 0 16px 40px -12px oklch(0 0 0 / 0.6), 0 2px 8px oklch(0 0 0 / 0.35);
    --lift: 0 12px 28px -14px oklch(0 0 0 / 0.7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: oklch(0.155 0.003 262); --surface: oklch(0.2 0.004 262); --surface-2: oklch(0.24 0.005 262); --active: oklch(0.29 0.006 262);
  --line: oklch(0.28 0.006 262); --rule: oklch(0.245 0.005 262); --line-2: oklch(0.38 0.008 262);
  --ink: oklch(0.965 0.003 262); --ink-2: oklch(0.8 0.006 262); --muted: oklch(0.68 0.008 262);
  --primary: oklch(0.965 0.003 262); --primary-ink: oklch(0.17 0.004 262);
  --accent: oklch(0.74 0.12 250); --accent-ink: oklch(0.17 0.004 262); --accent-soft: oklch(0.29 0.04 255); --band: oklch(0.38 0.06 255);
  --good: oklch(0.78 0.15 152); --good-fill: oklch(0.7 0.16 152); --good-soft: oklch(0.29 0.055 152);
  --bad: oklch(0.74 0.15 25); --bad-fill: oklch(0.66 0.17 25); --bad-soft: oklch(0.3 0.06 25);
  --gold: oklch(0.84 0.12 85); --gold-fill: oklch(0.8 0.14 82); --gold-line: oklch(0.62 0.1 80); --gold-soft: oklch(0.3 0.05 85);
  --you: oklch(0.78 0.12 350); --you-soft: oklch(0.31 0.06 350);
  --s-home: oklch(0.7 0.13 250); --s-away: oklch(0.74 0.15 50);
  --float: 0 16px 40px -12px oklch(0 0 0 / 0.6), 0 2px 8px oklch(0 0 0 / 0.35);
  --lift: 0 12px 28px -14px oklch(0 0 0 / 0.7);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; letter-spacing: -0.01em; }
button { font-family: inherit; }
img { max-width: 100%; }

/* ---------- the bar: mark and name, the sport, the sections, the pages */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1480px; margin: 0 auto; padding-inline: 24px; }
.brand { display: flex; align-items: center; gap: 10px 14px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand b { display: inline-flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.brand b i { font-style: normal; color: var(--muted); font-weight: 500; }
.brand .mark { width: 30px; height: 30px; flex: none; }
#brand-sub { color: var(--muted); font-size: 13px; }
.brand .grow { flex: 1; }
.nav2 { display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap; }
.seg { position: relative; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface-2); isolation: isolate; }
.seg a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; padding: 7px 15px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.seg a[aria-current="true"] { color: var(--ink); }
.seg-ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; border-radius: 999px; background: var(--surface); box-shadow: 0 1px 2px oklch(0.2 0.02 260 / 0.12), 0 0 0 1px var(--line); }
.sports a img { width: 18px; height: 18px; object-fit: contain; }
.sections { margin: 0; }
.tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; padding: 11px 10px 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); }
.tab-ind { position: absolute; bottom: 0; left: 0; height: 2px; border-radius: 2px; background: var(--ink); }

/* ---------- the canvas: the view, and the slip beside it on wide screens */
.layout { max-width: 1480px; margin: 0 auto; padding-inline: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
@media (min-width: 1240px) { .layout { grid-template-columns: minmax(0, 1fr) 340px; } }
main { padding-block: 26px 96px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; min-width: 0; align-content: start; }
#rail { display: none; }
@media (min-width: 1240px) { #rail { display: block; padding-block: 26px; } #rail > .rail-in { position: sticky; top: calc(var(--top-h, 120px) + 18px); max-height: calc(100vh - var(--top-h, 120px) - 36px); overflow: auto; } }
.sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; }
.sec h2 { font-size: 18px; font-weight: 700; color: var(--ink); }
.sec h2 em { font-style: normal; color: var(--muted); font-weight: 500; font-size: 15px; margin-left: 6px; }
.lede { font-size: 15px; color: var(--ink-2); max-width: 68ch; margin: 0; }
.note { font-size: 13px; color: var(--muted); max-width: 76ch; margin: 0; }
.hello { display: grid; gap: 6px; }
.hello h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
.hello .finding { font-size: 15px; color: var(--ink-2); margin: 0; }
.hello .finding b { color: var(--ink); }

/* ---------- record: one strip divided by hairlines (figures are type, not tiles) */
.strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
@container (min-width: 560px) { .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); } .strip.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@container (min-width: 900px) { .strip { grid-template-columns: repeat(8, minmax(0, 1fr)); } .strip.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile .k { font-size: 12.5px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; }
.tile .s { font-size: 12px; color: var(--ink-2); }
.tile.gold .k::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold-fill); flex: none; }
.strip.sim .tile .v { font-size: 20px; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* ---------- today's best: picks of the day/week, the parlays */
.featured { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
@container (min-width: 860px) { .featured { grid-template-columns: 1.4fr 1fr; } }
.stack { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel.gold { border-color: var(--gold-line); }
.panel.lotto { border-style: dashed; }
.panel h3 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.odds-big { font-family: var(--f-mono); font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.tag { font-family: var(--f-body); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); white-space: nowrap; }
.pick-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 3px 10px; align-items: center; padding-block: 10px; border-top: 1px solid var(--rule); }
.pick-row:first-of-type { border-top: 0; }
.pick-row .n { font-family: var(--f-display); font-weight: 800; color: var(--gold); font-size: 16px; }
.pick-row .lbl { font-family: var(--f-display); font-size: 17px; font-weight: 700; line-height: 1.2; }
.pick-row .sub { grid-column: 2 / 4; font-size: 13px; color: var(--ink-2); display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
.legs { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.legs li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; align-items: baseline; }
.legs li b { font-family: var(--f-display); font-size: 16px; font-weight: 700; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.kv div { display: grid; }
.kv span { font-size: 12px; color: var(--muted); }
.kv b { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }

/* ---------- results, chips and pills */
.res { font-family: var(--f-body); font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.res.W { background: var(--good-soft); color: var(--good); }
.res.L { background: var(--bad-soft); color: var(--bad); }
.res.P { background: var(--surface-2); color: var(--muted); }
.day { font-family: var(--f-display); font-size: 16px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; max-width: 100%; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); font-size: 13px; border: 1px solid transparent; }
.chip .m { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.chip b { font-family: var(--f-mono); font-weight: 600; font-size: 13px; }
.chip .pr { color: var(--ink-2); font-family: var(--f-mono); font-size: 12px; }
.chip.potw { background: var(--gold-soft); }
.chip.potw .m { color: var(--gold); }
.chip.you { border-color: var(--you); background: var(--you-soft); }
.chip.you .m { color: var(--you); }
.chip.pass { color: var(--muted); background: transparent; border: 1px dashed var(--line-2); }
.chip.lean { background: transparent; border: 1px dashed var(--line-2); }
.chip.lean .m { color: var(--accent); }
.chip.promo { border-color: var(--you); }
.more { justify-self: start; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--accent); }
.more:hover { text-decoration: underline; }

/* ---------- team marks: logo and name; the fallback is the colored abbreviation */
.tb { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 4px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.01em; white-space: nowrap; vertical-align: middle; }
.tb img { width: 20px; height: 20px; object-fit: contain; }
.tb.sm { height: 22px; font-size: 12px; padding: 0 7px 0 3px; gap: 4px; }
.tb.sm img { width: 16px; height: 16px; }
.tb.noimg { background: var(--tc); color: var(--ti); padding-inline: 8px; }
.tl { width: 40px; height: 40px; object-fit: contain; flex: none; }
.tl.lg { width: 64px; height: 64px; }
.tl.xl { width: 88px; height: 88px; }
.tlx { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--tc); color: var(--ti); font: 800 13px var(--f-display); }
.hs { position: relative; flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
.hs img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.hs b { font: 800 14px var(--f-display); color: var(--ink-2); }
.hs-wrap { position: relative; flex: none; }
.hs-wrap .badge { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); padding: 2px; box-shadow: 0 0 0 1px var(--line); }
.hs-wrap .badge img { width: 16px; height: 16px; object-fit: contain; display: block; }

/* ---------- game cards */
.cards { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@container (min-width: 700px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (min-width: 1120px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-top { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.card-top .live { color: var(--bad); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.card-top .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bad-fill); }
.card-top .when { font-weight: 600; color: var(--ink-2); }
.mu2 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.mu2 .t { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.mu2 .t b { font-family: var(--f-display); font-size: 16px; font-weight: 700; line-height: 1.15; }
.mu2 .t small { font-size: 12px; color: var(--muted); }
.mu2 .mid { display: grid; justify-items: center; gap: 2px; font-family: var(--f-mono); }
.mu2 .mid .sc { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.mu2 .mid .at { font-family: var(--f-body); font-size: 12px; color: var(--muted); }
.wp { display: grid; gap: 5px; }
.wp .bar { position: relative; display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.wp .bar i { display: block; height: 100%; }
.wp .bar i:first-child { border-radius: 999px 0 0 999px; }
.wp .bar i:last-child { border-radius: 0 999px 999px 0; }
.wp .lb { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.wp .lb b { color: var(--ink); font-weight: 700; }
.trow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.tname { font-weight: 700; font-size: 16px; }
.tname small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
.score { font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.score.proj { color: var(--ink-2); }
.lines { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; padding: 12px 14px; border-radius: var(--r-in); background: var(--surface-2); }
.lines div { display: grid; gap: 1px; }
.lines dt { font-size: 12px; font-weight: 500; color: var(--muted); }
.lines dd { margin: 0; font-family: var(--f-mono); font-size: 14px; font-weight: 500; }

/* ---------- a game's page */
.back { font-weight: 600; text-decoration: none; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.gh { display: grid; gap: 4px; }
.gh h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.025em; }
.gh p { margin: 0; color: var(--muted); font-size: 14px; }
.board2 { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 18px; }
.board2 .side { display: grid; justify-items: center; gap: 6px; text-align: center; }
.board2 .side b { font-size: 16px; }
.board2 .big { font-family: var(--f-mono); font-size: 40px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
.board2 .at { color: var(--muted); font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.board2 .wp { grid-column: 1 / -1; }
.two { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@container (min-width: 800px) { .two { grid-template-columns: 1fr 1fr; } }
.scroll { overflow-x: auto; min-width: 0; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.num, table.t th.num { text-align: right; }
table.t tr.hl td { background: var(--accent-soft); }
table.t tr.ph td { background: var(--surface-2); }
@media (hover: hover) and (pointer: fine) { table.t tbody tr:hover td { background: var(--surface-2); } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.box h3 { font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 12px; }
svg.chart text.v { fill: var(--ink); font-family: var(--f-mono); font-weight: 500; }
svg.chart .grid { stroke: var(--rule); stroke-width: 1; }
svg.chart .axis { stroke: var(--line-2); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.mx { display: grid; gap: 2px; }
.mx-row { display: grid; grid-template-columns: minmax(96px, 1.1fr) 1.4fr 56px 74px; gap: 8px; align-items: center; font-size: 13px; padding-block: 4px; }
.mx-row .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.mx-row .bar span { display: block; height: 100%; background: var(--s-home); border-radius: 999px; }
.mx-row .val { font-family: var(--f-mono); text-align: right; }
.mx-row .rk { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
.mx-row .l3 { grid-column: 3 / 5; color: var(--muted); font-size: 11px; text-align: right; margin-top: -4px; }
.inj { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.inj li { display: flex; gap: 8px; align-items: baseline; }
.st { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); min-width: 22px; text-align: center; white-space: nowrap; }
.st.Out { background: var(--bad-soft); color: var(--bad); }
.st.Doubtful { background: var(--gold-soft); color: var(--gold); }

/* ---------- my picks */
.banner { padding: 11px 14px; border-radius: var(--r-in); background: var(--accent-soft); color: var(--ink); font-size: 14px; }
.mp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.mp-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.mp-head small { color: var(--muted); font-weight: 500; }
.mp-groups { display: grid; gap: 10px; grid-template-columns: 1fr; }
@container (min-width: 680px) { .mp-groups { grid-template-columns: repeat(3, 1fr); } }
.grp { display: grid; gap: 4px; }
.grp > span { font-size: 12px; font-weight: 500; color: var(--muted); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pb { position: relative; font: 600 14px var(--f-mono); padding: 9px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .pb:hover:not(:disabled) { border-color: var(--you); } }
.pb[aria-pressed="true"] { background: var(--you); color: var(--primary-ink); border-color: var(--you); }
.pb:disabled { cursor: not-allowed; opacity: 0.55; }
.pb .mt { position: absolute; top: -8px; right: 8px; font: 700 10px var(--f-body); background: var(--primary); color: var(--primary-ink); padding: 1px 6px; border-radius: 999px; }
.pb.sm { font-size: 13px; padding: 7px 6px; }

/* ---------- defenses */
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 600 13px var(--f-body); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover, th.sort[aria-sort] { color: var(--ink); }
.rk { display: inline-block; min-width: 26px; padding: 1px 6px; margin-left: 6px; border-radius: 999px; font: 600 11px var(--f-body); text-align: center; background: var(--surface-2); color: var(--muted); }
.rk.top { background: var(--good-soft); color: var(--good); }
.rk.bot { background: var(--bad-soft); color: var(--bad); }
.tcell { display: flex; align-items: center; gap: 8px; }

/* ---------- prose */
.prose { display: grid; gap: 14px; max-width: 72ch; }
.prose h3 { font-size: 20px; font-weight: 700; margin-top: 6px; }
.prose p, .prose li { margin: 0; color: var(--ink-2); }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.prose b { color: var(--ink); }
.fine { font-size: 12px; color: var(--muted); }
code { font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 1px 5px; }

/* ---------- context notes, form and markets on cards */
.ctx { margin: 0; padding-left: 16px; display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); }
.ctx li::marker { color: var(--line-2); }
.ctx li.chance { color: var(--muted); }
.ctxb { display: grid; gap: 3px; }
.ctxb .ctx-h { font: 600 12.5px var(--f-mono); color: var(--ink); }
.pick-row .ctx { grid-column: 2 / 4; }
.prow .ctx { flex-basis: 100%; }
.l5 { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.l5 b { font: 600 12px var(--f-mono); min-width: 26px; text-align: center; padding: 2px 5px; border-radius: 7px; }
.l5 b.hit { background: var(--good-soft); color: var(--good); }
.l5 b.miss { background: var(--bad-soft); color: var(--bad); }
.l5row { display: flex; gap: 4px 8px; align-items: center; flex-wrap: wrap; }
table.mk td, table.mk th { padding: 7px 8px; white-space: normal; vertical-align: top; }
table.mk td > small { display: block; color: var(--muted); font-size: 11.5px; }
table.mk td div small { color: var(--muted); font-size: 11.5px; }
table.mk td .l5 { margin-top: 4px; }
table.nbk td, table.nbk th { padding: 7px 8px; white-space: normal; }
table.nbk td small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
table.pmk td, table.pmk th { padding: 6px 8px; }
.ninj { display: grid; gap: 12px; }
.card.n { align-content: start; }
details.nmore { border-top: 1px solid var(--rule); padding-top: 8px; }
details.nmore > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
details.nmore > summary::-webkit-details-marker { display: none; }
details.nmore > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); margin-right: 2px; }
details.nmore[open] > summary::before { transform: rotate(45deg); }
.nmore-in { display: grid; gap: 12px; padding-top: 10px; min-width: 0; }

/* ---------- props */
.role { font: 600 11.5px var(--f-body); padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.shop { background: var(--accent-soft); color: var(--accent); margin-left: 4px; }
.tag.promo, .chip.promo .m { background: var(--you-soft); color: var(--you); }
.tag.lean { background: transparent; color: var(--muted); border: 1px dashed var(--line-2); }
.tag.mu-yes { background: var(--good-soft); color: var(--good); margin-left: 4px; }
.tag.mu-no { background: transparent; color: var(--muted); border: 1px dashed var(--line-2); margin-left: 4px; }
.stk { font: 600 11px var(--f-mono); padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.stk.none { background: transparent; color: var(--muted); border: 1px dashed var(--line-2); }
tr.lean td { color: var(--muted); }
.vd { font: 700 11px var(--f-body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.vd.good { background: var(--good-soft); color: var(--good); }
.vd.ev { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.checkbox { display: grid; gap: 8px; border-top: 1px solid var(--rule); padding-top: 10px; }
.checkbox .verdict { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; font-size: 13px; color: var(--ink-2); align-items: start; }
.checks .ck { font-weight: 800; text-align: center; }
.checks .ck.ok { color: var(--good); } .checks .ck.no { color: var(--bad); } .checks .ck.na { color: var(--muted); }
.nowline { font-size: 13px; color: var(--ink-2); margin: 0; }
.plist { display: grid; gap: 2px; }
.prow { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--rule); }
.prow:first-child { border-top: 0; }
.prow .pn { font-weight: 700; text-decoration: none; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.prow .pn small { font-weight: 500; color: var(--muted); }
.prow .pc { margin-left: auto; }
.prow .pair { margin-left: auto; display: inline-grid; grid-template-columns: 1fr 1fr; gap: 6px; min-width: 220px; }
.search { width: 100%; max-width: 420px; font: 15px var(--f-body); padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.strip.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container (min-width: 760px) { .strip.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.gate { display: block; height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.gate span { display: block; height: 100%; background: var(--gold-fill); border-radius: 999px; }
ul.steps { margin: 0; padding-left: 18px; display: grid; gap: 6px; color: var(--ink-2); }

/* ---------- help: dotted terms and chart marks explain themselves */
.tip { position: fixed; left: 0; top: 0; z-index: 80; max-width: min(300px, calc(100vw - 16px)); padding: 9px 12px; border-radius: 12px; background: var(--ink); color: var(--surface); font: 13px/1.45 var(--f-body); box-shadow: var(--float); pointer-events: none; opacity: 0; transform: scale(0.97) translateY(4px); }
.tip.on { opacity: 1; transform: none; }
.term { border-bottom: 1px dotted var(--muted); cursor: help; }
svg [data-tip], .gauge-wrap, .mx-row { cursor: help; }

/* ---------- dropdown sections */
details.acc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 14px 18px; border-radius: var(--r); }
details.acc > summary::-webkit-details-marker { display: none; }
@media (hover: hover) and (pointer: fine) { details.acc > summary:hover { background: var(--surface-2); } }
details.acc > summary h3 { font-size: 18px; font-weight: 700; }
details.acc > summary .chev { margin-left: auto; font: 700 22px/1 var(--f-display); color: var(--muted); }
details.acc[open] > summary .chev { transform: rotate(90deg); }
details.acc > .acc-body { padding: 4px 18px 18px; display: grid; gap: 14px; min-width: 0; }
.gaccs { display: grid; gap: 12px; }
.gacc > summary .mu { display: inline-flex; align-items: center; gap: 6px; }
.gacc > summary .at { color: var(--muted); font-size: 13px; }
.gacc > summary .gm { display: grid; min-width: 0; }
.gacc > summary .gm b { font-size: 16px; font-weight: 700; }
.gacc > summary .gs { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; min-width: 0; }
.cnt { font: 700 12px var(--f-body); padding: 3px 10px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); white-space: nowrap; }
.cnt.none { background: var(--surface-2); color: var(--muted); }
.bestc { font-size: 13px; color: var(--ink-2); }
.tg { display: grid; gap: 8px; }
.tg-h { display: flex; align-items: center; gap: 8px; font-weight: 700; padding-top: 8px; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 13px var(--f-body); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .btn:hover { color: var(--ink); border-color: var(--line-2); } }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

/* ---------- the calls on a game's page */
.calls { display: grid; gap: 14px; grid-template-columns: 1fr; }
@container (min-width: 780px) { .calls { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.call { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 9px; align-content: start; min-width: 0; }
.call.potw { border-color: var(--gold-line); }
.call.pass { background: transparent; border-style: dashed; }
.call.lean { border-style: dashed; }
.call .mk { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.call .big { font-family: var(--f-display); font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.call .px { font-family: var(--f-mono); font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.say { font-size: 14px; color: var(--ink-2); margin: 0; max-width: 64ch; }
.say b { color: var(--ink); }
.gauge-wrap { display: grid; gap: 6px; }
.gauge { position: relative; height: 8px; border-radius: 999px; background: var(--surface-2); }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--good-fill); }
.gauge .fill.low { background: var(--bad-fill); }
.gauge .need { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.gauge-lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.gauge-lbl b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }

/* ---------- prop cards */
.pcards { display: grid; gap: 14px; grid-template-columns: 1fr; }
@container (min-width: 720px) { .pcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (min-width: 1120px) { .pcards.n { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cards, .pcards.n { align-items: start; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 16px; display: grid; gap: 11px; align-content: start; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; }
.phead > div { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.pname { font-family: var(--f-display); font-size: 19px; font-weight: 800; text-decoration: none; color: var(--ink); letter-spacing: -0.015em; }
a.pname:hover { color: var(--accent); }
.pcard .ctx { margin-top: -3px; }
.mrow { display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--rule); min-width: 0; }
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.mhead > b { font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.callpill { font: 600 13px var(--f-body); padding: 3px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.callpill.locked { background: var(--primary); color: var(--primary-ink); }
.callpill.none { background: var(--surface-2); color: var(--muted); }
.callpill .pr { font-family: var(--f-mono); font-weight: 500; opacity: .9; }
.final { margin-left: auto; font-size: 13px; color: var(--ink-2); }
.bline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); }
.bline b { font-family: var(--f-mono); font-weight: 600; color: var(--ink); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.bk-draftkings { fill: var(--s-home); background: var(--s-home); }
.bk-fanduel { fill: var(--s-away); background: var(--s-away); }
.bk-pinnacle { fill: var(--ink); background: var(--ink); }
svg .bk { stroke: var(--surface); stroke-width: 2; }
svg .band80 { fill: var(--accent-soft); }
svg .band50 { fill: var(--band); }
svg .med { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
svg .fairmk { fill: var(--gold-fill); }
svg .callmark { fill: var(--you); }
svg text.lbl-model { fill: var(--ink); font-weight: 600; }
svg text.lbl-mkt { fill: var(--gold); font-weight: 600; }
.keyl i { display: inline-block; vertical-align: -1px; margin-right: 6px; }
.keyl .band80-k { width: 18px; height: 10px; border-radius: 5px; background: var(--accent-soft); box-shadow: inset 0 0 0 4px var(--band); }
.keyl .med-k { width: 3px; height: 12px; background: var(--ink); border-radius: 1px; }
.keyl .fair-k { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--gold-fill); }
.keyl .call-k { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--you); }
.howto { gap: 10px; }
.tryline { display: grid; gap: 6px; background: var(--surface-2); border-radius: var(--r-in); padding: 12px 14px; }
.tryline label { font-size: 14px; color: var(--ink-2); }
.tryline label b { font-family: var(--f-mono); font-weight: 600; color: var(--ink); }
.tryline input[type="range"] { width: 100%; accent-color: var(--ink); }
.tryline .out { font-size: 14px; color: var(--ink-2); }
.tryline .out b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }

/* ---------- records over time, live */
svg .ser-sim { stroke: var(--muted); fill: var(--muted); }
svg .ser-live { stroke: var(--ink); fill: var(--ink); }
svg path.ser-sim, svg path.ser-live, svg path.ser-kelly { fill: none; }
svg circle.ser-sim, svg circle.ser-live, svg circle.ser-kelly { stroke: var(--surface); stroke-width: 2; }
.legend i.ser-sim { background: var(--muted); }
.legend i.ser-live { background: var(--ink); }
svg .ser-kelly { stroke: var(--gold-fill); fill: var(--gold-fill); }
.legend i.ser-kelly { background: var(--gold-fill); }
svg .ser-sub { stroke: var(--accent); fill: var(--accent); }
svg path.ser-sub { fill: none; }
svg circle.ser-sub { stroke: var(--surface); stroke-width: 2; }
.legend i.ser-sub { background: var(--accent); }
.finds { display: grid; gap: 14px; grid-template-columns: 1fr; }
@container (min-width: 700px) { .finds { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.find { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.find .k { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.find .big { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.kinds { display: grid; gap: 14px; grid-template-columns: 1fr; }
@container (min-width: 700px) { .kinds { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kind { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.kind .k { font-size: 13px; font-weight: 700; color: var(--ink); }
.kind .kr { display: grid; gap: 3px; min-width: 0; }
.kind .kr + .kr { border-top: 1px solid var(--rule); padding-top: 10px; }
.kind .kl { font-size: 12px; font-weight: 500; color: var(--muted); }
.kind .big { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.kind .mid { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.kind .ks { font-size: 13px; color: var(--ink-2); }
.flagcards { display: grid; gap: 10px; }
.flagcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-in); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.flagcard .fc-top { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.flagcard .fc-play { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.flagcard .fc-play b { font-size: 17px; }
.flagcard .fc-nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); }
.flagcard .fc-why { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 11px; margin: 0; overflow-wrap: anywhere; }
.engine { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-in); padding: 12px 15px; }
.engine > span:last-child { min-width: 0; }

@media (max-width: 520px) { .mini-term .ln { grid-template-columns: 56px minmax(0, 1fr); } .mini-term .k { display: none; } }

/* ---------- best bets: every pick in one ranked list (the landing view) */
.eb-ctl { display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: center; }
.eb-ctl .search { max-width: 260px; height: 36px; padding-block: 0; }
.chipsel { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chipsel button { font: 600 13px var(--f-body); height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chipsel button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.tgl { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
.tgl input { appearance: none; width: 32px; height: 19px; border-radius: 999px; background: var(--active); position: relative; cursor: pointer; margin: 0; flex: none; }
.tgl input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px oklch(0 0 0 / 0.25); }
.tgl input:checked { background: var(--good-fill); }
.tgl input:checked::after { transform: translateX(13px); }
.eb { display: grid; gap: 8px; }
.eb-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.eb-row.gold { border-color: var(--gold-line); }
.eb-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 4px 14px; align-items: center; padding: 12px 14px 12px 12px; cursor: pointer; }
.eb-who { display: grid; gap: 3px; min-width: 0; }
.eb-who .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.eb-who .lbl { font-family: var(--f-display); font-size: 16px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.eb-who .l2 { font-size: 13px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.eb-who .l2 .px { font-family: var(--f-mono); color: var(--ink-2); font-weight: 600; }
.eb-who .l3 { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mkt { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.flag { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.flag.good { background: var(--good-soft); color: var(--good); }
.flag.gold { background: var(--gold-soft); color: var(--gold); }
.flag.shop { background: var(--accent-soft); color: var(--accent); }
.flag.lean { color: var(--muted); border: 1px dashed var(--line-2); }
.eb-num { display: grid; justify-items: end; gap: 0; }
.eb-num .ev { font-family: var(--f-display); font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.eb-num small { font-size: 11.5px; color: var(--muted); }
.ring { position: relative; width: 50px; height: 50px; flex: none; }
.ring svg { width: 50px; height: 50px; transform: rotate(-90deg); }
.ring .trk { stroke: var(--surface-2); }
.ring .val { stroke: var(--good-fill); stroke-linecap: round; }
.ring .val.low { stroke: var(--bad-fill); }
.ring .need { stroke: var(--ink); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 12.5px var(--f-body); }
.add { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
.add svg { width: 18px; height: 18px; }
.add[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.eb-side { display: flex; align-items: center; gap: 12px; }
.eb-more { display: grid; grid-template-rows: 0fr; }
.eb-row.open .eb-more { grid-template-rows: 1fr; }
.eb-in { min-height: 0; overflow: hidden; }
.eb-row:not(.open) .eb-in { visibility: hidden; }
.eb-pad { display: grid; gap: 12px; padding: 2px 16px 16px 72px; min-width: 0; }
@media (max-width: 640px) {
  .eb-main { grid-template-columns: auto minmax(0, 1fr) auto; padding: 11px 12px; gap: 4px 10px; }
  .eb-num { display: none; }
  .ring, .ring svg { width: 44px; height: 44px; }
  .eb-pad { padding: 2px 14px 14px; }

  .eb-side { gap: 8px; }

}
.media { position: relative; flex: none; width: 46px; height: 46px; display: grid; place-items: center; }
.media .tl { width: 40px; height: 40px; }

.duo > :first-child { left: 0; top: 0; }
.duo > :last-child { right: 0; bottom: 0; }

.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); font-size: 14px; }

/* the line-shop strip: the fair number and each book's line on one axis (the signature element) */
.lshop { display: grid; gap: 8px; }
.lshop .ax { position: relative; height: 62px; margin-inline: 30px; }
.lshop .ax::before { content: ""; position: absolute; left: -16px; right: -16px; top: 30px; height: 2px; border-radius: 2px; background: var(--line); }
.lshop .mk { position: absolute; top: 23px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 2px solid var(--surface); }
.lshop .mk.fair { width: 3px; height: 24px; top: 19px; margin-left: -1.5px; border: 0; border-radius: 2px; background: var(--ink); }
.lshop .mk.me { box-shadow: 0 0 0 2.5px var(--good-fill); z-index: 1; }
.lshop .mk.dk { background: var(--s-home); } .lshop .mk.fd { background: var(--s-away); } .lshop .mk.pin { background: var(--muted); }
.lshop .lab { position: absolute; top: 0; transform: translateX(-50%); font: 600 11.5px var(--f-mono); color: var(--ink); white-space: nowrap; }
.lshop .lab.b { top: 46px; color: var(--muted); }
.lshop .key i.fair { width: 3px; height: 11px; border-radius: 2px; background: var(--ink); }
.lshop .key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.lshop .key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* ---------- the slip: what you picked, priced together */
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.slip h3 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.slip h3 .cnt { font-size: 12px; }
.slip h3 button { margin-left: auto; }
.slip ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.slip li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--rule); }
.slip li:first-child { border-top: 0; }
.slip li b { font-size: 14px; font-weight: 700; line-height: 1.25; }
.slip li small { grid-column: 1; font-size: 12px; color: var(--muted); }
.slip li .px { font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.slip .x { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: 15px; line-height: 1; }
.slip .tot { display: grid; gap: 8px; padding: 12px 14px; border-radius: var(--r-in); background: var(--surface-2); }
.slip .tot div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); }
.slip .tot div b { font-family: var(--f-mono); color: var(--ink); font-weight: 700; }
.slip .tot .big b { font-size: 20px; }
.slip .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px 0 16px; border-radius: 999px; border: 0; background: var(--primary); color: var(--primary-ink); font: 700 15px var(--f-body); box-shadow: var(--float); cursor: pointer; }
.fab b { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--good-fill); color: oklch(0.15 0.02 152); display: inline-grid; place-items: center; font-size: 12px; }
@media (min-width: 1240px) { .fab { display: none; } }
dialog.sheet { position: fixed; inset: auto 0 0 0; margin: 0; width: 100%; max-width: 100%; max-height: 86vh; overflow: auto; border: 0; color: var(--ink); background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--float); padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
dialog.sheet::backdrop { background: oklch(0.15 0.01 262 / 0.42); }
.sheet .grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line-2); margin: 2px auto 10px; border: 0; display: block; cursor: pointer; }
.sheet .slip { border: 0; padding: 4px 0 0; }
.toasts { position: fixed; z-index: 90; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(420px, calc(100vw - 32px)); }
@media (min-width: 1240px) { .toasts { left: auto; right: 24px; transform: none; bottom: 24px; justify-items: end; } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; background: var(--ink); color: var(--surface); font-size: 14px; box-shadow: var(--float); max-width: 100%; }
.toast b { font-weight: 700; }
.toast .ok { width: 20px; height: 20px; border-radius: 50%; background: var(--good-fill); color: oklch(0.15 0.02 152); display: grid; place-items: center; font-size: 12px; flex: none; }

/* ---------- motion: purposeful, short, off for reduced motion (Emil Kowalski) */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0.9); } to { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: no-preference) {
  .tip { transition: opacity 125ms var(--ease-out), transform 125ms var(--ease-out); }
  .tip.instant { transition-duration: 0ms; }
  .seg-ind, .tab-ind { transition: transform 260ms var(--ease-in-out), width 260ms var(--ease-in-out); }
  .enter > * { animation: rise 260ms var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 6) * 40ms); }
  /* bars, rings and lines draw once, when they come into view: the data explaining itself */
  .vz .gx, .vz .gxr, .vz .gy { transform-box: fill-box; transition: transform 640ms var(--ease-out); transition-delay: calc(var(--d, 0) * 45ms); }
  .vz .gx { transform-origin: left center; } .vz .gxr { transform-origin: right center; } .vz .gy { transform-origin: center bottom; }
  .vz:not(.in) .gx, .vz:not(.in) .gxr { transform: scaleX(0.02); }
  .vz:not(.in) .gy { transform: scaleY(0.02); }
  .vz .draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 900ms var(--ease-out) 120ms; }
  .vz.in .draw { stroke-dashoffset: 0; }
  .vz .popin { transform-box: fill-box; transform-origin: center; transition: opacity 260ms var(--ease-out), transform 260ms var(--ease-out); transition-delay: calc(var(--d, 0) * 40ms + 380ms); }
  .vz:not(.in) .popin { opacity: 0; transform: scale(0.9); }
  .vz .area { transition: opacity 600ms var(--ease-out) 300ms; }
  .vz:not(.in) .area { opacity: 0; }
  .ring .val { transition: stroke-dashoffset 700ms var(--ease-out) 80ms; }
  .wp .bar i { transform-origin: left center; transition: transform 640ms var(--ease-out); }
  .wp .bar i:last-child { transform-origin: right center; }
  .vz:not(.in) .wp .bar i, .wp.vz:not(.in) .bar i { transform: scaleX(0.02); }
  .lshop .mk { transition: left 520ms var(--ease-out), transform 160ms var(--ease-out); }
  /* press feedback: the interface heard you */
  .btn, .pill, .chipsel button, .add, .fab, .pb, .x, .seg a, .eb-main, details.acc > summary { transition: transform 140ms var(--ease-out), background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
  .btn:active, .pill:active, .chipsel button:active, .add:active, .fab:active, .pb:active, .x:active, .seg a:active { transform: scale(0.97); }
  .eb-main:active { transform: scale(0.995); }
  .add[aria-pressed="true"] svg { animation: pop 200ms var(--ease-out); }
  .fab.bump b { animation: bump 260ms var(--ease-out); }
  .tgl input::after { transition: transform 200ms var(--ease-out); }
  .tgl input { transition: background-color 160ms ease; }
  details.acc > summary .chev { transition: transform 220ms var(--ease-out); }
  details.nmore > summary::before { transition: transform 200ms var(--ease-out); }
  /* hover: things that can be opened lift slightly, on pointer devices only */
  .card, .pcard, .call, .eb-row { transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out), border-color 160ms ease; }
  dialog.sheet { transform: translateY(100%); transition: transform 400ms var(--ease-drawer), overlay 400ms allow-discrete, display 400ms allow-discrete; }
  dialog.sheet[open] { transform: none; }
  @starting-style { dialog.sheet[open] { transform: translateY(100%); } }
  dialog.sheet::backdrop { opacity: 0; transition: opacity 400ms var(--ease-drawer), overlay 400ms allow-discrete, display 400ms allow-discrete; }
  dialog.sheet[open]::backdrop { opacity: 1; }
  @starting-style { dialog.sheet[open]::backdrop { opacity: 0; } }
  .toast { transition: transform 400ms ease, opacity 400ms ease; }
  .toast.out { transition-duration: 200ms; transform: translateY(100%); opacity: 0; }
  @starting-style { .toast { transform: translateY(100%); opacity: 0; } }
  details.acc::details-content, details.nmore::details-content { transition: height 240ms var(--ease-out), content-visibility 240ms allow-discrete; height: 0; overflow: clip; }
  details.acc[open]::details-content, details.nmore[open]::details-content { height: auto; }
  :root { interpolate-size: allow-keywords; }
  ::view-transition-group(main) { animation-duration: 0s; }
  ::view-transition-old(main) { animation: 140ms var(--ease-out) both fade reverse; }
  ::view-transition-new(main) { animation: none; }
  .vz:not(.in) .ring .val { stroke-dashoffset: 131.95px; }
  .eb.cascade > .eb-row { animation: rise 280ms var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 10) * 35ms + 80ms); }
  .eb-more { transition: grid-template-rows 280ms var(--ease-out); }
  .eb-in { transition: visibility 280ms; }
  .exp { transition: transform 140ms var(--ease-out), background-color 160ms ease, color 160ms ease; }
  .exp:active { transform: scale(0.94); }
  .exp svg { transition: transform 220ms var(--ease-out); }
  svg.chart .xh { transition: opacity 120ms var(--ease-out); }
  .pz { transition: border-color 160ms ease, box-shadow 200ms var(--ease-out); }
}
@media (prefers-reduced-motion: no-preference) and (hover: hover) and (pointer: fine) {
  .card:hover, .pcard:hover, .call:hover { transform: translateY(-2px); box-shadow: var(--lift); border-color: var(--line-2); }
  .eb-row:hover { border-color: var(--line-2); box-shadow: var(--lift); }
}
@media (prefers-reduced-motion: reduce) {
  .toast, .tip { transition: opacity 200ms ease; }
  .enter > * { animation: fade 200ms ease both; }
}
main#app { view-transition-name: main; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }

/* ---------- build-out (2026-10-20): containers, marks, best bets, slip, charts */

.ph { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

/* best bets */

.sel::after { content: ""; position: absolute; right: 15px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
