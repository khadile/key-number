<script id="kn-nba" type="application/json">__NBA_DATA__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("kn-data").textContent);
  const T = D.teams;
  const app = document.getElementById("app");
  const GAMES = Object.fromEntries(D.games.map((g) => [g.id, g]));

  // ---------- formatting
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const MINUS = "−";
  const num = (x, d) => (x == null || Number.isNaN(x) ? "–" : Number(x).toFixed(d));
  const half = (x) => { const r = Math.round(x * 2) / 2; return Number.isInteger(r) ? String(Math.abs(r)) : Math.abs(r).toFixed(1); };
  const signed = (x, d = 1) => (x == null ? "–" : (x > 0 ? "+" : x < 0 ? MINUS : "") + Math.abs(x).toFixed(d));
  const am = (n) => (n == null ? "–" : (n > 0 ? "+" : n < 0 ? MINUS : "") + Math.abs(n));
  const pct = (x, d = 0) => (x == null ? "–" : (100 * x).toFixed(d) + "%");
  const units = (u) => (u == null ? "–" : (u > 0 ? "+" : u < 0 ? MINUS : "") + Math.abs(u).toFixed(2) + "u");
  const cls = (x) => (x > 0 ? "pos" : x < 0 ? "neg" : "");
  const label = (s) => esc(String(s).replace(/-(?=\d)/g, MINUS));
  // a home-perspective spread ("home favored by s") as the favorite's line
  function fav(home, away, s, d) {
    if (s == null) return "–";
    if (Math.abs(s) < 0.05) return "Pick'em";
    const v = d == null ? half(s) : Math.abs(s).toFixed(d);
    return (s > 0 ? home : away) + " " + MINUS + v;
  }
  // Team marks: each team's own logo beside its abbreviation. Where an image cannot load (offline, or a host that
  // blocks outside images) the abbreviation on the team's color stands in, by the image-error handler below.
  const NOTEAM = { color: "#777777", ink: "#ffffff" };
  function teamMark(m, t, sm) {
    const st = `--tc:${m.color};--ti:${m.ink}`;
    return m.logo ? `<span class="tb${sm ? " sm" : ""}" style="${st}"><img src="${esc(m.logo)}" alt="" width="20" height="20" loading="lazy" data-fb="">${esc(t)}</span>`
      : `<span class="tb noimg${sm ? " sm" : ""}" style="${st}">${esc(t)}</span>`;
  }
  function logoOf(m, t, size) {   // a logo on its own (cards, the scoreboard); falls back to the abbreviation in a circle
    const st = `--tc:${m.color};--ti:${m.ink}`;
    return m.logo ? `<img class="tl${size ? " " + size : ""}" src="${esc(m.logo)}" alt="${esc(m.name || t)}" width="40" height="40" loading="lazy" data-fb="${esc(t)}" data-fbs="${st}">`
      : `<span class="tlx${size ? " " + size : ""}" style="${st}">${esc(t)}</span>`;
  }
  function headshot(name, img, tm, t, big) {   // a player's photo with his team's logo on its corner; initials behind it
    const ini = esc(String(name || "").split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join(""));
    return `<span class="hs-wrap"><span class="hs${big ? " lg" : ""}"><b>${ini}</b>${img ? `<img src="${esc(img)}" alt="" loading="lazy" data-fb="">` : ""}</span>${tm && tm.logo ? `<span class="badge${big ? " lg" : ""}"><img src="${esc(tm.logo)}" alt="${esc(t)}" loading="lazy" data-fb=""></span>` : ""}</span>`;
  }
  const badge = (t, sm) => teamMark(T[t] || NOTEAM, t, sm);
  const logo = (t, size) => logoOf(T[t] || NOTEAM, t, size);
  function imgFailed(im) {
    const host = im.parentElement;
    if (host && host.classList.contains("tb")) { host.classList.add("noimg"); im.remove(); return; }
    if (host && host.classList.contains("badge")) { host.remove(); return; }
    if (!im.dataset.fb) { im.remove(); return; }
    const s = document.createElement("span");
    s.className = ["tlx", ...[...im.classList].filter((c) => c !== "tl")].join(" ");
    s.setAttribute("style", im.dataset.fbs || "");
    s.textContent = im.dataset.fb;
    im.replaceWith(s);
  }
  document.addEventListener("error", (e) => { const im = e.target; if (im && im.tagName === "IMG" && im.hasAttribute("data-fb")) imgFailed(im); }, true);
  document.querySelectorAll("img[data-fb]").forEach((im) => { if (im.complete && !im.naturalWidth) imgFailed(im); });
  // Team colors on data. A color has to read on this page's surface (a black or navy team on the dark theme takes
  // its second color, or a lighter mix), and two teams side by side have to read as two: the home side tries its
  // second color, then both fall back to the board's own pair.
  function hexRgb(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  const lum = (c) => { const r = hexRgb(c); return r ? (0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]) / 255 : 0.5; };
  const DARKQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : !!(DARKQ && DARKQ.matches); };
  const mixHex = (c, w, k) => { const a = hexRgb(c), b = hexRgb(w); return "#" + a.map((x, i) => Math.round(x + (b[i] - x) * k).toString(16).padStart(2, "0")).join(""); };
  const reads = (c) => (isDark() ? lum(c) >= 0.3 : lum(c) <= 0.82);
  const chroma = (c) => { const r = hexRgb(c); return r ? Math.max(...r) - Math.min(...r) : 0; };
  function visible(c, c2) {
    if (!hexRgb(c)) return null;
    if (reads(c)) return c;
    if (hexRgb(c2) && reads(c2) && chroma(c2) > 60) return c2;
    return isDark() ? mixHex(c, "#ffffff", 0.4) : mixHex(c, "#000000", 0.35);
  }
  const far = (x, y) => { const a = hexRgb(x), b = hexRgb(y); return !a || !b || Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) >= 90; };
  function pairColors(a, b) {
    const ca = visible(a && a.color, a && a.color2), ch = visible(b && b.color, b && b.color2);
    if (!ca || !ch) return ["var(--s-away)", "var(--s-home)"];
    if (far(ca, ch)) return [ca, ch];
    const alt = b.color2 && visible(b.color2, null);
    return alt && far(ca, alt) ? [ca, alt] : ["var(--s-away)", "var(--s-home)"];
  }
  const teamColor = (m) => visible(m && m.color, m && m.color2) || "var(--s-home)";
  const noVig = (mlA, mlH) => { if (mlA == null || mlH == null) return null; const a = 1 / decOf(mlA), h = 1 / decOf(mlH); return a / (a + h); };
  function wpBar(away, home, pAway, mA, mH, src) {
    if (pAway == null || !Number.isFinite(pAway)) return "";
    const [ca, ch] = pairColors(mA, mH);
    return `<div class="wp vz" data-tip="${esc(src)}"><div class="bar"><i style="width:${(100 * pAway).toFixed(1)}%;background:${ca}"></i><i style="width:${(100 * (1 - pAway)).toFixed(1)}%;background:${ch}"></i></div>
      <div class="lb"><span>${esc(away)} <b>${pct(pAway)}</b></span><span>to win</span><span><b>${pct(1 - pAway)}</b> ${esc(home)}</span></div></div>`;
  }
  const nick = (t) => esc((T[t] && T[t].nick) || t);
  const rec = (r) => (!r || r.n === 0 ? "–" : `${r.w}-${r.l}${r.p ? "-" + r.p : ""}`);
  const resChip = (r) => (r ? `<span class="res ${r}">${{ W: "WIN", L: "LOSS", P: "PUSH" }[r]}</span>` : "");
  const decOf = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
  // stakes in units; quarter-Kelly tiers read as fractions (¼u, ½u)
  const stakeU = (u) => (u == null ? "–" : ({ 0.25: "¼", 0.5: "½" }[u] || String(Math.round(u * 100) / 100)) + "u");
  const stakePill = (p) => (p.risk === 0 ? '<span class="stk none">0u</span>' : `<span class="stk">${stakeU(p.risk == null ? 1 : p.risk)}</span>`);
  // ---------- is a +EV pick also a good pick? (model/checks.py) Each check passes, fails, or does not apply.
  const CHECK_NAME = { sharp: "Pinnacle's price", size: "Edge size", lean: "Over premium", market: "Market since lock", who: "Who plays" };
  const CHECK_IN_TEXT = { sharp: "Pinnacle's price", size: "edge size", lean: "over premium", market: "market since lock", who: "who plays" };
  const failedNames = (keys) => (keys || []).map((k) => CHECK_IN_TEXT[k] || k).join(", ");
  const vdTag = (v, failed) => (v === "good" ? '<span class="vd good" data-tip="+EV and passes every check">Good pick</span>'
    : v === "ev" ? `<span class="vd ev" data-tip="${esc(failed && failed.length ? "+EV, but fails: " + failedNames(failed) : "+EV, but fails a check")}">+EV only</span>` : "");
  const failedOf = (c) => c.checks.filter((k) => k.ok === false).map((k) => k.key);
  const checksTip = (c) => (!c ? "" : c.verdict === "good" ? " Good pick: passes every check."
    : " +EV only: " + c.checks.filter((k) => k.ok === false).map((k) => k.text).join(" "));
  function checksBlock(c) {
    if (!c) return "";
    const mark = (k) => (k.ok === true ? ["ok", "✓", "passes"] : k.ok === false ? ["no", "✗", "fails"] : ["na", "–", "does not apply"]);
    const li = c.checks.map((k) => { const [cl, sym, said] = mark(k);
      return `<li><span class="ck ${cl}" role="img" aria-label="${said}">${sym}</span><span><b>${CHECK_NAME[k.key] || k.key}.</b> ${esc(k.text)}</span></li>`; }).join("");
    const f = failedOf(c);
    const n = c.now;
    const now = n ? `<p class="nowline">Now, as of the last update: <b>${label(n.label)}</b> ${am(n.american)} at ${esc(n.book)}, ${term("ev", "EV")} <span class="${cls(n.ev)}">${signed(100 * n.ev, 1)}%</span>${n.ev <= 0 ? ": the value is gone at today's price" : ""}.</p>` : "";
    return `<div class="checkbox"><div class="verdict">${vdTag(c.verdict, f)}<span class="note">${c.verdict === "good" ? "+EV and passes every check" : `+EV, but ${failedNames(f)} ${f.length > 1 ? "fail" : "fails"}`}</span></div>
      <ul class="checks">${li}</ul>${now}</div>`;
  }
  function verdictSection(V, what) {
    if (!V || !V.all) return "";
    const S = V.since || {}, ns = ((S.good || {}).n || 0) + ((S.ev || {}).n || 0);
    const t = (k, r) => tile(k, r, r && r.n ? ` · ROI ${pct(r.roi, 1)}` : "");
    return `<section class="sec"><header><h2>Good picks vs +EV only <em>the checks on every +EV ${what}</em></h2></header>
      <div class="strip three">${t("Good picks", V.all.good)}${t("+EV only", V.all.ev)}
        <div class="tile"><span class="k">Week 6 on, the test</span><span class="v">${ns ? `${rec(S.good)} / ${rec(S.ev)}` : "–"}</span>
          <span class="s">${ns ? `good ${units(S.good.units)} · +EV only ${units(S.ev.units)}` : "No graded picks yet"}</span></div></div>
      <p class="note">Every +EV ${what} is checked against what has held up ${what === "prop" ? "for props: Pinnacle has the prop, the edge is 2% or more, an over on receiving, rushing or receptions clears the premium books put on overs, and nothing about who plays is in doubt" : "for game lines: Pinnacle has not moved against it since it locked, and no quarterback is in doubt"}. Pass them all and it is a good pick; otherwise it is +EV only. Flat 1u. Weeks 1–5 are rebuilt from what was known before each kickoff, but the checks were chosen with those weeks in view, so week 6 on is their real test.</p></section>`;
  }

  // ---------- plain-language help: hover or tap any dotted term or chart mark
  const GLOSSARY = {
    ats: "Against the spread. The favorite has to win by more than the spread; the underdog covers by losing by less (or winning).",
    ev: "Expected value: what a 1-unit bet returns on average if our win chance is right. +5% means +0.05 units a bet over the long run, not on any single bet.",
    win: "The chance this bet wins by our numbers: the market's line nudged toward the model. Pushes are left out.",
    need: "The win rate this price needs just to break even. At -110 that is 52.4%. A bet has value only when its win chance is higher.",
    fair: "Our fair number: the market's line moved part of the way toward the model, by the share lines have actually moved toward it this season.",
    novig: "No-vig: a book's two prices with its built-in margin taken out, which turns them into the market's true chances.",
    clv: "Line value: how much better our number was than the line at kickoff. Beating the closing line is the best early sign of a real edge, long before wins and losses settle.",
    units: "1 unit is one standard bet. The record counts every straight pick at 1 unit, leans included, and each parlay at 0.5, so units won shows the model's profit whatever your bet size.",
    lean: "A lean: the side the model prefers, at a price with negative expected value. The board gives it no stake because the price is against it, but the record still counts it at 1 unit, so the record is the model's full output.",
    kelly: "Quarter Kelly: a stake sized to the edge for the price, a quarter of what the Kelly formula says, rounded to ¼, ½, 1 or 2 units (1u = 1% of the bankroll). A solid favorite with an edge gets more, a long shot less. Kept as its own record beside the flat one, because sizing by the model's confidence amplifies its mistakes as much as its edge.",
    roi: "Return on investment: units won divided by units risked.",
    potw: "Picks of the week: the strongest picks by edge relative to the payout, one per game.",
    potd: "Picks of the day: the day's strongest positive-EV picks by edge relative to the payout, one per game.",
    evclose: "EV at the close: what each pick's locked price was worth against Pinnacle's no-vig line just before the game started. A market-anchored edge is only real if the price beats where the market settled, and this shows it long before wins and losses do.",
    golden: "Golden Parlay: two or three positive-value picks from different games, priced +150 to +300. It should cash now and then.",
    lottery: "+EV Lottery: three to five positive-value picks priced over +500. It misses most weeks and is here for the occasional big payout.",
    ngolden: "Golden Parlay (NBA): the confident ticket. Two or three legs from different games, each 60%+ likely and worth 1%+ at its price (main or alternate lines), priced +100 to +300, chosen for the best chance of cashing. A parlay only multiplies its legs' value, so every leg must have value on its own; on a day nothing qualifies there is none.",
    k: "The share of the gap between the model and the market that lines have actually closed by kickoff this season. A small number means the market already knows most of what the model knows.",
    median: "The model's middle outcome: half of its 4,000 simulated games land above it and half below.",
    range80: "In 8 of 10 simulated games the stat lands inside this range.",
    shop: "Line shop: DraftKings or FanDuel hung a number away from the market's (Pinnacle's) line. The model alone may lean the other way; the value comes from the price.",
    promoted: "Promoted: he moved up because a teammate who ranked above him last game is not playing.",
    brier: "Brier score: how close stated chances were to what happened. 0 is perfect and 0.25 is a coin flip, so lower is better.",
    sim: "Replayed with the same rules on games already played. These were not live picks.",
    shadow: "The play that passed every check but came second in its game, so the one-a-game cap kept it off. Logged and graded at the price it was seen, never counted in the record: it tests whether a second play a game would pay.",
    paper: "Paper trading: the engine records every play it flags as if it were bet, with no money down, to test the idea first.",
    logloss: "Log loss: how surprised a forecast was by what happened, averaged over every prop. Lower is better; a coin flip scores 0.693. Differences in the third decimal are real over thousands of props.",
    plusunder: "A plus-money under: the book prices the under at even money or longer, which means it has made the over the favorite.",
  };
  const term = (key, text) => `<span class="term" tabindex="0" data-term="${key}">${text}</span>`;
  const tipEl = document.createElement("div");
  tipEl.className = "tip";
  tipEl.setAttribute("role", "tooltip");
  document.body.appendChild(tipEl);
  let tipFor = null;
  function showTip(el, x, y) {
    const text = el.dataset.term ? GLOSSARY[el.dataset.term] : el.dataset.tip;
    if (!text) return;
    tipFor = el;
    tipEl.textContent = text;
    tipEl.classList.add("on");
    const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    const ax = x != null ? x : r.left + r.width / 2, ay = y != null ? y : r.top;
    let top = ay - h - 12;
    if (top < 8) top = (y != null ? y : r.bottom) + 14;
    tipEl.style.left = Math.max(8, Math.min(ax - w / 2, window.innerWidth - w - 8)) + "px";
    tipEl.style.top = top + "px";
  }
  function hideTip() { tipFor = null; tipEl.classList.remove("on"); }
  const tipTarget = (t) => (t && t.closest ? t.closest("[data-tip],[data-term]") : null);
  document.addEventListener("pointerover", (e) => { if (e.pointerType === "touch") return; const el = tipTarget(e.target); if (el) showTip(el, e.clientX, e.clientY); });
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch" || !tipFor) return;
    const el = tipTarget(e.target);
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("pointerout", (e) => { if (e.pointerType !== "touch" && tipFor && !(e.relatedTarget && tipFor.contains(e.relatedTarget))) hideTip(); });
  document.addEventListener("click", (e) => {   // taps show and hide help on phones
    const el = tipTarget(e.target);
    if (el && !e.target.closest("a, button, summary, input, label")) { if (tipFor === el && e.pointerType === "touch") hideTip(); else showTip(el); return; }
    hideTip();
  });
  document.addEventListener("focusin", (e) => { const el = tipTarget(e.target); if (el) showTip(el); });
  document.addEventListener("focusout", hideTip);
  window.addEventListener("scroll", hideTip, { passive: true });

  // ---------- motion: views rise in, numbers count up, charts draw when first seen; nothing travels for
  // reduced-motion viewers
  const REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const IO = !REDUCED && "IntersectionObserver" in window
    ? new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { e.target.classList.add("in"); IO.unobserve(e.target); } }, { rootMargin: "0px 0px -6% 0px" }) : null;
  function revealAll(root, now) { root.querySelectorAll(".vz:not(.in)").forEach((el) => { if (now || !IO) el.classList.add("in"); else IO.observe(el); }); }
  new MutationObserver(() => revealAll(app)).observe(app, { childList: true, subtree: true });
  function animateIn() {
    if (REDUCED) return;
    app.classList.remove("enter");
    void app.offsetWidth;   // restart the entrance
    [...app.children].forEach((c, i) => c.style.setProperty("--i", i));
    app.classList.add("enter");
    countUp(app);
  }
  function countUp(root) {
    if (REDUCED) return;
    root.querySelectorAll("[data-count]").forEach((el) => {
      const end = Number(el.dataset.count), fmt = el.dataset.fmt || "n0", final = el.textContent;
      if (!Number.isFinite(end) || end === 0) return;
      const f = (v) => (fmt === "u" ? units(v) : fmt === "s2" ? signed(v, 2) : fmt === "s1" ? signed(v, 1) : num(v, Number(fmt.slice(1)) || 0));
      const t0 = performance.now(), dur = 750;
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        if (k < 1) { el.textContent = f(end * (1 - Math.pow(1 - k, 3))); requestAnimationFrame(step); } else el.textContent = final;
      };
      requestAnimationFrame(step);
      setTimeout(() => { el.textContent = final; }, dur + 150);   // land on the real value even if frames are throttled
    });
  }
  // Win chance against the break-even rate, drawn on a 30-80% scale where betting decisions live.
  function gauge(p, need) {
    if (p == null || need == null) return "";
    const lo = 0.3, hi = 0.8, pos = (x) => Math.max(0, Math.min(100, (100 * (x - lo)) / (hi - lo)));
    return `<div class="gauge-wrap vz" data-tip="Win chance ${pct(p, 1)} against the ${pct(need, 1)} this price needs to break even. The bar has to pass the line to have value.">
      <div class="gauge"><span class="fill gx${p > need ? "" : " low"}" style="width:${pos(p).toFixed(1)}%"></span><span class="need" style="left:${pos(need).toFixed(1)}%"></span></div>
      <div class="gauge-lbl"><span>${term("win", "Win chance")} <b>${pct(p, 1)}</b></span><span>${term("need", "Needs")} <b>${pct(need, 1)}</b></span></div></div>`;
  }
  // Cumulative units by week, one line for the whole record (weeks before launch included).
  function unitsChart(A, specs, xlab) {
    const xl = xlab || ((w) => "W" + w), xt = xlab || ((w) => "week " + w);
    const cum = (weeks, get) => { let c = 0; return weeks.map((w) => { const r = get(w); c += r.units; return { wk: w.week, u: c, r }; }); };
    const series = (specs || (A && A.weeks.length ? [{ name: "Units", cls: "ser-live", weeks: A.weeks, get: (w) => w.all }] : []))
      .filter((s) => s.weeks && s.weeks.length).map((s) => ({ ...s, pts: cum(s.weeks, s.get) }));
    const all = series.flatMap((s) => s.pts);
    if (!all.length) return "";
    const wmin = Math.min(...all.map((p) => p.wk)) - 1, wmax = Math.max(...all.map((p) => p.wk));
    const lo = Math.min(0, ...all.map((p) => p.u)), hi = Math.max(0, ...all.map((p) => p.u)), pad = Math.max(1, (hi - lo) * 0.15);
    const W = chartW(false), H = 210, x0 = 46, x1 = W - 70, y0 = 14, y1 = H - 30;
    const X = (w) => x0 + ((w - wmin) / Math.max(1, wmax - wmin)) * (x1 - x0);
    const Y = (u) => y0 + ((hi + pad - u) / (hi - lo + 2 * pad)) * (y1 - y0);
    const step = Math.max(1, Math.ceil((hi - lo + 2 * pad) / 4 / 5) * 5);
    const ticks = [];
    for (let v = Math.ceil((lo - pad) / step) * step; v <= hi + pad; v += step) ticks.push(v);
    const body = series.map((s, si) => {
      const pts = [{ wk: s.pts[0].wk - 1, u: 0 }, ...s.pts];
      const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.wk).toFixed(1)} ${Y(p.u).toFixed(1)}`).join(" ");
      const last = s.pts[s.pts.length - 1];
      return `<path class="draw ${s.cls}" pathLength="1" d="${d}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${s.pts.map((p, i) => `<circle class="popin ${s.cls}" style="--d:${i + si * 3}" cx="${X(p.wk).toFixed(1)}" cy="${Y(p.u).toFixed(1)}" r="5" data-tip="${esc(s.name)}, ${esc(xt(p.wk))}: ${rec(p.r)} for ${units(p.r.units)}; ${units(p.u)} in total"/>`).join("")}
        <text class="v" x="${(X(last.wk) + 9).toFixed(1)}" y="${(Y(last.u) + 4).toFixed(1)}">${units(last.u)}</text>`;
    }).join("");
    return `<svg class="chart vz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Units won over time">
      ${ticks.map((v) => `<line class="grid" x1="${x0}" x2="${x1}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${x0 - 8}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${v > 0 ? "+" : v < 0 ? MINUS : ""}${Math.abs(v)}u</text>`).join("")}
      <line class="axis" x1="${x0}" x2="${x1}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>
      ${[...new Set(all.map((p) => p.wk))].map((w) => `<text x="${X(w).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(xl(w))}</text>`).join("")}
      ${body}
    </svg><div class="legend">${series.map((s) => `<span><i class="${s.cls}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  }

  // ---------- grading (mirrors board/ledger.py)
  function grade(market, side, line, hs, as) {
    const margin = hs - as;
    let d;
    if (market === "spread") d = (side === "home" ? margin : -margin) + line;
    else if (market === "total") d = side === "over" ? hs + as - line : line - (hs + as);
    else d = side === "home" ? margin : -margin;
    return d > 0 ? "W" : d === 0 ? "P" : "L";
  }
  const unitsFor = (r, price) => (r === "W" ? decOf(price) - 1 : r === "P" ? 0 : -1);

  // ---------- sections, tabs + routing
  const SECTIONS = {
    best: [], "nba-best": [],
    lines: [["week", "This week"], ["mine", "My picks"], ["defense", "Defenses"], ["record", "Record"], ["model", "How it works"]],
    props: [["props", "This week"], ["props-players", "Players"], ["props-mine", "My picks"], ["props-defense", "Defenses"], ["props-record", "Record"], ["props-model", "How it works"]],
    live: [["live", "Live"], ["live-model", "How it works"]],
    "nba-lines": [["nba", "Today"], ["nba-defense", "Defenses"], ["nba-record", "Record"], ["nba-model", "How it works"]],
    "nba-props": [["nba-props", "Today"], ["nba-props-defense", "Defenses"], ["nba-props-record", "Record"], ["nba-props-model", "How it works"]],
  };
  const SPORT_SECTIONS = { nfl: [["best", "#best", "Best bets", "Best"], ["lines", "#week", "Game lines", "Lines"], ["props", "#props", "Player props", "Props"], ["live", "#live", "Live", "Live"]],
                           nba: [["nba-best", "#nba-best", "Best bets", "Best"], ["nba-lines", "#nba", "Game lines", "Lines"], ["nba-props", "#nba-props", "Player props", "Props"]] };
  // The public website (board/site.py sets KN_PUBLIC) has no My Picks: it needs claude.ai's storage.
  const PUBLIC = !!window.KN_PUBLIC;
  if (PUBLIC) for (const k of Object.keys(SECTIONS)) SECTIONS[k] = SECTIONS[k].filter(([v]) => v !== "mine" && v !== "props-mine");
  const sectionOf = (h) => (h === "best" || h === "nba-best" ? h : h.startsWith("nba-props") ? "nba-props" : h.startsWith("nba") ? "nba-lines"
    : h.startsWith("props") || h.startsWith("pg-") || h.startsWith("p-") ? "props" : h.startsWith("live") ? "live" : "lines");
  let shownSport = null, shownSec = null;
  function setTab(name) {
    const sec = sectionOf(name), sport = sec.startsWith("nba") ? "nba" : "nfl";
    document.querySelectorAll(".sports a").forEach((a) => a.setAttribute("aria-current", a.dataset.sport === sport ? "true" : "false"));
    const secs = document.querySelector(".sections"), tabs = document.getElementById("subtabs");
    if (sport !== shownSport) {
      shownSport = sport;
      try { localStorage.setItem("kn-sport", sport); } catch (e) { /* remembered for this visit only */ }
      document.getElementById("brand-sub").innerHTML = sport === "nba" ? nbaSub() : nflSub();
      secs.innerHTML = '<span class="seg-ind" aria-hidden="true"></span>' + SPORT_SECTIONS[sport].map(([k, h, l, s]) => `<a href="${h}" data-sec="${k}"><span class="full">${l}</span><span class="short">${s}</span></a>`).join("");
      secs.dataset.fresh = "1";
    }
    secs.querySelectorAll("a").forEach((a) => a.setAttribute("aria-current", a.dataset.sec === sec ? "true" : "false"));
    if (sec !== shownSec) {
      shownSec = sec;
      const list = SECTIONS[sec] || [];
      tabs.hidden = list.length < 2;
      tabs.innerHTML = '<span class="tab-ind" aria-hidden="true"></span>' + list.map(([k, l]) => `<a href="#${k}" data-tab="${k}">${l}</a>`).join("");
      tabs.dataset.fresh = "1";
    }
    tabs.querySelectorAll("a").forEach((a) => { if (a.dataset.tab === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    placeInds();
  }
  // The pill behind the chosen sport and section and the line under the chosen page slide to the new choice;
  // a freshly drawn row places them without moving.
  function placeInd(nav, sel, cls) {
    if (!nav) return;
    const a = nav.querySelector(sel), el = nav.querySelector(cls);
    if (!el) return;
    if (!a || !a.offsetWidth) { el.style.opacity = "0"; return; }
    const still = nav.dataset.fresh === "1" || !el.style.width;
    if (still) el.style.transition = "none";
    el.style.opacity = "1";
    el.style.width = a.offsetWidth + "px";
    el.style.transform = `translateX(${a.offsetLeft}px)`;
    if (still) { void el.offsetWidth; el.style.transition = ""; delete nav.dataset.fresh; }
  }
  function placeInds() {
    placeInd(document.querySelector(".sports"), 'a[aria-current="true"]', ".seg-ind");
    placeInd(document.querySelector(".sections"), 'a[aria-current="true"]', ".seg-ind");
    placeInd(document.getElementById("subtabs"), 'a[aria-current="page"]', ".tab-ind");
    document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px");
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeInds);
  let current = "best", routed = false;
  function landing() {   // no address: the Best bets of the sport looked at last
    let s = "nfl";
    try { s = localStorage.getItem("kn-sport") || "nfl"; } catch (e) { /* NFL */ }
    return s === "nba" && N ? "nba-best" : "best";
  }
  function route(e) {
    const resized = e === "resize";
    const h = location.hash.slice(1) || landing();
    if (PUBLIC && (h === "mine" || h === "props-mine")) { location.replace(h === "mine" ? "#week" : "#props"); return; }
    const draw = () => {
      if (h.startsWith("g-") && GAMES[h.slice(2)]) { current = "game"; setTab("week"); renderGame(GAMES[h.slice(2)]); }
      else if (h.startsWith("pg-")) { current = "pgame"; setTab("props"); renderPropsGame(h.slice(3)); }
      else if (h.startsWith("p-")) { current = "player"; setTab("props-players"); renderPlayer(h.slice(2)); }
      else { current = VIEWS[h] ? h : "best"; setTab(current); VIEWS[current](); }
      if (!resized) { window.scrollTo(0, 0); animateIn(); }
      revealAll(app, resized);
      renderRail();
    };
    // the old view fades as the new one rises in, where the browser can (View Transitions)
    if (routed && !resized && !REDUCED && document.startViewTransition) {
      const vt = document.startViewTransition(draw);
      // a quick second click skips this transition, which is not an error; a failed draw still reports, once
      vt.ready.catch(() => {}); vt.finished.catch(() => {});
      vt.updateCallbackDone.catch((x) => { if (!x || x.name !== "AbortError") console.error(x); });
    } else draw();
    routed = true;
  }
  window.addEventListener("hashchange", route);
  // team colors are picked for the theme, so a theme change redraws the view in place
  if (DARKQ && DARKQ.addEventListener) DARKQ.addEventListener("change", () => { const y = window.scrollY; route("resize"); window.scrollTo(0, y); });
  let resizeTimer = null, lastW = window.innerWidth;
  window.addEventListener("resize", () => {   // charts are drawn to width, so redraw after a real resize
    placeInds();
    if (Math.abs(window.innerWidth - lastW) < 40) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { lastW = window.innerWidth; const y = window.scrollY; route("resize"); window.scrollTo(0, y); }, 200);
  });

  // ---------- context notes on a pick: each a fact with its numbers; records within chance are greyed
  function ctxList(p, max) {
    const ns = (p && p.notes) || [];
    if (!ns.length) return "";
    return `<ul class="ctx">${ns.slice(0, max || 4).map((n) => `<li${/within chance/.test(n) ? ' class="chance"' : ""}>${esc(n.replace(/-(?=\d)/g, MINUS))}</li>`).join("")}</ul>`;
  }
  function ctxBlock(picks) {
    const xs = picks.filter((p) => p && p.notes && p.notes.length);
    return xs.map((p) => `<div class="ctxb"><span class="ctx-h">${label(p.label)}</span>${ctxList(p)}</div>`).join("");
  }
  // A player's recent games against a line, oldest first; the tooltip says which game
  function formStrip(vals, line, side, tips) {
    if (!vals || !vals.length || line == null) return "";
    return `<span class="l5">${vals.map((v, i) => { const hit = side === "under" ? v < line : v > line;
      return `<b class="${hit ? "hit" : "miss"}"${tips && tips[i] ? ` data-tip="${esc(tips[i])}"` : ""}>${num(v, 0)}</b>`; }).join("")}</span>`;
  }
  const BSHORT = { DraftKings: "DK", FanDuel: "FD", Pinnacle: "Pin", draftkings: "DK", fanduel: "FD", pinnacle: "Pin" };
  const BORDER = ["draftkings", "DraftKings", "fanduel", "FanDuel", "pinnacle", "Pinnacle"];
  function mainLine(books) { for (const b of BORDER) if (books && books[b]) return books[b].line; return null; }
  // Every market for a player (both sports): the model's middle and 10-90% range, each book's line, the best price
  // with its value, and his last games against that market's line
  function mktTable(rows) {
    if (!rows.length) return '<p class="note">No lines posted yet.</p>';
    const ln = (x) => num(x, 1).replace(/\.0$/, "");
    return `<div class="scroll"><table class="t mk"><thead><tr><th>Market · last games</th><th>${term("median", "Model")}</th><th>Lines</th><th>Best price</th></tr></thead><tbody>
      ${rows.map((r) => {
        const books = BORDER.filter((b) => r.books[b]).map((b) => `<div>${BSHORT[b]} ${ln(r.books[b].line)} <small>${am(r.books[b].over)}/${am(r.books[b].under)}</small></div>`).join("");
        const L = r.lean;
        const best = L ? `${L.side === "over" ? "O" : "U"} ${ln(L.line)} ${am(L.american)}<small>${esc(BSHORT[L.book] || L.book)} · <span class="${cls(L.ev)}">EV ${signed(100 * L.ev, 1)}%</span></small>` : "–";
        return `<tr${r.hl ? ' class="hl"' : ""}><td><b>${esc(r.name)}</b><div>${formStrip(r.vals, mainLine(r.books), "over", r.tips)}</div></td>
          <td class="mono">${num(r.median, 0)}<small>${num(r.q[0], 0)}–${num(r.q[4], 0)}</small>${r.fair != null ? `<small>fair ${num(r.fair, 1)}</small>` : ""}</td>
          <td class="mono">${books || "–"}</td><td class="mono">${best}</td></tr>`;
      }).join("")}
    </tbody></table></div><p class="note">Model: the middle outcome, and the range 8 in 10 games fall in. Last games against each market's current line: green over it, red under. Tap a number for the game.</p>`;
  }

  // NFL card dropdown: the books, what moves the model's number, and the injury report
  function nflMore(g) {
    const books = g.books && g.books.length ? nBooks(g) : '<p class="note">No lines yet.</p>';
    const parts = (g.contrib || []).map((c) => `${esc(c.label)} ${signed(c.pts, 1)}`).join(", ");
    const model = g.model ? `<p class="note">Model: ${fav(g.home, g.away, g.model.spread, 1)}, total ${num(g.model.total, 1)}${parts ? `. What moves it (points for ${esc(g.home)}): ${parts}` : ""}.</p>` : "";
    const inj = (t, xs) => (xs && xs.length ? `<div><b>${badge(t, 1)}</b><ul class="inj">${xs.map((x) => `<li>${stChip(x.status)}<span>${esc(x.name)} <span class="note">${esc(x.pos || "")}${x.injury ? " · " + esc(x.injury) : ""}</span></span></li>`).join("")}</ul></div>` : "");
    const ij = inj(g.away, (g.injuries || {}).away) + inj(g.home, (g.injuries || {}).home);
    return `<details class="nmore"><summary>Books, model and injury report</summary><div class="nmore-in">${books}${model}${ij ? `<div class="ninj">${ij}</div>` : '<p class="note">Nobody on either injury report.</p>'}</div></details>`;
  }

  // ---------- record strip
  function tile(k, r, extra, gold) {
    const empty = !r || r.n === 0;
    return `<div class="tile${gold ? " gold" : ""}"><span class="k">${k}</span><span class="v">${empty ? "–" : rec(r)}</span>
      <span class="s">${empty ? "No graded picks" : `<span class="${cls(r.units)}" data-count="${r.units}" data-fmt="u">${units(r.units)}</span>${extra || ""}`}</span></div>`;
  }
  function strip(R, sim) {
    const a = R.all;
    const clv = R.all.clv;
    return `<div class="strip${sim ? " sim" : ""}">
      ${tile(term("ats", "ATS"), R.ats)}${tile("Over/under", R.ou)}${tile("Moneyline", R.ml)}
      ${tile(term("potw", "Picks of the week"), R.potw, "", true)}${tile(term("golden", "Golden parlay"), R.parlay, "", true)}${tile(term("lottery", "+EV lottery"), R.lottery)}
      <div class="tile"><span class="k">${term("units", "Units")}</span><span class="v ${cls(a.units)}"${a.n ? ` data-count="${a.units}" data-fmt="u"` : ""}>${a.n ? units(a.units) : "–"}</span>

  // The full record (every pick at 1u) split by the price: the +EV picks, and the negative-EV sides.
  function leansNote(R) {
    const S = R && R.split;

  // ---------- quarter Kelly: its own record from week 1, apart from the flat one (model/staking.py)
  function kTile(k, r) {
    const empty = !r || r.n === 0;

  function kStrip(K, what) {
    const a = K && K.all, f = a && a.flat;

  function kWeeks(K, liveStart, what) {
    const W = (K && K.weeks) || [];

    return `<div class="scroll"><table class="t"><thead><tr><th>Week</th><th class="num">${what}</th><th class="num">Record</th><th class="num">Staked</th><th class="num">Quarter Kelly</th><th class="num">ROI</th><th class="num">Same at 1u</th></tr></thead><tbody>
      ${W.map((w) => `<tr><td>${w.week}${w.week < liveStart ? ' <span class="note">replay</span>' : ""}</td><td class="num">${w.n}</td><td class="num">${rec(w)}</td><td class="num">${num(w.staked, 2)}u</td><td class="num ${cls(w.units)}">${units(w.units)}</td><td class="num">${pct(w.roi, 1)}</td><td class="num ${cls(w.flat.units)}">${units(w.flat.units)}</td></tr>`).join("")}
    </tbody></table></div>`;

  function kellySection(K, liveStart, what, extra) {
    const W = (K && K.weeks) || [];
    const chart = unitsChart(null, [{ name: "Quarter Kelly", cls: "ser-kelly", weeks: W, get: (w) => w },
                                    { name: `Same ${what} at 1u`, cls: "ser-live", weeks: W, get: (w) => w.flat }]);
    return `<section class="sec"><header><h2>Quarter Kelly <em>its own record, apart from the flat one</em></h2></header>
      <p class="note">Every positive-EV ${what.replace(/s$/, "")} sized ¼, ½, 1 or 2 units by its edge for the price (${term("kelly", "quarter Kelly")}) instead of a flat 1u, from week 1. The official record above stays flat. Weeks 1–5 helped choose quarter Kelly, so they flatter it; week 6 on is the test.</p>
      ${kStrip(K, what)}${extra || ""}

  // one line for the week view, kept apart from the flat strip

  }

  // ---------- this week
  function pickWhy(p) {
    const g = GAMES[p.game_id];
    const win = p.p_win / Math.max(1 - (p.p_push || 0), 1e-9), need = 1 / p.dec;
    let s = "";
    if (g && g.model && p.market === "spread") s = `Model ${fav(g.home, g.away, g.model.spread, 1)}, market ${fav(g.home, g.away, p.market_spread)}. `;
    else if (p.market === "total") s = `Model total ${num(p.model_total, 1)}, market ${half(p.market_total)}. `;
    return `${s}Wins ${pct(win, 1)} by our numbers; ${am(p.american)} needs ${pct(need, 1)} to break even. EV ${signed(100 * p.ev, 1)}%. ${stakeWhy(p)}`;
  }
  const stakeWhy = (p) => (p.risk === 0 ? "A lean: negative EV, so no stake; the record still counts it at 1u."
    : p.ev <= 0 ? "Staked 1u: locked before the lean rule (week 6)."
    : `Stake 1u. Quarter Kelly, its own record: ${stakeU(p.kelly_u)}.`);
  function pickChip(p, potw) {
    if (!p) return "";
    const lean = p.risk === 0;
    return `<span class="chip${p.potw ? " potw" : ""}${lean ? " lean" : ""}" data-tip="${esc(pickWhy(p) + checksTip(p.checks))}"><span class="m">${p.potw ? "Pick of the week" : lean ? "Lean" : { spread: "Spread", total: "Total", ml: "Moneyline" }[p.market]}</span>
      <b>${label(p.label)}</b><span class="pr">${am(p.american)} ${esc(p.book_name)}</span>${stakePill(p)}${p.checks ? vdTag(p.checks.verdict, failedOf(p.checks)) : ""}${resChip(p.result)}</span>`;

  // A game with no moneyline pick still shows the model's view, so the pass reads as a decision.

  // public betting splits (Action Network, user 2026-10-26): the side most tickets are on in each market, with its

  function pubRow(pub, home, away, nk, at) {
    if (!pub) return "";

      const s = pub[mk];

      const ln = (v) => signed(v, 1).replace(/\.0$/, "");
      const who = mk === "total" ? `${side === "over" ? "Over" : "Under"} ${num(x.line, 1).replace(/\.0$/, "")}`
        : `${nk(side === "home" ? home : away)}${mk === "spread" ? " " + ln(x.line) : " ML"}`;
      const big = x.tickets >= 70;
      return `<span${big ? ' class="pub-big"' : ""}>${big ? "<b>" : ""}${esc(who)} ${x.tickets}%${big ? "</b>" : ""}<span class="note"> / ${x.money}% $</span></span>`;
    }).filter(Boolean);
    return parts.length ? `<div><dt data-tip="Action Network's consensus: the side most bettors are on in each market, the share of tickets on it, then the share of money (/ $). Bold: 70%+ of tickets. Context, not a signal: fading the public did not hold up 2023-26. Refreshed at every board update." tabindex="0">Public</dt><dd>${parts.join(" · ")}${at ? `<span class="note"> · as of ${esc(new Date(at).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" }))} ET</span>` : ""}</dd></div>` : "";

  function potwPanel() {

  // ---------- charts (inline SVG), drawn at the width they will show at so 12px labels stay 12px. Bars take the

  function chartW(halfWidth) {

    return Math.round(Math.max(280, Math.min(1100, box - 38)));       // the box's own padding and border
  }
  function scoreBars(g) {

        <text class="v" x="${(toHome ? mid + bw + 7 : mid - bw - 7).toFixed(1)}" y="${y + 21}" text-anchor="${toHome ? "start" : "end"}">${Math.abs(x.pts).toFixed(1)}</text>`; }).join("")}

  function pctWords(label, team, pctv) {

  // Both teams' percentiles face to face: the away team grows left, the home team right, the measure between
  function pctBars(g, side) {

  // The favorite's spread at Pinnacle over the week: a step line over a soft fill, with a crosshair that reads

  function moveChart(g) {

    const ys = pts.map((p) => val(p.spread)), t0 = Date.parse(pts[0].t), t1 = Date.parse(pts[pts.length - 1].t);
    const lo = Math.floor(Math.min(...ys)) - 0.5, hi = Math.ceil(Math.max(...ys)) + 0.5;
    const W = chartW(true), H = 160, x0 = 40, x1 = W - 52, y0 = 12, y1 = H - 26;

      <circle class="popin" cx="${X(t1).toFixed(1)}" cy="${Y(val(last.spread)).toFixed(1)}" r="4.5" fill="${fill}" stroke="var(--surface)" stroke-width="2"></circle>

  // ---------- game breakdown

  function numberTable(g) {

  // One card per market: the call in words, its price, and a gauge of win chance against break-even.
  function callCard(g, market) {

  // ---------- my picks (db: data/users/<you>/mypicks/picks/<game>__<market>)
  let MY = new Map(), DB = null, MYCOL = null, dbState = "connecting";
  const pending = new Set();
  async function initDb() {
    if (!window.claude || typeof window.claude.use !== "function") { dbState = "unavailable"; rerenderMine(); return; }
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) { dbState = "unavailable"; rerenderMine(); return; }
      const uid = await user.id();
      if (!uid) { dbState = "signedout"; rerenderMine(); return; }
      DB = db;
      MYCOL = db.doc("data/users/" + uid + "/mypicks").collection("picks");
      if (D.props) initPropsDb(db, uid);
      MYCOL.onSnapshot((snap) => { MY = new Map(snap.docs.map((d) => [d.id, d.data()])); dbState = "ready"; rerenderAll(); },
        () => { dbState = "error"; rerenderMine(); });
    } catch (e) { dbState = "error"; rerenderMine(); }
  }
  function rerenderMine() { if (current === "mine") renderMine(); else if (current === "props-mine") renderPropsMine(); }
  function rerenderAll() { if (current === "mine") renderMine(); else if (current === "week") { const y = window.scrollY; renderWeek(); window.scrollTo(0, y); } }
  async function choose(gid, market, side) {
    const key = gid + "__" + market;
    if (!MYCOL || pending.has(key)) return;

    const prev = MY.get(key);

      if (prev && prev.side === side) await MYCOL.doc(key).delete();
      else await MYCOL.doc(key).set({ game_id: gid, week: g.week, market, side, line, price, label: lbl, kickoff: g.kickoff.iso, made_at: new Date().toISOString() });

  // ---------- the bet list (model/betlist.py, user 2026-10-26)
  const BLM = { fg3: "3-pointers", pts: "Points", reb: "Rebounds", ast: "Assists", combo: "Combos", pass_yds: "Passing yds", rush_yds: "Rushing yds",

  function blCells(v) {
    if (!v || !v.cells) return "";
    return `<details class="nmore"><summary>How the list is choosing right now</summary><div class="nmore-in"><div class="scroll"><table class="t"><thead><tr><th>Category</th><th>EV tier</th><th class="num">Graded</th><th class="num">EV at the close</th><th class="num">Units</th><th class="num">Worth per pick</th><th class="num">Sure it is &gt; 0</th><th>On the list</th></tr></thead><tbody>
      ${v.cells.map((c) => `<tr><td>${c.cat === "*" ? "<b>Every category</b>" : esc(blCat(c.cat))}</td><td>${esc(c.tier)}</td><td class="num">${c.n}</td><td class="num ${cls(c.close)}">${c.close == null ? "–" : evPct(c.close)}</td><td class="num ${cls(c.units)}">${units(c.units)}</td>
        <td class="num ${cls(c.edge)}">${evPct(c.edge)} <span class="note">±${(100 * c.sd).toFixed(1)}</span></td><td class="num">${pct(c.p_pos, 0)}</td><td class="${c.in ? "pos" : ""}">${c.in ? "Yes" : "No"}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">Each pick sits in a cell: its category and its EV at the lock. A cell's worth per pick blends three things, each weighted by how much it can be trusted: its picks' EV at Pinnacle's close (settles at kickoff, so it counts within days), their units (a pick swings about a unit either way, so units count once there are dozens of them, and can overrule the close when there are), and how its EV tier has done across every category. Recent picks count more: half the weight is gone after ${esc(v.half || "a few days")}. A cell is on the list at +1% or more and 65%+ sure it is above zero; one with fewer than 3 graded picks goes by its tier. At most two picks from one cell, so six of the same bet are not six bets. Picks are chosen when they lock and never redone.</p></div></details>`;

      <p class="note">Not every pick on the board is worth a stake. The bet list is the subset whose kind of pick (category and EV tier) has been earning lately, judged mostly on value at the closing line and, as they pile up, units. It adapts as results come in: a tier can join, a category can drop out. Its record is on the Record pages as "Bet list".</p></section>`;
  }
  function closeByCat(rows, cats, top = "week") {
    const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const body = cats.map(([name, f]) => {
      const g = rows.filter((r) => r.result && r.result !== "V" && f(r));
      if (!g.length && name === "Bet list") {   // always shown, so it can be found before its first grade
        const pend = rows.filter((r) => !r.result && f(r)).length;
        return `<tr><td><b>${esc(name)}</b></td><td class="num">0</td><td colspan="7" class="note">${pend ? `${pend} pending: the first bet-list picks grade after their games` : "The first list locks with the next picks (started 2026-10-26)"}</td></tr>`;
      }
      if (!g.length) return "";
      const t = { w: 0, l: 0, p: 0, n: g.length };
      let u = 0, st = 0;
      for (const r of g) { const k = { W: "w", L: "l", P: "p" }[r.result]; if (k) t[k]++; u += r.units || 0; st += isPar(r) ? (r.risk || 0.5) : 1; }
      const lv = g.map((r) => r.clv).filter((x) => x != null), ec = g.map((r) => r.ev_close).filter((x) => x != null);
      const m = ec.length ? mean(ec) : null;
      const se = ec.length > 1 ? Math.sqrt(ec.reduce((s, x) => s + (x - m) ** 2, 0) / (ec.length - 1) / ec.length) : null;
      const [read, rc] = !ec.length ? ["–", ""] : ec.length < 20 ? ["Too few yet", ""] : m - 2 * se > 0 ? ["Beating the close", "pos"]

        <td class="num">${lv.length ? signed(mean(lv), 2) : "–"}</td><td class="num ${cls(m)}">${m == null ? "–" : evPct(m)}${se != null && ec.length >= 20 ? ` <span class="note">±${(200 * se).toFixed(1)}</span>` : ""}</td>
        <td class="num">${ec.length ? pct(ec.filter((x) => x > 0).length / ec.length) + ` <span class="note">of ${ec.length}</span>` : "–"}</td><td class="${rc}">${read}</td></tr>`;

  function weekBrowser() {

  // ---------- how it works
  function renderModel() {
    const M = D.model, b = M.backtest, c = M.clv, pz = M.parlay, tr = M.trends;
    const atsPct = b ? b.ats.w / (b.ats.w + b.ats.l) : null;
    app.innerHTML = `
      <section class="hello"><h1>How it works</h1><p class="lede">What the model does, what the testing says, and the rules the picks follow.</p></section>
      <div class="prose">
        <h3>What the model does</h3>
        <ul><li>Rates every offense and defense from play-by-play data (expected points added and success rate on each snap), adjusted for the opponents each team has faced. Recent games count more.</li>
          <li>Rates quarterbacks separately, so a backup or a rookie starting changes the projection.</li>
          <li>Turns the ratings into projected points for each team, adding pace, special teams, home field, rest and the weather forecast.</li>
          <li>Turns projections into win chances that respect the key numbers (3 and 7 above all).</li></ul>
        ${b ? `<h3>How good is it?</h3><p>On ${b.games} games from ${esc(b.seasons)}, the closing line missed the final margin by <b>${num(b.margin_close, 2)}</b> points on average and the model missed by <b>${num(b.margin_model, 2)}</b>. Totals: <b>${num(b.total_close, 2)}</b> vs <b>${num(b.total_model, 2)}</b>. Taking the model's side against the closing spread went ${b.ats.w}-${b.ats.l} (${pct(atsPct, 1)}), short of the 52.4% needed at −110. <b>The model does not beat closing lines.</b></p>` : ""}
        ${c && c.spread ? `<h3>Where an edge can come from</h3><p>Lines move between Tuesday, when picks are posted, and kickoff. This season, when the Pinnacle spread moved after our Tuesday number, it moved toward the model in <b>${c.spread.toward} of ${c.spread.moved}</b> games, by ${signed(c.spread.clv, 2)} points on average. Totals moved toward the model in ${c.total.toward} of ${c.total.moved} (${signed(c.total.clv, 2)} points), which is no edge. That is why picks lock on Tuesday and are graded at Tuesday's line, and why line value is on the record page.</p>` : ""}
        <h3>How win chances are set</h3><p>The model's number is never taken at face value. Each pick starts from the market line and moves it part of the way toward the model: <b>${pct(c.k_spread)}</b> for spreads and <b>${pct(c.k_total)}</b> for totals, the share lines have actually moved this season (re-measured every week). Win chances use the spread of real NFL outcomes (±${M.sigma_margin} points) with extra weight on key numbers. Expected value then uses the best price across ${D.meta.books.length} books. Edges come out small, on purpose.</p>
        <h3>Picks of the week, the Golden Parlay and the +EV Lottery</h3><p>Picks of the week are the five strongest picks, one per game, positive expected value only; a week can have fewer. Strongest means the biggest edge relative to the payout, so a sliver of value on a +400 long shot does not outrank a real edge on a spread.</p>
        <p>Both parlays are built from the week's positive-EV picks, two or three legs from different games. The <b>Golden Parlay</b> is the best expected value priced +150 to +300, a ticket that should cash roughly a quarter to a third of the time; it stretches to +500 only when nothing fits, and some weeks have none. The <b>+EV Lottery</b> is the best expected value among 3 to 5 leg combinations priced over +500, with no cap: it misses most weeks and exists for the occasional big payout. It counts in the units total, so one hit can move the record a lot. ${pz ? `In testing on 2022–25, ${pz.profitable_holdout} of ${pz.rules} parlay rules made money, about what luck produces, and the rule that looked best on earlier seasons (${esc(pz.best_rule)}, ${pct(pz.best_tune_roi, 0)} ROI) went ${pz.best_hold_record} afterward.` : ""} A parlay only pays off long term when every leg beats its own price, so treat both as entertainment until the record says otherwise.</p>
        <h3>Things that did not hold up in testing</h3>
        <ul>${tr ? `<li>Hot streaks. Teams that had gone over in 75%+ of their games went over next time ${pct(tr.hot_over_next, 1)} of the time (${tr.hot_over_n} games). Teams covering 75%+ covered next ${pct(tr.hot_ats_next, 1)} (${tr.hot_ats_n}). The market already prices the streak, sometimes too much.</li>` : ""}
          <li>Letting each unit (pass, run, defense) update at its own speed. It fit the past better and predicted the future worse.</li>
          <li>Same-game combinations like favorite and over. They happen about as often as chance predicts.</li></ul>
        <h3>What the model does not know</h3>
        <ul><li>Injuries beyond the quarterback. A missing star receiver or left tackle is not in the numbers, so a large gap between the model and the market often means the market knows something.</li>
          <li>News after Tuesday. Lines that move on Friday injury news are not the model being right.</li>
          <li>Coaching changes, motivation and late-season resting.</li></ul>
        <h3>Rules</h3>
        <ul><li>Positive-EV straight picks risk 1 unit at the listed price; the Golden Parlay and the +EV Lottery each risk 0.5 units.</li>
          <li>From week 6, a negative-EV side is a ${term("lean", "lean")}: the board shows it with no stake, because a bet at that price is expected to lose. The record still counts every pick at 1 unit, leans included, so it stays the model's full record.</li>
          <li>Every positive-EV pick is also checked, because +EV is not the same as a good pick: Pinnacle must not have moved against it since it locked (when it moved toward the model's side, that side's later price still beat the close; when it moved against, it lost to the close), and no quarterback on either team can be Questionable or Doubtful. Pass both and it is a <b>good pick</b>; otherwise it is <b>+EV only</b>, with the reasons on the pick. Tested and left out: the size of the edge (game-line picks under 2% did as well at the close as bigger ones), reading Pinnacle's Tuesday juice into the price (it made picks worse), and the gap between the model and the market (it predicted nothing in 2022–25).</li>
          <li>${term("kelly", "Quarter Kelly")} sizes every positive-EV pick by its edge for the price (¼, ½, 1 or 2 units) and keeps its own record from week 1, apart from the flat one. In the 2022–26 backtest at closing prices it lost more per unit staked than flat 1u, because the model overrates its biggest edges; 2026's first five weeks went its way. It replaces flat units only if it keeps up from week 6 on.</li>
          <li>Picks lock when the week is published and are never changed. Each is graded at the line and price it was locked at.</li>
          <li>Results are graded Tuesday morning, after Monday night's game.</li></ul>
        <p class="fine">Data: nflverse play-by-play, schedules, rosters and injuries; FTN Data via nflverse (charting); Pro Football Reference (pressures); lines from OddsPapi; weather from Open-Meteo. Model output, not betting advice.</p>
      </div>`;

  // ===================================================================== player props

  // A call that goes against the model's own median is a line-shopping play: one book's number is off the market's.

  const roleTag = (p) => `<span class="role">${esc(p.role)}</span>${p.promoted ? ' <span class="tag promo" title="Moved up because a teammate who ranked above him last game is not playing">Promoted</span>' : ""}`;

  const MU_STAT = { pass_yds: "passing yards", rush_yds: "rushing yards", rec_yds: "receiving yards", receptions: "catches" };
  const ordn = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
  function muTag(mu, side, market, opp, pos) {

  function propPickChip(p) {
    return `<span class="chip${p.potw ? " potw" : ""}${p.promoted ? " promo" : ""}" data-tip="${esc(`EV ${signed(100 * p.ev, 1)}%. Stake 1u. Quarter Kelly, its own record: ${stakeU(p.kelly_u)}.` + checksTip(p.checks))}"><span class="m">${p.potw ? "Pick of the week" : PMK[p.market]}</span>

  const NO_PICK = '<span class="chip pass" title="Props for this game have locked; this player has no pick."><span class="m">Props</span><b>No pick</b></span>';

  function bestLean(pl) {   // a lean that clears the bar first, then the most value

      return cards ? `<div class="tg"><div class="tg-h">${badge(t, 1)} ${nick(t)}</div><div class="pcards n">${cards}</div></div>` : ""; };

  function renderProps() {
    if (!PR) return noProps();

  // ---------- how it works
  function anglesProse(A) {

    return `<h3>What simple angles have paid</h3>

      <p>What did pay was the price: a moneyline taken at the opening number on the side the market later moved toward returned ${r(A.open_close)} over ${num(A.open_close && A.open_close.n, 0)} bets. So the board chases prices that beat where the market settles (the Ladder's legs, the line shopping, EV at the close), not bet types. The model does not see those moves coming: lines moved toward it 46% of the time.</p>`;

  function renderNbaModel() {
    if (!N) return noNba();
    const B = (N.model || {}).backtest || {}, d = N.meta.dist || {};
    app.innerHTML = `<section class="hello"><h1>How the NBA board works</h1><p class="lede">The market sets the price; the board looks for the books that are off it. The model is shown, and decides a lean, but it has not earned the right to move a number.</p></section>
      <div class="prose">
        <h3>The price</h3>
        <p>Each game's fair line is Pinnacle's, with its margin taken out (${term("novig", "no-vig")}). The chance of covering any other number comes from how ${num(d.games, 0)} games since 2020-21 landed around their closing lines (a spread lands within ±${num(d.sigma_margin, 1)} points two times in three, a total within ±${num(d.sigma_total, 1)}). A pick is the side and book, DraftKings or FanDuel, with the most expected value at those chances: that is line shopping. When no side has value, the pick is the model's side as a ${term("lean", "lean")}: no stake, counted at 1u in the record.</p>
        <h3>Why the model does not set the price</h3>
        <p>Over six seasons of walk-forward tests (${esc(B.seasons || "2020-21 to 2025-26")}), team ratings plus who plays missed the final margin by ${num(B.mae_margin_model, 2)} points on average against the closing line's ${num(B.mae_margin_close, 2)}, and added nothing the close did not already know (β ${num(B.beta_spread, 2)}). In each season's first three weeks it did a little better (β ${num(B.beta_spread_first3wk, 2)} over ${num(B.games_first3wk, 0)} games), not enough to trust. So the board records whether each pick sat on the model's side, and the first checkup reads that.</p>
        <h3>Props</h3>
        <p>Each team's five starters and sixth man, in eight markets. Minutes come from his recent games, counted in league game days so the summer does not age last season (which counts for less as this one fills in), with a teammate ruled out handing over his minutes. After time out, the summer included, he plays fewer minutes for a few games: in 2023-24 and 2024-25 (out of sample) the first game back ran 4.5 to 5.3 minutes under a player's usual and fading over four games, and the board takes that off. Each stat per minute is pulled toward his own record over two seasons, itself pulled toward his position's average. Given minutes, a stat is a negative binomial whose spread was measured on 2025-26 starters: the ranges held 50% of outcomes in their middle half and 79% in their 10–90% band. The market sets the level: the model's rate is scaled until it gives Pinnacle's no-vig chance at Pinnacle's line (DraftKings and FanDuel's when Pinnacle has no line, or when both sit on the same side of a Pinnacle line that has stopped moving). A pick is the one market per player with 1% or more of value at DraftKings or FanDuel.</p>

          <li>Long shots: every "N+" rung is graded against its price, so whether books misprice them shows up without trusting the model's tail.</li>

  // ===================================================================== best bets: every pick in one ranked list
  // The landing view (user, 2026-10-20: "a new way to allow me to choose the best pick I can given the information
  // the model gives me as quickly and as accessible as possible"). Game lines and props together; each row is a
  // pick from its own section with nothing recomputed: its value for the price, its win chance against what the
  // price needs, the first context note, and the slip one tap away. A row opens in place for the rest.
  const MKN = { spread: "Spread", total: "Total", ml: "Moneyline" };
  const NUNIT = { pts: "points", reb: "rebounds", ast: "assists", fg3: "threes" };
  const winOf = (p) => p.p_win / Math.max(1 - (p.p_push || 0), 1e-9);
  const noteTxt = (n) => String(n).replace(/-(?=\d)/g, MINUS);
  const lineTxt = (x, sgn, d) => {   // a line as a bettor reads it: +2.5, PK, 58.5; d decimals for a fair number

  const BKC = { DraftKings: "dk", FanDuel: "fd", Pinnacle: "pin" };

  // The line-shop strip: the market's fair number and every book's line on one axis, from the bettor's side
  // (dir +1: a higher number is better for this bet, -1: lower), the pick's book ringed. Books on the same
  // number sit side by side.
  function shopStrip(o) {
    const books = (o.books || []).filter((b) => b.line != null);
    const vals = [...books.map((b) => b.line), o.me, o.fair].filter((v) => v != null);
    if (!books.length || vals.length < 2) return "";
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max(0.5, (hi - lo) * 0.2);
    lo -= pad; hi += pad;
    const X = (v) => ((100 * (v - lo)) / (hi - lo)).toFixed(2);
    const seen = {};
    const dots = books.map((b) => {
      const k = String(b.line), n = books.filter((x) => String(x.line) === k).length, j = (seen[k] = (seen[k] || 0) + 1) - 1;
      const me = b.name === o.meBook && b.line === o.me;
      return `<span class="mk ${BKC[b.name] || "pin"}${me ? " me" : ""}" style="left:calc(${X(b.line)}% + ${((j - (n - 1) / 2) * 13).toFixed(0)}px)" data-tip="${esc(b.name)}: ${lineTxt(b.line, o.sgn)}${b.px ? ", " + b.px : ""}${me ? " (the pick)" : ""}"></span>`;
    }).join("");
    const fair = o.fair == null ? "" : `<span class="mk fair" style="left:${X(o.fair)}%" data-tip="The market's fair number, the books' margin taken out: ${lineTxt(o.fair, o.sgn, 1)}"></span><span class="lab b" style="left:${X(o.fair)}%">Fair ${lineTxt(o.fair, o.sgn, 1)}</span>`;
    let say = "";
    if (o.fair != null) {
      const gap = (o.me - o.fair) * o.dir, u = o.unit ? " " + o.unit : "";
      say = Math.abs(gap) < 0.05 ? `${esc(o.meBook)} hangs the market's own number; the value is in the price.`
        : `${esc(o.meBook)}'s ${lineTxt(o.me, o.sgn)} is ${num(Math.abs(gap), 1)}${u} ${gap > 0 ? "better" : "worse"} for this bet than the fair ${lineTxt(o.fair, o.sgn, 1)}${gap > 0 ? "." : o.ev > 0 ? "; the price makes up for it." : "."}`;
    }
    return `<div class="lshop"><div class="ax">${fair}${dots}<span class="lab" style="left:${X(o.me)}%">Pick ${lineTxt(o.me, o.sgn)}</span></div>
      <div class="key"><span><i style="background:var(--s-home)"></i>DraftKings</span><span><i style="background:var(--s-away)"></i>FanDuel</span><span><i style="background:var(--muted)"></i>Pinnacle</span><span><i class="fair"></i>${term("fair", "Fair")}</span></div>
      ${say ? `<p class="note">${say}</p>` : ""}</div>`;
  }
  function lineShop(books, p, F) {   // game lines, both sports: spreads from the picked team's side, totals as they are
    if (p.market === "ml" || !books || !books.length) return null;
    if (p.market === "spread") {
      const sd = (s) => (s == null ? null : p.side === "home" ? -s : s);
      return { books: books.map((b) => ({ name: b.book, line: sd(b.spread), px: am(p.side === "home" ? b.spread_home : b.spread_away) })),
        fair: sd(F), me: p.line, meBook: p.book_name, dir: 1, unit: "points", sgn: true, ev: p.ev };
    }
    return { books: books.map((b) => ({ name: b.book, line: b.total, px: am(p.side === "over" ? b.over : b.under) })),
      fair: F, me: p.line, meBook: p.book_name, dir: p.side === "over" ? -1 : 1, unit: "points", sgn: false, ev: p.ev };
  }
  function nflFair(p) {   // the NFL's fair number: the market moved k of the way toward the model (board/market.py)
    const k = D.model.clv || {};
    if (p.market === "spread") return p.market_spread == null ? null : p.market_spread + (k.k_spread || 0) * ((p.model_margin == null ? p.market_spread : p.model_margin) - p.market_spread);
    return p.market_total == null ? null : p.market_total + (k.k_total || 0) * ((p.model_total == null ? p.market_total : p.model_total) - p.market_total);
  }

    if (new Set(games).size < games.length) return { same: true };
    const dec = xs.reduce((a, x) => a * x.dec, 1);
    const p = xs.every((x) => x.p != null) ? xs.reduce((a, x) => a * x.p, 1) : null;
    return { dec, p, ev: p == null ? null : p * dec - 1 };
  }
  (() => {   // the parlay arithmetic, checked on load: two -110 legs pay +264 and hit 25% at 50% each
    const P = parlayOf([{ dec: 1 + 100 / 110, p: 0.5, games: ["a"] }, { dec: 1 + 100 / 110, p: 0.5, games: ["b"] }]);
    console.assert(amOf(P.dec) === 264 && Math.abs(P.p - 0.25) < 1e-9 && parlayOf([{ dec: 2, games: ["a"] }, { dec: 2, games: ["a"] }]).same, "slip parlay math");
  })();
  function slipHtml() {
    const xs = [...SLIP.values()].sort((a, b) => (a.start || "").localeCompare(b.start || ""));
    const onBest = shownSec === "best" || shownSec === "nba-best";
    if (!xs.length) return `<section class="slip"><h3>Slip</h3><div class="empty-s"><p class="note">Tap <b>+</b> on any pick in Best bets to add it. The slip prices your picks as a parlay, shows how often that hits by the board's numbers, and stays on this device.</p>${onBest ? "" : `<a class="more" href="${shownSport === "nba" ? "#nba-best" : "#best"}">Best bets →</a>`}</div></section>`;
    const now = Date.now();
    const li = xs.map((x) => `<li><b>${label(x.label)}</b><span class="px">${am(x.american)}</span><button class="x" type="button" data-rm="${esc(x.key)}" aria-label="Remove ${esc(x.label)}">×</button><small>${esc(x.sub)}${x.start && Date.parse(x.start) <= now ? " · started" : ""}</small></li>`).join("");
    let tot = "";
    if (xs.length > 1) {
      const P = parlayOf(xs);
      tot = P.same ? '<div class="tot"><p class="note">Two picks are from the same game. Books price same-game parlays their own way, so there is no parlay price here.</p></div>'
        : `<div class="tot"><div class="big"><span>As a ${xs.length}-leg parlay</span><b>${am(amOf(P.dec))}</b></div>
          <div><span>Hits, by the board's numbers</span><b>${P.p == null ? "–" : pct(P.p, 1)}</b></div>
          <div><span>${term("ev", "EV")}</span><b class="${cls(P.ev)}">${P.ev == null ? "–" : evPct(P.ev)}</b></div>
          <div><span>1u pays</span><b>+${(P.dec - 1).toFixed(2)}u</b></div></div>`;
    }
    const known = xs.filter((x) => x.p != null), exp = known.reduce((a, x) => a + x.p * x.dec - 1, 0);
    return `<section class="slip"><h3>Slip <span class="cnt">${xs.length}</span><button class="btn" type="button" data-slip="clear">Clear</button></h3>
      <ul>${li}</ul>${tot}
      ${known.length ? `<p class="note">As straight bets at 1u each: <span class="${cls(exp)}">${units(exp)}</span> expected on ${known.length}u.</p>` : ""}
      <div class="acts"><button class="btn primary" type="button" data-slip="copy">Copy picks</button></div>
      <p class="fine">Hit chances multiply each pick's own, treating different games as independent. Not betting advice.</p></section>`;
  }
  function glance() {   // the season beside the slip: the record next to the picks being weighed
    const row = (k, r) => `<div class="gr"><span>${k}</span><b>${r && r.n ? `${rec(r)} · <span class="${cls(r.units)}">${units(r.units)}</span>` : "–"}</b></div>`;
    if (shownSport === "nba") {
      if (!N) return "";
      const R = N.record.live, P = ((N.props || {}).record || {}).live || {};
      return `<section class="glance"><h3>NBA ${esc(N.meta.label)} <a href="#nba-record">Record →</a></h3>${row("Game lines", R.all)}${row("Props", P.all)}${row("Picks of the day", R.potd)}${row("Golden parlay", R.parlay)}</section>`;
    }
    const A = D.record.all, P = PR ? PR.record.all : null;
    return `<section class="glance"><h3>NFL ${D.meta.season} <a href="#record">Record →</a></h3>${row("Game lines", A.all)}${row("Props", P && P.all)}${row("Picks of the week", A.potw)}${row("Golden parlay", A.parlay)}</section>`;
  }
  const RAILQ = window.matchMedia ? window.matchMedia("(min-width: 1240px)") : null;
  const railShown = () => !!(RAILQ && RAILQ.matches);
  const sheet = document.getElementById("sheet"), fab = document.getElementById("fab");
  function renderRail() {
    const html = slipHtml();
    document.getElementById("rail").innerHTML = `<div class="rail-in">${html}${glance()}</div>`;
    document.getElementById("sheet-in").innerHTML = html;
    fab.hidden = SLIP.size === 0;
    fab.querySelector("b").textContent = SLIP.size;
  }
  function openSheet() { if (sheet.open) return; renderRail(); if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", ""); }
  function closeSheet() { if (sheet.close) sheet.close(); else sheet.removeAttribute("open"); }
  fab.addEventListener("click", openSheet);
  sheet.addEventListener("click", (e) => {
    if (e.target.closest && e.target.closest(".grab")) { closeSheet(); return; }
    if (e.target !== sheet) return;
    const r = sheet.getBoundingClientRect();   // a click on the backdrop closes it
    if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) closeSheet();
  });
  if (RAILQ && RAILQ.addEventListener) RAILQ.addEventListener("change", () => { if (RAILQ.matches && sheet.open) closeSheet(); });
  function toast(html, action) {
    const box = document.getElementById("toasts");
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<span class="ok" aria-hidden="true">✓</span><span>${html}</span>${action ? `<button class="btn" type="button">${action[0]}</button>` : ""}`;
    box.appendChild(el);
    while (box.children.length > 3) box.firstElementChild.remove();
    const kill = () => { if (!el.isConnected) return; el.classList.add("out"); setTimeout(() => el.remove(), REDUCED ? 0 : 220); };
    const t = setTimeout(kill, action ? 4000 : 2400);
    if (action) el.querySelector("button").addEventListener("click", () => { clearTimeout(t); action[1](); kill(); });
  }
  function syncAdd(key) {
    const inS = SLIP.has(key);
    document.querySelectorAll("[data-add]").forEach((b) => {
      if (b.dataset.add !== key) return;
      b.setAttribute("aria-pressed", String(inS));
      if (b.classList.contains("add")) { b.innerHTML = inS ? TICK : PLUS; b.setAttribute("aria-label", (b.getAttribute("aria-label") || "").replace(/^(Add to|Remove from)/, inS ? "Remove from" : "Add to")); }
      else { b.textContent = inS ? "In the slip" : "Add to slip"; b.classList.toggle("primary", inS); }
    });
  }
  function slipToggle(key) {
    const it = ITEMS.get(key) || PZ.get(key);
    let added = false;
    if (SLIP.has(key)) SLIP.delete(key);
    else if (it) {
      SLIP.set(key, { key, sport: it.sport, label: it.kind === "prop" ? `${it.title} ${it.bet} ${it.mk.toLowerCase()}` : it.title,
        sub: [it.book, it.mt, it.when].filter(Boolean).join(" · "), american: it.american, dec: it.dec, p: it.p, games: it.games, start: it.start });
      added = true;
    } else return;
    saveSlip();
    syncAdd(key);
    renderRail();
    if (!fab.hidden && !REDUCED) { fab.classList.remove("bump"); void fab.offsetWidth; fab.classList.add("bump"); }
    if (!railShown()) toast(added ? `Added <b>${label(SLIP.get(key).label)}</b>` : "Removed from the slip", added ? ["View slip", openSheet] : null);
  }
  function slipText() {
    const xs = [...SLIP.values()];
    const out = xs.map((x) => `${x.label} ${am(x.american)} (${x.sub})`);
    if (xs.length > 1) { const P = parlayOf(xs); if (!P.same) out.push(`Parlay ${am(amOf(P.dec))}${P.p != null ? `, hits ${pct(P.p, 1)} by the board's numbers` : ""}`); }
    return out.join("\n").replace(/−/g, "-");
  }
  function copySlip() {
    const txt = slipText();
    const fallback = () => {   // a host that refuses the clipboard: select the text and copy the old way
      const ta = document.createElement("textarea");
      ta.value = txt; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? "Copied the picks" : "Copying is blocked here");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Copied the picks"), fallback);
    else fallback();
  }
  document.addEventListener("click", (e) => {
    const t = e.target;
    if (!t || !t.closest) return;
    const a = t.closest("[data-add]");
    if (a) { slipToggle(a.dataset.add); return; }
    const rm = t.closest("[data-rm]");
    if (rm) { const k = rm.dataset.rm; SLIP.delete(k); saveSlip(); syncAdd(k); renderRail(); return; }
    const act = t.closest("[data-slip]");
    if (!act) return;
    if (act.dataset.slip === "copy") copySlip();
    else if (act.dataset.slip === "clear") {
      const prev = [...SLIP.entries()];
      SLIP.clear(); saveSlip(); prev.forEach(([k]) => syncAdd(k)); renderRail();
      toast("Cleared the slip", ["Undo", () => { for (const [k, v] of prev) SLIP.set(k, v); saveSlip(); prev.forEach(([k]) => syncAdd(k)); renderRail(); }]);
    }
  });

  const VIEWS = { best: () => renderBest("nfl"), "nba-best": () => renderBest("nba"),
                  week: renderWeek, mine: renderMine, defense: renderDefense, record: renderRecord, model: renderModel,
                  props: renderProps, "props-players": renderPropsPlayers, "props-mine": renderPropsMine, "props-defense": renderDefense,
                  "props-record": renderPropsRecord, "props-model": renderPropsModel, live: renderLive, "live-model": renderLiveModel,
                  nba: renderNba, "nba-record": renderNbaRecord, "nba-model": renderNbaModel,
                  "nba-defense": renderNbaDefense, "nba-props-defense": renderNbaDefense,
                  "nba-props": renderNbaProps, "nba-props-record": renderNbaPropsRecord, "nba-props-model": renderNbaModel };
  // The board updates three times a week (the scheduled build, 10:05am Eastern): say which one is next.
  function nextUpdate(now) {
    const f = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" })
      .formatToParts(now).map((x) => [x.type, x.value]));
    const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(f.weekday), mins = Number(f.hour) * 60 + Number(f.minute);
    for (let d = 0; d < 8; d++) {
      const w = (dow + d) % 7;
      if ((w === 2 || w === 4 || w === 6) && (d > 0 || mins < 10 * 60 + 5)) return { 2: "Tuesday", 4: "Thursday", 6: "Saturday" }[w];
    }
    return "Tuesday";
  }
  const UPDATES = "The board updates three times a week. Tuesday 10am ET: last week graded, then the week's game-line picks lock (Tuesday prices are where the model's spread edge shows up). Thursday 10am ET: the Thursday game's props lock. Saturday 10am ET: Thursday night graded; Saturday-to-Monday props and the props Picks of the Week, Golden Parlay and Lottery lock.";
  function nflSub() { return `NFL model · ${D.meta.season} week ${D.meta.week} · <span data-tip="${UPDATES}" tabindex="0">next update ${nextUpdate(new Date())} 10am ET</span>`; }
  route();
  initDb();
})();
</script>
