name: publish

# Publish the board: render the page from the two committed payloads (board/nfl_data.json,
# board/nba_data.json) and deploy it. The scheduled builds (board.yml, nba.yml) start this after
# they push, a push from the laptop starts it, and it can be run by hand. One deploy at a time:
# a newer run replaces an older one, and every run renders the latest of both payloads.

on:
  push:
    branches: [main]
    paths: [board/nfl_data.json, board/nba_data.json, board/template.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m board.render
          python -m board.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
