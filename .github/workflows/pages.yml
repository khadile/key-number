name: publish

# Publish the committed board (no rebuild): render the page from the two committed payloads,
# for a board built on the laptop and pushed, or to republish by hand. The scheduled builds
# (board.yml, nba.yml) publish on their own.

on:
  push:
    branches: [main]
    paths: [board/nfl_data.json, board/nba_data.json, board/template.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m board.render
          python -m board.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
