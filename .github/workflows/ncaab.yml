name: ncaab

# The college basketball tracker (python -m ncaab.build): this season's early-season leads flagged on today's
# slate and graded at the closing line. Paper only, no stake. ESPN (scores and lines) is reachable from Actions,
# not from a cloud session's container.
#
# Every half hour from 10am to 6:30pm ET in winter (15:07-23:37 UTC), because GitHub drops scheduled firings (the
# first day's 15:37 firing never ran): each run locks the games with a line that have not started (once per game
# and lead, whichever run sees it first) and grades the finished ones, so extra or dropped firings are harmless.
# A run commits and publishes only when it locked or graded something, or the page is 3+ hours old.
#
# data/ncaab (the scoreboard and line caches) lives in the Actions cache; every part of it can be read again.

on:
  schedule:
    - cron: "7,37 15-23 * * *"
  workflow_dispatch:
    inputs:
      no_lock:
        description: "Grade and refresh the page only, lock nothing (a run by hand outside the firings)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ncaab-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore college data
        uses: actions/cache@v4
        with:
          path: data/ncaab
          key: ncaab-data-${{ github.run_id }}
          restore-keys: ncaab-data-

      - name: Build
        env:
          PYTHONIOENCODING: utf-8
        run: python -m ncaab.build ${{ inputs.no_lock && '--no-lock' || '' }}

      - name: Anything new?
        id: news
        run: |
          python - <<'EOF'
          import json, os, subprocess
          from datetime import datetime, timezone
          old = subprocess.run(["git", "show", "HEAD:board/ncaab_data.json"], capture_output=True, text=True).stdout
          age = 1e9
          if old.strip():
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(json.loads(old)["meta"]["generated"])).total_seconds()
          ledger = subprocess.run(["git", "status", "--porcelain", "--", "ledger"], capture_output=True, text=True).stdout.strip()
          go = bool(ledger) or age > 3 * 3600
          print(f"ledger changed: {bool(ledger)}; page age {age / 3600:.1f} h -> {'commit' if go else 'skip'}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"commit={'true' if go else 'false'}\n")
          EOF

      - name: Save the ledger and the payload
        if: steps.news.outputs.commit == 'true' || inputs.no_lock
        run: |
          git config user.name "key-number-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board/ncaab_data.json
          for f in ledger/ncaab_flags.jsonl ledger/ncaab_results.jsonl; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -m "NCAAB build $(TZ=America/New_York date '+%Y-%m-%d %H:%M')" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 15; done

      # pages.yml renders the page from every sport's committed payload, one deploy at a time
      - name: Publish the page
        if: steps.news.outputs.commit == 'true' || inputs.no_lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
