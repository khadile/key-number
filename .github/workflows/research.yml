name: research

# One-off studies that need what only Actions has: the OddsPapi key and the odds archive in the cache.
# Run by hand; each job prints tallies only (the log of a public repository is public, odds data stays out).
#
#   exchange-probe   python -m pipeline.exchange_probe  (free OddsPapi calls: do the exchanges carry props?)
#   nba-line-timing  python -m nba.line_timing          (the board's NBA line rule at other lock times)
#   exchange-test    python -m nba.exchange_test        (exchange prop prices against FanDuel's, on results)
#   nfl-dry-run      python -m board.build --dry-run --relock-study  (the whole NFL build, nothing written:
#                    a test of new rules on real data, plus the held-pick replay)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which study"
        type: choice
        options:
          - exchange-probe
          - nba-line-timing
          - nfl-dry-run
          - exchange-test
      games:
        description: "exchange-test: how many recent games"
        type: string
        default: "40"
      until:
        description: "exchange-test: stop fetching at this UTC time (HH:MM), so it never overlaps a build"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # read only: the builds own this cache, a study never writes it back
      - name: Restore NBA data
        if: inputs.job == 'nba-line-timing' || inputs.job == 'exchange-test'
        uses: actions/cache/restore@v4
        with:
          path: data/nba
          key: nba-data-research
          restore-keys: nba-data-

      - name: Restore nflverse downloads
        if: inputs.job == 'nfl-dry-run'
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: nflverse-research
          restore-keys: nflverse-

      - name: Restore the odds archive
        if: inputs.job == 'nfl-dry-run'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/oddspapi/history
            data/oddspapi/props
            data/oddspapi/request_log.jsonl
            data/oddspapi/open_close.parquet
            data/actionnetwork
          key: oddspapi-research
          restore-keys: oddspapi-

      - name: NFL dry run
        if: inputs.job == 'nfl-dry-run'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -m board.build --dry-run --relock-study

      # tallies of the held-pick replay; nothing else a dry run writes is kept
      - name: Save the held-pick replay
        if: inputs.job == 'nfl-dry-run'
        run: |
          git config user.name "key-number-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/nfl_relock_study.json
          git commit -m "NFL held-pick replay $(TZ=America/New_York date +%Y-%m-%d)" -- reports/nfl_relock_study.json || echo "nothing to commit"
          git checkout -q -- .   # drop what the dry run rewrote (payload, reports): only the replay's tallies are kept
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 15; done

      - name: Restore exchange snapshots
        if: inputs.job == 'exchange-test'
        uses: actions/cache/restore@v4
        with:
          path: data/nba_x
          key: nba-exchange-${{ github.run_id }}
          restore-keys: nba-exchange-

      - name: Exchange test
        if: inputs.job == 'exchange-test'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          GAMES: ${{ inputs.games }}
          UNTIL: ${{ inputs.until }}
        run: python -m nba.exchange_test --games "$GAMES" ${UNTIL:+--until "$UNTIL"}

      - name: Save exchange snapshots
        if: always() && inputs.job == 'exchange-test'
        uses: actions/cache/save@v4
        with:
          path: data/nba_x
          key: nba-exchange-${{ github.run_id }}

      - name: Exchange probe
        if: inputs.job == 'exchange-probe'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -m pipeline.exchange_probe

      - name: NBA line timing
        if: inputs.job == 'nba-line-timing'
        env:
          PYTHONIOENCODING: utf-8
        run: python -m nba.line_timing

      - name: Save the report
        if: inputs.job == 'nba-line-timing'
        run: |
          git config user.name "key-number-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/nba_line_timing.json
          git commit -m "NBA line timing study $(TZ=America/New_York date +%Y-%m-%d)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 15; done
