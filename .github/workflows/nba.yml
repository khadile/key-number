name: nba

# The NBA side of the Key Number board, built twice a day and published to GitHub Pages with the NFL side
# (python -m nba.build): from 10:30am ET (grade last night, lock the day's game lines and early props) and from
# 5:30pm ET (after the league's 5pm injury report: lock the rest of the props).
#
# GitHub's scheduler drops firings, so this fires every 15 minutes through each window (14-16 and 21-23 UTC
# cover both daylight and standard time) and nba/slot.py builds on the first firing past the slot's start.
#
# Odds data stays out of the repo: data/nba (hoopR downloads, the OddsPapi archive, ESPN box scores) lives in
# the Actions cache, and every part of it can be fetched again for the current season.

on:
  schedule:
    - cron: "7,22,37,52 14,15,16 * * *"
    - cron: "7,22,37,52 21,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build now even if this slot already ran"
        type: boolean
        default: false
      lock_now:
        description: "Lock now what today's later builds would lock"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Is a build due?
        id: slot
        run: python -m nba.slot --check ${{ inputs.force && '--force' || '' }}

      - name: Install
        if: steps.slot.outputs.due == 'true'
        run: pip install -r requirements.txt

      - name: Restore NBA data
        if: steps.slot.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: data/nba
          key: nba-data-${{ github.run_id }}
          restore-keys: nba-data-

      - name: Build
        if: steps.slot.outputs.due == 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python -m nba.build ${{ inputs.lock_now && '--lock-now' || '' }}
          python -m nba.slot --mark

      - name: Save the ledger and the NBA payload
        if: steps.slot.outputs.due == 'true'
        run: |
          git config user.name "key-number-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger board/nba_data.json   # the NBA ledgers appear with the first locks
          if [ -f board/nba_last.json ]; then git add board/nba_last.json; fi
          git commit -m "NBA ${{ steps.slot.outputs.slot }} build $(TZ=America/New_York date +%Y-%m-%d)" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 15; done

      - name: Render the page with both sports
        if: steps.slot.outputs.due == 'true'
        run: |
          python -m board.render
          python -m board.site

      - uses: actions/upload-pages-artifact@v3
        if: steps.slot.outputs.due == 'true'
        with:
          path: site

      - id: deploy
        if: steps.slot.outputs.due == 'true'
        uses: actions/deploy-pages@v4
